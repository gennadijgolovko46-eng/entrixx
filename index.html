<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTRIXX</title>

<style>
html,body{margin:0;background:#fff;overflow:hidden}
canvas{display:block;touch-action:none}
#date{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font:12px system-ui;color:rgba(0,0,0,.45)}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";
import { loadTradesFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");

let W=0,H=0;
function resize(){
  const dpr=window.devicePixelRatio||1;
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize); resize();

let days=[];
let dayIndex=0;
let trades=[];
let efficiency={limitTime:null};
let arrowValue=0;
let frozen=false;

// Build trading calendar (last 180 days)
const todayUTC = Math.floor(Date.now()/DAY)*DAY;
for(let i=180;i>=0;i--) days.push(todayUTC - i*DAY);

async function loadDay(){
  const day = days[dayIndex];
  trades = await loadTradesFromHyperliquid(ACCOUNT, day);

  const exits = trades.map(t=>t.exit_time);
  efficiency = computeEfficiency(exits);

  let B=0;
  frozen=false;
  for(const t of trades){
    if(efficiency.limitTime && t.exit_time>efficiency.limitTime){ frozen=true; break; }
    const hold=(t.exit_time-t.entry_time)/60000;
    B+=Math.max(-1,Math.min(1,hold-160));
  }
  arrowValue=Math.max(-1,Math.min(1,B/12));

  dateEl.textContent=new Date(day).toUTCString().slice(0,16);
}

await loadDay();

// Swipe days
let startX=null;
canvas.addEventListener("pointerdown",e=>startX=e.clientX);
canvas.addEventListener("pointerup",async e=>{
  const dx=e.clientX-startX;
  if(Math.abs(dx)>40){
    if(dx>0) dayIndex=Math.max(0,dayIndex-1);
    else dayIndex=Math.min(days.length-1,dayIndex+1);
    await loadDay();
  }
});

// Helpers
function timeToX(t){return((t-days[dayIndex])/DAY)*W}

function drawAtom(x,y,t){
  ctx.strokeStyle="#2DBE60";
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+(t.dir<0?160:-160)); ctx.stroke();
  const h=(t.exit_time-t.entry_time)/60000;
  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+(t.dir<0?h:-h)); ctx.stroke();
  ctx.fillRect(x-1,y-1,2,2);
}

// Render
function render(){
  ctx.clearRect(0,0,W,H);
  const d=days[dayIndex];
  drawEfficiencyLayer(ctx,{dayStart:d,dayEnd:d+DAY,limitTime:efficiency.limitTime,width:W,height:H});
  const baseY=H*0.55;
  for(const t of trades) drawAtom(timeToX(t.entry_time),baseY,t);
  drawBehaviorArrow(ctx,{value:arrowValue,frozen,width:W,height:H});
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
