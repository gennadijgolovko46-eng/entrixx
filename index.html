<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; }

#date {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="date"></div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");

/* Date */
const d = new Date();
dateEl.textContent = d.toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

/* Resize */
let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ===== ATOM CONFIG ===== */
const ATOM = 3;
const TAIL_W = 1;

const HOLD_COLOR   = "#2F6BFF";
const MARKET_COLOR = "#2DBE60";
const ATOM_COLOR   = "#000";

/* ===== TEST DATA: 10 ATOMS ===== */
const atoms = [
  { hold:  40, market: 120 },
  { hold:  20, market:  80 },
  { hold: -30, market: 100 },
  { hold:  10, market:  60 },
  { hold:  50, market: 140 },

  { hold: -20, market: -90 },
  { hold:  30, market: -60 },
  { hold: -10, market: -40 },
  { hold:  15, market: -80 },
  { hold:  25, market:  70 }
];

/* ===== DRAW ATOM ===== */
function drawAtom(x, y, hold, market, i) {
  const jitter = (i % 3 - 1); // -1,0,1
  const top = y - ATOM / 2;
  const bottom = y + ATOM / 2;

  ctx.lineWidth = TAIL_W;

  if (hold !== 0) {
    const s = Math.sign(hold) || 1;
    ctx.strokeStyle = HOLD_COLOR;
    ctx.beginPath();
    ctx.moveTo(x - 2 + jitter, s > 0 ? top : bottom);
    ctx.lineTo(x - 2 + jitter, s > 0 ? top - Math.abs(hold) : bottom + Math.abs(hold));
    ctx.stroke();
  }

  if (market !== 0) {
    const s = Math.sign(market) || 1;
    ctx.strokeStyle = MARKET_COLOR;
    ctx.beginPath();
    ctx.moveTo(x + 2 + jitter, s > 0 ? top : bottom);
    ctx.lineTo(x + 2 + jitter, s > 0 ? top - Math.abs(market) : bottom + Math.abs(market));
    ctx.stroke();
  }

  ctx.fillStyle = ATOM_COLOR;
  ctx.fillRect(
    Math.round(x - ATOM / 2),
    Math.round(y - ATOM / 2),
    ATOM,
    ATOM
  );
}

/* ===== RENDER ===== */
function render() {
  ctx.clearRect(0, 0, W, H);

  const baseY = H * 0.5;
  const startX = W * 0.5 - atoms.length * 6;

  for (let i = 0; i < atoms.length; i++) {
    drawAtom(
      startX + i * 8,   // плотность по X
      baseY,
      atoms[i].hold,
      atoms[i].market,
      i
    );
  }

  requestAnimationFrame(render);
}
render();
</script>

</body>
</html>
