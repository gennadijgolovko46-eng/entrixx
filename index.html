<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; touch-action: none; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

/* ====== CONSTANTS (UTC ONLY) ====== */
const DAY_MS = 24 * 60 * 60 * 1000;

/* ====== CANVAS ====== */
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ====== UTC DAY STATE ====== */
let currentDay = new Date(Date.UTC(
  new Date().getUTCFullYear(),
  new Date().getUTCMonth(),
  new Date().getUTCDate()
));

function formatUTCDate(d) {
  return d.toUTCString().slice(0, 16);
}

/* ====== TIME MAPPING ====== */
function timeToX(t, dayStart) {
  return ((t - dayStart) / DAY_MS) * W;
}

function xToUTCTime(x) {
  const totalMinutes = Math.floor((x / W) * 1440);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

/* ====== DATA (UTC DAYS) ====== */
const tradeDB = {
  "2026-01-09": [
    [9,0,9,10,1],
    [9,10,9,20,1],
    [9,20,9,30,1],
    [9,30,9,40,1],
    [9,40,9,50,1],
    [9,50,9,51,-1],
    [9,51,10,30,1]
  ],
  "2026-01-20": [
    [11,0,11,5,1],
    [11,5,11,6,-1],
    [11,6,12,0,1]
  ]
};

function buildTrades(dayUTC) {
  const key = dayUTC.toISOString().slice(0,10);
  const rows = tradeDB[key];
  if (!rows) return [];

  return rows.map(r => {
    const e = new Date(dayUTC);
    const x = new Date(dayUTC);
    e.setUTCHours(r[0], r[1], 0, 0);
    x.setUTCHours(r[2], r[3], 0, 0);
    return {
      entry_time: e.getTime(),
      exit_time: x.getTime(),
      dir: r[4]
    };
  });
}

/* ====== SWIPE (DAY PAGING) ====== */
let startX = null;
canvas.addEventListener("pointerdown", e => startX = e.clientX);
canvas.addEventListener("pointerup", e => {
  if (startX === null) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 60) {
    currentDay = new Date(currentDay.getTime() + (dx < 0 ? DAY_MS : -DAY_MS));
  }
  startX = null;
});

/* ====== TIME CURSOR ====== */
let cursorX = null;
canvas.addEventListener("pointermove", e => {
  cursorX = e.clientX;
  timeEl.textContent = xToUTCTime(cursorX);
  timeEl.style.opacity = 1;
});
canvas.addEventListener("pointerleave", () => {
  cursorX = null;
  timeEl.style.opacity = 0;
});

/* ====== DRAW ATOM ====== */
function drawAtom(x,y,tr){
  ctx.lineWidth = 1.2;

  ctx.strokeStyle = "#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x+1, y);
  ctx.lineTo(x+1, y - 160 * tr.dir);
  ctx.stroke();

  ctx.strokeStyle = "#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x-1, y);
  ctx.lineTo(x-1, y - 20 * tr.dir);
  ctx.stroke();

  ctx.fillStyle = "#000";
  ctx.fillRect(x-1, y-1, 2, 2);
}

/* ====== RENDER ====== */
function render(){
  ctx.clearRect(0,0,W,H);

  const dayStart = currentDay.getTime();
  dateEl.textContent = formatUTCDate(currentDay);

  const trades = buildTrades(currentDay);
  const exitTimes = trades.map(t => t.exit_time);
  const efficiency = computeEfficiency(exitTimes);

  drawEfficiencyLayer(ctx,{
    dayStart,
    dayEnd: dayStart + DAY_MS,
    limitTime: efficiency.limitTime,
    width: W,
    height: H
  });

  const baseY = H * 0.55;
  for (const tr of trades) {
    drawAtom(timeToX(tr.entry_time, dayStart), baseY, tr);
  }

  /* vertical time line */
  if (cursorX !== null) {
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.moveTo(cursorX, 0);
    ctx.lineTo(cursorX, H);
    ctx.stroke();
  }

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
