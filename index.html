<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTRIXX</title>
<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui;
  color:rgba(0,0,0,0.5);
}
#status{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui;
  color:#000;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="status">Loading…</div>
<div id="date"></div>

<script type="module">
import { loadTradesFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT="0x880ac484a1743862989a441d6d867238c7aa311c";
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const dateEl=document.getElementById("date");
const statusEl=document.getElementById("status");

let W,H;
function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

const DAY=86400000;
let trades=[];
let days=[];
let index=0;

let startX=null;

canvas.addEventListener("pointerdown",e=>startX=e.clientX);
canvas.addEventListener("pointerup",e=>{
  const dx=e.clientX-startX;
  if(Math.abs(dx)>40){
    if(dx>0) index=Math.max(0,index-1);
    else index=Math.min(days.length-1,index+1);
    updateDate();
  }
});

function updateDate(){
  dateEl.textContent=new Date(days[index]).toUTCString().slice(0,16);
}

function tradesForDay(){
  const d=days[index];
  return trades.filter(t=>t.entry_time>=d && t.entry_time<d+DAY);
}

function timeToX(t){
  return ((t-days[index])/DAY)*W;
}

function drawAtom(x,y,t){
  ctx.strokeStyle="#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x,y+(t.dir<0?160:-160));
  ctx.stroke();

  const h=(t.exit_time-t.entry_time)/60000;
  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x,y+(t.dir<0?h:-h));
  ctx.stroke();

  ctx.fillStyle="#000";
  ctx.fillRect(x-1,y-1,2,2);
}

function render(){
  ctx.clearRect(0,0,W,H);
  const baseY=H*0.55;
  for(const t of tradesForDay()){
    drawAtom(timeToX(t.entry_time),baseY,t);
  }
  requestAnimationFrame(render);
}

async function init(){
  trades=await loadTradesFromHyperliquid(ACCOUNT);

  if(!trades.length){
    statusEl.textContent="No trades";
    return;
  }

  const set=new Set();
  for(const t of trades){
    set.add(Math.floor(t.entry_time/DAY)*DAY);
  }

  days=[...set].sort((a,b)=>a-b);
  index=days.length-1;

  updateDate();
  statusEl.textContent="";
  render();
}

init();
</script>
</body>
</html>
