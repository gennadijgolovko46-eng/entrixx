<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

/* CONFIG */
const ACCOUNT_START_MS = new Date("2022-01-01T00:00:00Z").getTime();
const NOW_MS = Date.now();

/* initial view: last day */
let viewStart = NOW_MS - 24 * 60 * 60 * 1000;
let viewEnd   = NOW_MS;

/* date label */
dateEl.textContent = new Date().toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

/* resize */
let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* time mapping */
function timeToX(t) {
  const span = viewEnd - viewStart;
  if (span <= 0) return 0;
  return ((t - viewStart) / span) * W;
}

function xToTime(x) {
  const t = viewStart + (x / W) * (viewEnd - viewStart);
  const d = new Date(t);
  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");
  return h + ":" + m;
}

/* discrete scroll */
canvas.addEventListener("wheel", e => {
  e.preventDefault();

  const span = viewEnd - viewStart;
  const step = span * 0.1;

  if (e.deltaY > 0) {
    viewStart = Math.max(ACCOUNT_START_MS, viewStart - step);
    viewEnd   = Math.max(viewStart + step, viewEnd - step);
  } else {
    viewStart = Math.min(viewEnd - step, viewStart + step);
    viewEnd   = Math.min(NOW_MS, viewEnd + step);
  }
}, { passive:false });

/* pointer time */
let touchX = null;
canvas.addEventListener("pointerdown", e => touchX = e.clientX);
canvas.addEventListener("pointermove", e => {
  if (touchX !== null) touchX = e.clientX;
});
canvas.addEventListener("pointerup", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});
canvas.addEventListener("pointerleave", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});

/* helpers */
function t(h,m){
  const d = new Date();
  d.setHours(h,m,0,0);
  return d.getTime();
}

/* demo trades */
const trades = [
  { entry_time: t(9,0),  exit_time: t(9,10), dir: 1 },
  { entry_time: t(9,10), exit_time: t(9,20), dir: 1 },
  { entry_time: t(9,20), exit_time: t(9,30), dir: 1 },
  { entry_time: t(9,30), exit_time: t(9,40), dir: 1 },
  { entry_time: t(9,40), exit_time: t(9,50), dir: 1 },
  { entry_time: t(9,50), exit_time: t(9,51), dir:-1 },
  { entry_time: t(9,51), exit_time: t(10,30),dir: 1 },
  { entry_time: t(10,30),exit_time: t(10,31),dir:-1 }
];

/* efficiency */
const exitTimes = trades.map(t => t.exit_time).filter(Boolean);
const efficiency = computeEfficiency(exitTimes);

/* atom config */
const ATOM_SIZE = 2;
const BASE_Y_FACTOR = 0.55;

/* render */
function render(){
  ctx.clearRect(0,0,W,H);

  drawEfficiencyLayer(ctx,{
    dayStart: viewStart,
    dayEnd: viewEnd,
    limitTime: efficiency.limitTime,
    width: W,
    height: H
  });

  const baseY = H * BASE_Y_FACTOR;

  for(const tr of trades){
    ctx.globalAlpha =
      efficiency.limitTime && tr.exit_time > efficiency.limitTime
        ? 0.25
        : 1;

    const x = timeToX(tr.entry_time);
    ctx.fillStyle = "#000";
    ctx.fillRect(x-1, baseY-1, 2, 2);
  }
  ctx.globalAlpha = 1;

  if(touchX !== null){
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.moveTo(touchX,0);
    ctx.lineTo(touchX,H);
    ctx.stroke();
    timeEl.textContent = xToTime(touchX);
    timeEl.style.opacity = 1;
  }

  requestAnimationFrame(render);
}

render();
   </script>
