<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENTRIXX</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block;touch-action:none}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45);
}
#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
  background:rgba(255,255,255,.9);
  padding:2px 6px;
  border-radius:6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.06);
}
#debug{
  position:fixed;
  top:10px;
  left:10px;
  font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  background:rgba(255,255,255,.92);
  padding:8px 10px;
  border-radius:8px;
  box-shadow:0 0 0 1px rgba(0,0,0,.1);
  max-width:min(520px, calc(100vw - 24px));
  white-space:pre-wrap;
  word-break:break-word;
}
#err{
  position:fixed;
  left:10px;
  right:10px;
  bottom:50px;
  background:rgba(180,0,0,.92);
  color:#fff;
  font:12px ui-monospace, monospace;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 0 1px rgba(0,0,0,.15);
  display:none;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>
<div id="debug"></div>
<div id="err"></div>

<script>
(() => {
  const errEl = document.getElementById("err");
  function showErr(msg){
    errEl.style.display = "block";
    errEl.textContent = String(msg || "error");
  }
  window.addEventListener("error", (e) => {
    showErr((e && (e.message || e.error)) || "window error");
  });
  window.addEventListener("unhandledrejection", (e) => {
    showErr((e && e.reason) || "unhandled rejection");
  });
})();
</script>

<script>
const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const API = "https://twilight-breeze-fa50.gennadijgolovko46.workers.dev";

const DAY = 86400000;
const SWIPE_PX = 50;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");
const debugEl = document.getElementById("debug");
const errEl = document.getElementById("err");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

function showErr(msg){
  errEl.style.display = "block";
  errEl.textContent = String(msg || "error");
}

function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

function formatTime(t){
  const d = new Date(t);
  return String(d.getUTCHours()).padStart(2,"0")+":"+
         String(d.getUTCMinutes()).padStart(2,"0");
}

async function getFills(account, limit=1000){
  const url = `${API}/fills?account=${encodeURIComponent(account)}&limit=${limit}`;
  const r = await fetch(url, { cache: "no-store" });
  if(!r.ok) throw new Error("fills fetch failed: " + r.status);
  const j = await r.json();
  return Array.isArray(j.fills) ? j.fills : [];
}

function groupFills(fills){
  const trades = [];
  const open = Object.create(null);

  fills.sort((a,b) => (a.time||0) - (b.time||0));

  for(const f of fills){
    const sym = String(f.coin || "");
    const side = String(f.side || "");
    const px = Number(f.px);
    const t = Number(f.time);

    if(!sym || (side!=="B" && side!=="A") || !isFinite(px) || !isFinite(t)) continue;

    if(!open[sym]){
      open[sym] = { side, t, px };
      continue;
    }

    const o = open[sym];

    if(o.side !== side){
      trades.push({
        entry_time: o.t,
        exit_time: t,
        entry_price: o.px,
        exit_price: px,
        dir: o.side === "B" ? 1 : -1,
        sym
      });
      open[sym] = null;
    }
  }

  return trades;
}

async function loadData(account){
  const fills = await getFills(account, 1000);
  const trades = groupFills(fills);
  return { fills, trades };
}

let trades = [];
let days = [];
let dayIndex = 0;
let dayTrades = [];

let startX=null, currentX=null, isDown=false;

function tradesForDay(d0){
  const d1 = d0 + DAY;
  return trades.filter(t => t.exit_time > d0 && t.exit_time < d1);
}

function updateDay(){
  const d0 = days[dayIndex];
  dayTrades = tradesForDay(d0);
  dateEl.textContent = new Date(d0).toDateString();
  debugEl.textContent =
    "fills/trades ok\n"+
    "trades total: "+trades.length+"\n"+
    "days total: "+days.length+"\n"+
    "dayIndex: "+dayIndex+"\n"+
    "dayTrades: "+dayTrades.length;
}

canvas.addEventListener("pointerdown",e=>{
  isDown=true;
  startX=currentX=e.clientX;
  timeEl.style.opacity=1;
});

canvas.addEventListener("pointermove",e=>{
  currentX=e.clientX;
  const x=Math.max(0,Math.min(W,currentX));
  const t=days[dayIndex]+(x/W)*DAY;
  timeEl.textContent=formatTime(t);
  timeEl.style.left=x+"px";
});

canvas.addEventListener("pointerup",()=>{
  if(!isDown) return;
  const dx=currentX-startX;
  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0 && dayIndex>0) dayIndex--;
    if(dx<0 && dayIndex<days.length-1) dayIndex++;
    updateDay();
  }
  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

function drawAtom(t, d0){
  const x = ((t.exit_time - d0) / DAY) * W;
  const y = H * 0.55;

  const holdMin = Math.max(0.01, (t.exit_time - t.entry_time)/60000);
  const blueLen = Math.max(8, Math.min(160, holdMin));

  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = "#2F6BFF";
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(x+1.5, y);
  ctx.lineTo(x+1.5, y + t.dir * blueLen);
  ctx.stroke();

  // market tail placeholder: not computed yet
  // ctx.strokeStyle = "#2DBE60";
  // ctx.lineWidth = 1.2;
  // ctx.beginPath();
  // ctx.moveTo(x-1.5, y);
  // ctx.lineTo(x-1.5, y - 0);
  // ctx.stroke();
}

function render(){
  ctx.clearRect(0,0,W,H);

  const d0 = days[dayIndex];

  for(const t of dayTrades){
    drawAtom(t, d0);
  }

  if(currentX!==null){
    const x=Math.max(0,Math.min(W,currentX));
    ctx.strokeStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.moveTo(x+0.5,0);
    ctx.lineTo(x+0.5,H);
    ctx.stroke();
  }

  requestAnimationFrame(render);
}

(async function main(){
  try{
    const data = await loadData(ACCOUNT);
    trades = data.trades;

    if(!trades.length){
      dateEl.textContent = "No data";
      debugEl.textContent = "no trades";
      render();
      return;
    }

    let minT = Infinity;
    let maxT = 0;
    for(const t of trades){
      if(t.entry_time < minT) minT = t.entry_time;
      if(t.exit_time > maxT) maxT = t.exit_time;
    }

    const startDay = dayFloorUTC(minT);
    const endDay = dayFloorUTC(maxT);

    days = [];
    for(let d=startDay; d<=endDay; d+=DAY) days.push(d);
    dayIndex = days.length - 1;

    updateDay();
    render();
  }catch(e){
    showErr(e && (e.stack || e.message) ? (e.stack || e.message) : String(e));
    debugEl.textContent = "init failed";
  }
})();
</script>
</body>
</html>
