<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTRIXX</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{
  display:block;
  touch-action:none;
}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45)
}
#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";
import { loadTradesFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;
const SWIPE_PX = 60;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

let trades=[], days=[], dayIndex=0;
let efficiency={limitTime:null};
let arrowValue=0, frozen=false;

// pointer state
let pointerId=null;
let startX=null;
let currentX=null;

dateEl.textContent="Loading…";

function dayFloor(t){
  const d = new Date(t);
  d.setHours(0,0,0,0);
  return d.getTime();
}

async function init(){
  trades = await loadTradesFromHyperliquid(ACCOUNT);
  if(!trades.length){
    dateEl.textContent="No trades";
    return;
  }

  // ---- calendar days (continuous) ----
  let minT = Infinity;
  let maxT = -Infinity;
  for(const t of trades){
    minT = Math.min(minT, t.entry_time, t.exit_time);
    maxT = Math.max(maxT, t.entry_time, t.exit_time);
  }

  const startDay = dayFloor(minT);
  const endDay   = dayFloor(maxT);

  days = [];
  for(let d = startDay; d <= endDay; d += DAY){
    days.push(d);
  }
  dayIndex = days.length - 1;

  // ---- efficiency ----
  const exits = trades.map(t=>t.exit_time).sort((a,b)=>a-b);
  efficiency = computeEfficiency(exits);

  let B=0;
  for(const t of trades){
    if(efficiency.limitTime && t.exit_time > efficiency.limitTime){
      frozen=true;
      break;
    }
    const hold=(t.exit_time-t.entry_time)/60000;
    B+=Math.max(-1,Math.min(1,hold-160));
  }
  arrowValue=Math.max(-1,Math.min(1,B/12));

  updateDate();
}
await init();

function updateDate(){
  const d = new Date(days[dayIndex]);
  dateEl.textContent = d.toDateString();
}

function tradesForDay(){
  const d0 = days[dayIndex];
  const d1 = d0 + DAY;
  return trades.filter(t =>
    t.entry_time < d1 && t.exit_time > d0
  );
}

function timeToX(t){
  return ((t - days[dayIndex]) / DAY) * W;
}

function drawAtom(x,y,t){
  ctx.strokeStyle="#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x+1,y);
  ctx.lineTo(x+1,y+(t.dir<0?160:-160));
  ctx.stroke();

  const h=(t.exit_time-t.entry_time)/60000;
  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x-1,y);
  ctx.lineTo(x-1,y+(t.dir<0?h:-h));
  ctx.stroke();

  ctx.fillStyle="#000";
  ctx.fillRect(x-1,y-1,2,2);
}

/* POINTER */

canvas.addEventListener("pointerdown", e=>{
  pointerId=e.pointerId;
  canvas.setPointerCapture(pointerId);
  startX=e.clientX;
  currentX=startX;
});

canvas.addEventListener("pointermove", e=>{
  if(e.pointerId!==pointerId || startX===null) return;

  currentX=e.clientX;

  const x=Math.max(0,Math.min(W,currentX));
  const t=days[dayIndex] + (x/W)*DAY;
  const dt=new Date(t);

  timeEl.textContent =
    String(dt.getHours()).padStart(2,"0")+":"+
    String(dt.getMinutes()).padStart(2,"0");
  timeEl.style.opacity=1;
});

canvas.addEventListener("pointerup", e=>{
  if(e.pointerId!==pointerId) return;

  const dx=currentX-startX;
  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0) dayIndex=Math.max(0,dayIndex-1);
    else dayIndex=Math.min(days.length-1,dayIndex+1);
    updateDate();
  }

  canvas.releasePointerCapture(pointerId);
  pointerId=null;
  startX=null;
  currentX=null;
  timeEl.style.opacity=0;
});

canvas.addEventListener("pointercancel", ()=>{
  if(pointerId!==null) canvas.releasePointerCapture(pointerId);
  pointerId=null;
  startX=null;
  currentX=null;
  timeEl.style.opacity=0;
});

/* RENDER */

function render(){
  ctx.clearRect(0,0,W,H);

  const d0=days[dayIndex];
  drawEfficiencyLayer(ctx,{
    dayStart:d0,
    dayEnd:d0+DAY,
    limitTime:efficiency.limitTime,
    width:W,
    height:H
  });

  const baseY=H*0.55;
  for(const t of tradesForDay()){
    drawAtom(timeToX(t.entry_time),baseY,t);
  }

  drawBehaviorArrow(ctx,{
    value:arrowValue,
    frozen,
    width:W,
    height:H
  });

  if(startX!==null && currentX!==null){
    const x=Math.max(0,Math.min(W,currentX));
    ctx.save();
    ctx.strokeStyle="rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.moveTo(x+0.5,0);
    ctx.lineTo(x+0.5,H);
    ctx.stroke();
    ctx.restore();
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
