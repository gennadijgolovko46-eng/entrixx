<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENTRIXX</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block;touch-action:none}

#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45);
}

#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
}

/* compact details panel (max 4 lines) */
#details{
  position:fixed;
  top:10px;
  left:10px;
  max-width:260px;
  padding:10px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.78);
  line-height:1.25;
  white-space:pre;
  pointer-events:none;
  opacity:0;
  transform:translateY(-4px);
  transition:opacity .14s ease, transform .14s ease;
}
#details.show{
  opacity:1;
  transform:translateY(0);
}

/* keep debug in code, hidden by default */
.hidden{
  display:none !important;
}
#debug{
  position:fixed;
  top:10px;
  left:10px;
  max-width:320px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.85);
  border:1px solid rgba(0,0,0,.08);
  font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  color:rgba(0,0,0,.75);
  white-space:pre;
  pointer-events:none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<div id="details"></div>

<!-- debug kept (hidden) -->
<div id="debug" class="hidden"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";
import { loadDataFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;
const SWIPE_PX = 50;

const API = "https://twilight-breeze-fa50.gennadijgolovko46.workers.dev";
const MARKET_WINDOW_MS = 8 * 60 * 60 * 1000;

const FLIP_SHIFT_PX = 10;

// tap selection
const TAP_MAX_DX = 8;   // px
const HIT_R = 28;       // px hit radius

let selectedAtom = null;
let selectedDetailsText = "";

// ---------------- canvas ----------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");
const detailsEl = document.getElementById("details");
const debugEl = document.getElementById("debug");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

// ---------------- state ----------------
let trades = [];
let fills = [];
let days = [];
let dayIndex = 0;

let efficiency = { limitTime:null };
let arrowValue = 0;
let frozen = false;

let startX=null, currentX=null, isDown=false;

// cache market window results: key = coin|exit_time
const marketCache = new Map();
let marketLoading = false;

// ---------------- utils ----------------
function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

function formatTime(t){
  const d = new Date(t);
  return String(d.getUTCHours()).padStart(2,"0")+":"+
         String(d.getUTCMinutes()).padStart(2,"0");
}

function clamp(min,v,max){
  return Math.max(min, Math.min(max, v));
}

function tradesForDay(d0){
  const d1 = d0 + DAY;
  return trades.filter(t =>
    t.exit_time > d0 &&
    t.entry_time < d1
  );
}

function num(x){
  const v = Number(x);
  return Number.isFinite(v) ? v : NaN;
}

function formatHold(ms){
  if(!Number.isFinite(ms) || ms < 0) return "n/a";
  const mins = Math.round(ms / 60000);
  if(mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
}

function formatPct(p){
  if(!Number.isFinite(p)) return "n/a";
  return (p * 100).toFixed(3) + "%";
}

/* =========================
   FIX #107: safe label
   - If coin is not a normal ticker, show "Market: #id"
   ========================= */
function isTickerLike(s){
  if(!s) return false;
  const t = String(s).trim();
  if(!t) return false;
  if(/^\d+$/.test(t)) return false;        // pure number
  if(/^@\d+$/.test(t)) return false;       // @107
  if(!/^[A-Z0-9._:-]{2,15}$/.test(t)) return false;
  return /[A-Z]/.test(t);
}

function coinLabel(t){
  const raw = String(t.coin || "").trim();
  if(isTickerLike(raw)) return { label: "Coin", value: raw };

  const m = raw.match(/@?(\d+)/);
  if(m) return { label: "Market", value: `#${m[1]}` };

  return { label: "Market", value: "n/a" };
}

async function fetchMarketWindow(coin, exitTime){
  const key = `${coin}|${exitTime}`;
  if (marketCache.has(key)) return marketCache.get(key);

  const url = `${API}/market_window?coin=${encodeURIComponent(coin)}&t=${Number(exitTime)}&windowMs=${MARKET_WINDOW_MS}`;
  const r = await fetch(url, { method: "GET" });
  if (!r.ok) {
    marketCache.set(key, { hi: NaN, lo: NaN });
    return { hi: NaN, lo: NaN };
  }
  const j = await r.json();
  const hi = num(j && j.hi);
  const lo = num(j && j.lo);
  const res = { hi, lo };
  marketCache.set(key, res);
  return res;
}

function marketMovePct(t){
  const exitPx = num(t.exit_price);
  if(!Number.isFinite(exitPx) || exitPx <= 0) return NaN;

  const hi = num(t.mkt_up);
  const lo = num(t.mkt_dn);

  const upMove = Number.isFinite(hi) ? Math.max(0, hi - exitPx) : 0;
  const dnMove = Number.isFinite(lo) ? Math.max(0, exitPx - lo) : 0;

  const move = Math.max(upMove, dnMove);
  if(!(move > 0)) return 0;

  return move / exitPx;
}

async function hydrateMarketForDay(dayTrades){
  if (marketLoading) return;
  marketLoading = true;

  try {
    const need = [];
    for (const t of dayTrades) {
      const coin = String(t.coin || "").trim();
      const exitTime = num(t.exit_time);
      if (!coin || !Number.isFinite(exitTime)) continue;

      const key = `${coin}|${exitTime}`;
      const has = marketCache.has(key);
      const hasFields = Number.isFinite(num(t.mkt_up)) || Number.isFinite(num(t.mkt_dn));
      if (!has && !hasFields) need.push(t);
    }

    const batch = need.slice(0, 40);

    for (const t of batch) {
      const coin = String(t.coin || "").trim();
      const exitTime = num(t.exit_time);
      if (!coin || !Number.isFinite(exitTime)) continue;

      const { hi, lo } = await fetchMarketWindow(coin, exitTime);
      if (Number.isFinite(hi)) t.mkt_up = hi;
      if (Number.isFinite(lo)) t.mkt_dn = lo;

      if (selectedAtom === t) updateDetailsPanel();
    }
  } finally {
    marketLoading = false;
  }
}

// ---------------- init ----------------
async function init(){
  const data = await loadDataFromHyperliquid(ACCOUNT);
  trades = data.trades || [];
  fills = data.fills || [];

  if(!trades.length){
    dateEl.textContent = "No data";
    return;
  }

  let minT = Infinity;
  for(const t of trades) minT = Math.min(minT, Number(t.entry_time));

  const startDay = dayFloorUTC(minT);
  const endDay   = dayFloorUTC(Date.now());

  for(let d=startDay; d<=endDay; d+=DAY) days.push(d);
  dayIndex = days.length - 1;

  updateDay();
}
await init();

// ---------------- per-day recompute ----------------
function computeBehavior(dayTrades, eff){
  let v = 0;
  for(const t of dayTrades){
    if(eff.limitTime && t.exit_time > eff.limitTime) break;
    const hold = (t.exit_time - t.entry_time)/60000;
    v += Math.max(-1, Math.min(1, hold - 160));
  }
  return Math.max(-1, Math.min(1, v/12));
}

// mark flip-open only inside current day (second trade in pair)
function markFlipOpen(dayTrades){
  for(const t of dayTrades) t._flipOpen = false;

  dayTrades.sort((a,b)=>
    (Number(a.entry_time) - Number(b.entry_time)) ||
    (Number(a.exit_time)  - Number(b.exit_time))
  );

  const EPS_T = 0.5;
  const EPS_P = 1e-9;

  for(let i=1;i<dayTrades.length;i++){
    const prev = dayTrades[i-1];
    const cur  = dayTrades[i];

    const prevExitT = Number(prev.exit_time);
    const curEntryT = Number(cur.entry_time);

    const prevExitPx = Number(prev.exit_price);
    const curEntryPx = Number(cur.entry_price);

    if(!Number.isFinite(prevExitT) || !Number.isFinite(curEntryT)) continue;

    const timeMatch = Math.abs(prevExitT - curEntryT) <= EPS_T;
    if(!timeMatch) continue;

    const priceMatch =
      Number.isFinite(prevExitPx) && Number.isFinite(curEntryPx)
        ? Math.abs(prevExitPx - curEntryPx) <= EPS_P
        : true;

    const dirFlip = (Number(prev.dir) === -Number(cur.dir));

    if(priceMatch && dirFlip){
      cur._flipOpen = true;
    }
  }
}

/* ==========================================
   SELECTION FIX (NO ARCH CHANGES)
   - drawAtom() stores exact draw coordinates:
       t._px = xExit; t._py = y; t._dayKey = d0;
   - pickNearestAtom() uses those coordinates when available,
     so tap selects exactly what was drawn (1:1).
   Safe fallbacks keep old behavior if coords are missing.
   ========================================== */
function dayKeyOfCurrent(){
  return days.length ? days[dayIndex] : 0;
}

function pickNearestAtom(xClient, yClient){
  if(!days.length) return null;
  const d0 = dayKeyOfCurrent();
  const dayTrades = tradesForDay(d0);
  if(!dayTrades.length) return null;

  let best = null;
  let bestDist = Infinity;

  for(const t of dayTrades){
    // prefer stored draw coords (truth)
    const hasPxPy =
      Number.isFinite(t._px) &&
      Number.isFinite(t._py) &&
      t._dayKey === d0;

    let dx, dy;

    if(hasPxPy){
      dx = xClient - t._px;
      dy = yClient - t._py;
    } else {
      // safe fallback (old method)
      const exit = Number(t.exit_time);
      if(!Number.isFinite(exit)) continue;

      const yAtom = H * 0.55;
      const baseX = ((clamp(d0, exit, d0 + DAY) - d0) / DAY) * W;
      const xExit = baseX + (t._flipOpen ? FLIP_SHIFT_PX : 0);

      dx = xClient - xExit;
      dy = yClient - yAtom;
    }

    const dist = Math.hypot(dx, dy);
    if(dist < bestDist){
      bestDist = dist;
      best = t;
    }
  }

  if(best && bestDist <= HIT_R) return best;
  return null;
}

// ---- compact details panel ----
function updateDetailsPanel(){
  if(!selectedAtom){
    selectedDetailsText = "";
    detailsEl.textContent = "";
    detailsEl.classList.remove("show");
    return;
  }

  const { label, value } = coinLabel(selectedAtom);
  const dir = (Number(selectedAtom.dir) === -1) ? "SHORT" : "LONG";

  const entryT = num(selectedAtom.entry_time);
  const exitT  = num(selectedAtom.exit_time);
  const hold = (Number.isFinite(entryT) && Number.isFinite(exitT)) ? formatHold(exitT - entryT) : "n/a";

  const mp = marketMovePct(selectedAtom);
  const marketLine = Number.isFinite(mp) ? `Market move: ${formatPct(mp)}` : "Market move: ...";

  const lines = [
    `${label}: ${value}`,
    `Direction: ${dir}`,
    `Hold: ${hold}`,
    marketLine
  ];

  const text = lines.join("\n");

  if(text !== selectedDetailsText){
    selectedDetailsText = text;
    detailsEl.textContent = text;
  }
  detailsEl.classList.add("show");
}

// optional hidden debug (kept)
function setBaseDebugText(){
  debugEl.textContent =
    "fills/trades ok\n"+
    "fills total: " + fills.length + "\n" +
    "trades total: " + trades.length + "\n" +
    "days total: " + days.length + "\n" +
    "dayIndex: " + dayIndex + "\n" +
    "dayTrades: " + (days.length ? tradesForDay(days[dayIndex]).length : 0) + "\n" +
    "limitTime: " + (efficiency.limitTime ?? "null");
}

function updateDay(){
  const d0 = days[dayIndex];
  const dayTrades = tradesForDay(d0);

  markFlipOpen(dayTrades);

  const exits = dayTrades.map(t=>t.exit_time).sort((a,b)=>a-b);
  efficiency = computeEfficiency(exits);

  arrowValue = computeBehavior(dayTrades, efficiency);
  frozen = !!efficiency.limitTime;

  dateEl.textContent = new Date(d0).toDateString();

  // if selected atom is not in this day -> drop it
  if(selectedAtom){
    const inDay = (Number(selectedAtom.exit_time) > d0) && (Number(selectedAtom.entry_time) < d0 + DAY);
    if(!inDay) selectedAtom = null;
  }

  updateDetailsPanel();
  setBaseDebugText();

  hydrateMarketForDay(dayTrades);
}

// ---------------- input ----------------
canvas.addEventListener("pointerdown",e=>{
  if(!days.length) return;
  isDown=true;
  startX=currentX=e.clientX;
  timeEl.style.opacity=1;
});

canvas.addEventListener("pointermove",e=>{
  if(!days.length) return;
  if(!isDown) return;
  currentX=e.clientX;
  const x=Math.max(0,Math.min(W,currentX));
  const t=days[dayIndex]+(x/W)*DAY;
  timeEl.textContent=formatTime(t);
  timeEl.style.left=x+"px";
});

canvas.addEventListener("pointerup",(e)=>{
  if(!isDown) return;

  const dx = currentX - startX;

  // tap: select atom (uses stored draw coords when available)
  if(Math.abs(dx) <= TAP_MAX_DX){
    selectedAtom = pickNearestAtom(currentX, e.clientY);
    updateDetailsPanel();
  }

  // swipe: change day
  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0 && dayIndex>0) dayIndex--;
    if(dx<0 && dayIndex<days.length-1) dayIndex++;

    selectedAtom = null;
    selectedDetailsText = "";

    updateDay();
  }

  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

canvas.addEventListener("pointercancel",()=>{
  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

// ---------------- drawing ----------------
function drawAtom(t, d0){
  const d1 = d0 + DAY;

  const entry = Number(t.entry_time);
  const exit  = Number(t.exit_time);
  if(!isFinite(entry) || !isFinite(exit)) return;

  const y = H * 0.55;

  const baseX = ((clamp(d0, exit, d1) - d0) / DAY) * W;
  const xExit = baseX + (t._flipOpen ? FLIP_SHIFT_PX : 0);

  // store exact draw coordinates (truth for selection)
  t._px = xExit;
  t._py = y;
  t._dayKey = d0;

  // selected ring (subtle)
  if(selectedAtom === t){
    ctx.strokeStyle = "rgba(0,0,0,.16)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(xExit, y, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // atom dot
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(xExit, y, 3, 0, Math.PI * 2);
  ctx.fill();

  // BLUE tail (HOLD)
  const dirBlue = (t.dir === -1 ? -1 : 1);
  const holdMin = Math.max(0, (exit - entry) / 60000);
  const blueLen = clamp(8, holdMin, 160);

  ctx.strokeStyle = "#2F6BFF";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(xExit, y);
  ctx.lineTo(xExit, y + dirBlue * blueLen);
  ctx.stroke();

  // GREEN tail (MARKET)
  const exitPx = Number(t.exit_price);
  const mUp = Number(t.mkt_up);
  const mDn = Number(t.mkt_dn);

  if(isFinite(exitPx) && (isFinite(mUp) || isFinite(mDn))) {
    const upMove = isFinite(mUp) ? Math.max(0, mUp - exitPx) : 0;
    const dnMove = isFinite(mDn) ? Math.max(0, exitPx - mDn) : 0;
    const move = Math.max(upMove, dnMove);

    if(move > 0) {
      const dirGreen = (upMove >= dnMove) ? 1 : -1;
      const movePct = move / exitPx;
      const greenLen = clamp(6, movePct * 4000, 160);
      const xG = xExit + 4;

      ctx.strokeStyle = "#2DBE60";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xG, y);
      ctx.lineTo(xG, y + dirGreen * greenLen);
      ctx.stroke();
    }
  }

  ctx.lineWidth = 1;
}

function render(){
  ctx.clearRect(0,0,W,H);

  if(!days.length){
    requestAnimationFrame(render);
    return;
  }

  const d0 = days[dayIndex];

  drawEfficiencyLayer(ctx,{
    dayStart:d0,
    dayEnd:d0+DAY,
    limitTime:efficiency.limitTime,
    width:W,
    height:H
  });

  const dayTrades = tradesForDay(d0);
  for(const t of dayTrades) drawAtom(t,d0);

  if(isDown && currentX!==null){
    const x=Math.max(0,Math.min(W,currentX));
    ctx.strokeStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.moveTo(x+0.5,0);
    ctx.lineTo(x+0.5,H);
    ctx.stroke();
  }

  drawBehaviorArrow(ctx,{
    value:arrowValue,
    frozen,
    width:W,
    height:H
  });

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
