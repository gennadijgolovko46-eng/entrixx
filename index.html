<!doctype html>
<html>
  <head>
    <title>ENTRIXX</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #fff;
        color: #000;
      }

      h1 {
  margin-bottom: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  font-size: 28px;
      }

      p {
  margin-bottom: 28px;
  opacity: 0.55;
  font-size: 14px;
      }

      button {
  padding: 10px 22px;
  font-size: 13px;
  opacity: 0.6;
  border: 1px solid #ccc;
  background: transparent;
      }
    </style>
  </head>

  <body>
    <h1>ENTRIXX</h1>

<p>Mirror of trading decisions</p>

<button id="connectBtn">Connect Wallet</button>

<script>
  const btn = document.getElementById('connectBtn');

  btn.addEventListener('click', async () => {
    if (!window.ethereum) {
      alert('No wallet found');
      return;
    }

    btn.textContent = 'Connecting…';

    try {
      // deposit will be called here

      btn.textContent = 'Preparing deposit…';
btn.disabled = true;
    } catch (e) {
      btn.textContent = 'Connect Wallet';
      btn.disabled = false;
    }
  });
</script>

<p>You can withdraw ENTRIXX at any time via the contract.</p>
