<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    overflow: hidden;
  }

  canvas {
    display: block;
  }

  /* Date (always visible, bottom) */
  #date {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font: 12px system-ui, sans-serif;
    color: rgba(0,0,0,0.45);
    pointer-events: none;
    white-space: nowrap;
  }

  /* Time (touch only, top) */
  #time-float {
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font: 12px system-ui, sans-serif;
    color: rgba(0,0,0,0.85);
    pointer-events: none;
    opacity: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="time-float"></div>
<div id="date"></div>

<script>
/* ===============================
   ENTRIXX V1
   One Atom Test
   =============================== */

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

const dateLabel = document.getElementById("date");
const timeFloat = document.getElementById("time-float");

/* ---------- Date ---------- */
const now = new Date();
dateLabel.textContent = now.toLocaleDateString("en-US", {
  weekday: "long",
  day: "numeric",
  month: "short",
  year: "numeric"
});

/* ---------- Resize (DPR-safe) ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ---------- Gesture ---------- */
let touchX = null;

canvas.addEventListener("pointerdown", e => {
  touchX = e.clientX;
});
canvas.addEventListener("pointermove", e => {
  if (touchX !== null) touchX = e.clientX;
});
canvas.addEventListener("pointerup", () => {
  touchX = null;
});
canvas.addEventListener("pointerleave", () => {
  touchX = null;
});

/* ---------- X -> Time ---------- */
function xToTime(x) {
  const ratio = x / window.innerWidth;
  const totalMinutes = Math.round(ratio * 1440);
  const h = String(Math.floor(totalMinutes / 60)).padStart(2, "0");
  const m = String(totalMinutes % 60).padStart(2, "0");
  return h + ":" + m;
}

/* ===============================
   ATOM CONFIG (TEST)
   =============================== */

// Exit time in minutes from day start (example: 10:30)
const ATOM_TIME_MIN = 10 * 60 + 30;

// Visual baseline (middle of screen)
const BASELINE_Y = 0.55;

// Geometry
const ATOM_SIZE = 6;
const TAIL_WIDTH = 1;

// Colors
const HOLD_COLOR   = "rgba(47,107,255,0.85)";
const MARKET_COLOR = "rgba(45,190,96,0.85)";
const ATOM_COLOR   = "#000000";

// Values (px)
// Positive = up, Negative = down
const HOLD_VALUE   = 40;    // minimal visible fact
const MARKET_VALUE = -120;  // 8h market move

const MIN_HOLD = 4;

/* ===============================
   LAYERS
   =============================== */

function layerTrades() {
  const x = (ATOM_TIME_MIN / 1440) * window.innerWidth;
  const baseY = BASELINE_Y * canvas.height;

  const topY = baseY - ATOM_SIZE / 2;
  const bottomY = baseY + ATOM_SIZE / 2;

  ctx.lineWidth = TAIL_WIDTH;

  // HOLD (blue)
  const holdSign = Math.sign(HOLD_VALUE) || 1;
  const holdAbs = Math.max(Math.abs(HOLD_VALUE), MIN_HOLD);
  const holdEndY = holdSign > 0 ? topY - holdAbs : bottomY + holdAbs;

  ctx.strokeStyle = HOLD_COLOR;
  ctx.beginPath();
  ctx.moveTo(x - ATOM_SIZE / 2, holdSign > 0 ? topY : bottomY);
  ctx.lineTo(x - ATOM_SIZE / 2, holdEndY);
  ctx.stroke();

  // MARKET (green)
  const marketSign = Math.sign(MARKET_VALUE) || 1;
  const marketAbs = Math.abs(MARKET_VALUE);
  const marketEndY = marketSign > 0 ? topY - marketAbs : bottomY + marketAbs;

  ctx.strokeStyle = MARKET_COLOR;
  ctx.beginPath();
  ctx.moveTo(x + ATOM_SIZE / 2, marketSign > 0 ? topY : bottomY);
  ctx.lineTo(x + ATOM_SIZE / 2, marketEndY);
  ctx.stroke();

  // ATOM (square)
  ctx.fillStyle = ATOM_COLOR;
  ctx.fillRect(
    x - ATOM_SIZE / 2,
    baseY - ATOM_SIZE / 2,
    ATOM_SIZE,
    ATOM_SIZE
  );
}

function layerTimeMarker() {
  if (touchX === null) {
    timeFloat.style.opacity = 0;
    return;
  }

  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(touchX, 0);
  ctx.lineTo(touchX, canvas.height);
  ctx.stroke();

  timeFloat.textContent = xToTime(touchX);
  timeFloat.style.opacity = 1;
}

/* ---------- Render ---------- */
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  layerTrades();
  layerTimeMarker();

  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
