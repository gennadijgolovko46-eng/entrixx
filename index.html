<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    overflow: hidden;
  }

  canvas { display: block; }

  #date {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font: 12px system-ui, sans-serif;
    color: rgba(0,0,0,0.45);
    pointer-events: none;
    white-space: nowrap;
  }

  #time-float {
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font: 12px system-ui, sans-serif;
    color: rgba(0,0,0,0.85);
    pointer-events: none;
    opacity: 0;
    white-space: nowrap;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="time-float"></div>
<div id="date"></div>

<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const dateLabel = document.getElementById("date");
const timeFloat = document.getElementById("time-float");

/* Date */
const now = new Date();
dateLabel.textContent = now.toLocaleDateString("en-US", {
  weekday: "long",
  day: "numeric",
  month: "short",
  year: "numeric"
});

/* Resize */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* Gesture */
let touchX = null;
canvas.addEventListener("pointerdown", e => touchX = e.clientX);
canvas.addEventListener("pointermove", e => { if (touchX !== null) touchX = e.clientX; });
canvas.addEventListener("pointerup", () => touchX = null);
canvas.addEventListener("pointerleave", () => touchX = null);

/* X -> Time */
function xToTime(x) {
  const ratio = x / window.innerWidth;
  const m = Math.round(ratio * 1440);
  return String(Math.floor(m / 60)).padStart(2,"0") + ":" + String(m % 60).padStart(2,"0");
}

/* ===============================
   ATOM (FIXED VISIBILITY)
   =============================== */

const ATOM_TIME_MIN = 10 * 60 + 30; // 10:30
const BASELINE_Y = 0.5;

const ATOM_SIZE = 8;
const TAIL_WIDTH = 1;

const HOLD_COLOR   = "#2F6BFF";
const MARKET_COLOR = "#2DBE60";
const ATOM_COLOR   = "#000000";

const HOLD_VALUE   = 40;
const MARKET_VALUE = -120;
const MIN_HOLD     = 6;

function layerTrades() {
  const x = (ATOM_TIME_MIN / 1440) * window.innerWidth;
  const baseY = BASELINE_Y * canvas.height;

  const top = baseY - ATOM_SIZE / 2;
  const bottom = baseY + ATOM_SIZE / 2;

  ctx.lineWidth = TAIL_WIDTH;

  // HOLD
  const hSign = Math.sign(HOLD_VALUE) || 1;
  const hLen = Math.max(Math.abs(HOLD_VALUE), MIN_HOLD);
  ctx.strokeStyle = HOLD_COLOR;
  ctx.beginPath();
  ctx.moveTo(x - ATOM_SIZE / 2, hSign > 0 ? top : bottom);
  ctx.lineTo(x - ATOM_SIZE / 2, hSign > 0 ? top - hLen : bottom + hLen);
  ctx.stroke();

  // MARKET
  const mSign = Math.sign(MARKET_VALUE) || 1;
  const mLen = Math.abs(MARKET_VALUE);
  ctx.strokeStyle = MARKET_COLOR;
  ctx.beginPath();
  ctx.moveTo(x + ATOM_SIZE / 2, mSign > 0 ? top : bottom);
  ctx.lineTo(x + ATOM_SIZE / 2, mSign > 0 ? top - mLen : bottom + mLen);
  ctx.stroke();

  // ATOM
  ctx.fillStyle = ATOM_COLOR;
  ctx.fillRect(x - ATOM_SIZE / 2, baseY - ATOM_SIZE / 2, ATOM_SIZE, ATOM_SIZE);
}

/* Time marker */
function layerTimeMarker() {
  if (touchX === null) {
    timeFloat.style.opacity = 0;
    return;
  }
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(touchX, 0);
  ctx.lineTo(touchX, canvas.height);
  ctx.stroke();
  timeFloat.textContent = xToTime(touchX);
  timeFloat.style.opacity = 1;
}

/* Render */
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  layerTrades();
  layerTimeMarker();
  requestAnimationFrame(render);
}
render();
</script>

</body>
</html>
