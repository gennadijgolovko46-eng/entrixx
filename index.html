<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; touch-action: none; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

/* resize */
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* helpers */
function t(h,m){
  const d = new Date(currentDay);
  d.setHours(h,m,0,0);
  return d.getTime();
}

/* day control */
const DAY_MS = 24 * 60 * 60 * 1000;
let currentDay = new Date();
currentDay.setHours(0,0,0,0);

/* trades (demo) */
function getTradesForDay() {
  return [
    { entry_time: t(9,0),  exit_time: t(9,10), dir: 1 },
    { entry_time: t(9,10), exit_time: t(9,20), dir: 1 },
    { entry_time: t(9,20), exit_time: t(9,30), dir: 1 },
    { entry_time: t(9,30), exit_time: t(9,40), dir: 1 },
    { entry_time: t(9,40), exit_time: t(9,50), dir: 1 },
    { entry_time: t(9,50), exit_time: t(9,51), dir:-1 },
    { entry_time: t(9,51), exit_time: t(10,30),dir: 1 }
  ];
}

/* mapping */
function timeToX(t) {
  return ((t - dayStart) / DAY_MS) * W;
}

function xToTime(x) {
  const minutes = Math.floor((x / W) * 1440);
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

/* swipe paging */
let startX = null;

canvas.addEventListener("pointerdown", e => {
  startX = e.clientX;
});

canvas.addEventListener("pointerup", e => {
  if (startX === null) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 50) {
    currentDay = new Date(currentDay.getTime() + (dx < 0 ? DAY_MS : -DAY_MS));
    currentDay.setHours(0,0,0,0);
  }
  startX = null;
});

/* time cursor */
canvas.addEventListener("pointermove", e => {
  timeEl.textContent = xToTime(e.clientX);
  timeEl.style.opacity = 1;
});

canvas.addEventListener("pointerleave", () => {
  timeEl.style.opacity = 0;
});

/* atom drawing */
function drawAtom(x,y,tr){
  ctx.lineWidth = 1.2;

  ctx.strokeStyle = "#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x+1, y);
  ctx.lineTo(x+1, y - 160 * tr.dir);
  ctx.stroke();

  ctx.strokeStyle = "#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x-1, y);
  ctx.lineTo(x-1, y - 20 * tr.dir);
  ctx.stroke();

  ctx.fillStyle = "#000";
  ctx.fillRect(x-1, y-1, 2, 2);
}

/* render */
let trades = [];
let efficiency = { limitTime: null };
let dayStart = 0;

function render() {
  ctx.clearRect(0,0,W,H);

  dayStart = currentDay.getTime();
  dateEl.textContent = currentDay.toDateString();

  trades = getTradesForDay();
  const exitTimes = trades.map(t=>t.exit_time);
  efficiency = computeEfficiency(exitTimes);

  drawEfficiencyLayer(ctx,{
    dayStart,
    dayEnd: dayStart + DAY_MS,
    limitTime: efficiency.limitTime,
    width: W,
    height: H
  });

  const baseY = H * 0.55;

  for (const tr of trades) {
    drawAtom(timeToX(tr.entry_time), baseY, tr);
  }

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
