<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; }

#date {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 8px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="time"></div>
<div id="date"></div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

const now = new Date();
dateEl.textContent = now.toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* time interaction */
let touchX = null;

canvas.addEventListener("pointerdown", e => {
  touchX = e.clientX;
});
canvas.addEventListener("pointermove", e => {
  if (touchX !== null) touchX = e.clientX;
});
canvas.addEventListener("pointerup", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});
canvas.addEventListener("pointerleave", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});

function xToTime(x) {
  const minutes = Math.round((x / W) * 1440);
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

/* model */
const ATOM_SIZE = 2;
const TAIL_WIDTH = 1.2;
const MIN_BLUE = 2;
const MARKET_HEIGHT = 160;

const COLOR_BLUE = "#2F6BFF";
const COLOR_GREEN = "#2DBE60";
const COLOR_BLACK = "#000";
const COLOR_RED = "#D10000";

const atoms = [
  { hold: 40,  dir: -1 },
  { hold: 90,  dir: 1  },
  { liquid: true },
  { hold: 120, dir: 1  },
  { hold: 20,  dir: -1 }
];

function drawLiquidation(x, y) {
  ctx.strokeStyle = COLOR_RED;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 5);
  ctx.lineTo(x + 5, y + 5);
  ctx.moveTo(x + 5, y - 5);
  ctx.lineTo(x - 5, y + 5);
  ctx.stroke();
}

function drawAtom(x, y, a) {
  const top = y - ATOM_SIZE / 2;
  const bottom = y + ATOM_SIZE / 2;

  ctx.lineWidth = TAIL_WIDTH;

  ctx.strokeStyle = COLOR_GREEN;
  ctx.beginPath();
  ctx.moveTo(x + ATOM_SIZE / 2, a.dir < 0 ? bottom : top);
  ctx.lineTo(
    x + ATOM_SIZE / 2,
    a.dir < 0 ? bottom + MARKET_HEIGHT : top - MARKET_HEIGHT
  );
  ctx.stroke();

  if (!a.liquid) {
    const blueLen = Math.max(a.hold, MIN_BLUE);
    ctx.strokeStyle = COLOR_BLUE;
    ctx.beginPath();
    ctx.moveTo(x - ATOM_SIZE / 2, a.dir < 0 ? bottom : top);
    ctx.lineTo(
      x - ATOM_SIZE / 2,
      a.dir < 0 ? bottom + blueLen : top - blueLen
    );
    ctx.stroke();
  }

  ctx.fillStyle = COLOR_BLACK;
  ctx.fillRect(
    x - ATOM_SIZE / 2,
    y - ATOM_SIZE / 2,
    ATOM_SIZE,
    ATOM_SIZE
  );

  if (a.liquid) drawLiquidation(x, y);
}

function drawTime() {
  if (touchX === null) return;

  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(touchX, 0);
  ctx.lineTo(touchX, H);
  ctx.stroke();

  timeEl.textContent = xToTime(touchX);
  timeEl.style.opacity = 1;
}

function render() {
  ctx.clearRect(0, 0, W, H);

  const baseY = H * 0.55;
  const gap = 16;
  let startX = W / 2 - (atoms.length - 1) * gap / 2;

  for (let i = 0; i < atoms.length; i++) {
    drawAtom(startX + i * gap, baseY, atoms[i]);
  }

  drawTime();
  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
