<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; }

#date {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 8px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="time"></div>
<div id="date"></div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

const now = new Date();
dateEl.textContent = now.toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

let W = 0, H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* time interaction */
let touchX = null;

canvas.addEventListener("pointerdown", e => touchX = e.clientX);
canvas.addEventListener("pointermove", e => {
  if (touchX !== null) touchX = e.clientX;
});
canvas.addEventListener("pointerup", resetTime);
canvas.addEventListener("pointerleave", resetTime);

function resetTime() {
  touchX = null;
  timeEl.style.opacity = 0;
}

function xToTime(x) {
  const minutes = Math.round((x / W) * 1440);
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

/* constants */
const ATOM_SIZE = 2;
const TAIL_WIDTH = 1.2;
const MARKET_HEIGHT = 160;
const MIN_BLUE = 2;

const COLOR_BLUE = "#2F6BFF";
const COLOR_GREEN = "#2DBE60";
const COLOR_BLACK = "#000";
const COLOR_RED = "#D10000";
const COLOR_BEHAVIOR = "rgba(0,0,0,0.35)";

/* data */
const atoms = [
  { exit: 100, hold: 40, market: 120, dir: -1 },
  { exit: 240, hold: 90, market: 140, dir: 1  },
  { exit: 300, liquid: true },
  { exit: 360, hold: 20, market: 100, dir: -1 },
  { exit: 480, hold: 60, market: 130, dir: 1  }
];

/* efficiency limit */
const limitIndex = atoms.findIndex(a => a.liquid);

/* draw */
function drawLiquidation(x, y) {
  ctx.strokeStyle = COLOR_RED;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 5);
  ctx.lineTo(x + 5, y + 5);
  ctx.moveTo(x + 5, y - 5);
  ctx.lineTo(x - 5, y + 5);
  ctx.stroke();
}

function drawAtom(x, y, a, faded) {
  ctx.globalAlpha = faded ? 0.25 : 1;

  ctx.lineWidth = TAIL_WIDTH;

  if (!a.liquid) {
    ctx.strokeStyle = COLOR_GREEN;
    ctx.beginPath();
    ctx.moveTo(x + ATOM_SIZE/2, y);
    ctx.lineTo(x + ATOM_SIZE/2, y - a.market * a.dir);
    ctx.stroke();

    ctx.strokeStyle = COLOR_BLUE;
    ctx.beginPath();
    ctx.moveTo(x - ATOM_SIZE/2, y);
    ctx.lineTo(x - ATOM_SIZE/2, y - Math.max(a.hold, MIN_BLUE) * a.dir);
    ctx.stroke();
  }

  ctx.fillStyle = COLOR_BLACK;
  ctx.fillRect(x - ATOM_SIZE/2, y - ATOM_SIZE/2, ATOM_SIZE, ATOM_SIZE);

  if (a.liquid) drawLiquidation(x, y);

  ctx.globalAlpha = 1;
}

/* behavior line */
function drawBehavior(xs, baseY) {
  let value = 0;
  ctx.strokeStyle = COLOR_BEHAVIOR;
  ctx.lineWidth = 1;
  ctx.beginPath();

  for (let i = 0; i < limitIndex; i++) {
    const a = atoms[i];
    const delta = a.hold - a.market;
    value += Math.max(-20, Math.min(20, delta * 0.05));
    const y = baseY - value;
    if (i === 0) ctx.moveTo(xs[i], y);
    else ctx.lineTo(xs[i], y);
  }

  ctx.stroke();
}

/* efficiency bar */
function drawEfficiencyBar(xs) {
  const y = H - 4;
  ctx.lineWidth = 4;

  ctx.strokeStyle = "#2DBE60";
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(xs[limitIndex], y);
  ctx.stroke();

  ctx.strokeStyle = "#D10000";
  ctx.beginPath();
  ctx.moveTo(xs[limitIndex], y - 6);
  ctx.lineTo(xs[limitIndex], y + 6);
  ctx.stroke();

  ctx.strokeStyle = "#bbb";
  ctx.beginPath();
  ctx.moveTo(xs[limitIndex], y);
  ctx.lineTo(W, y);
  ctx.stroke();
}

/* render */
function render() {
  ctx.clearRect(0, 0, W, H);

  const baseY = H * 0.55;
  const xs = atoms.map(a => (a.exit / 1440) * W);

  drawBehavior(xs, baseY);

  for (let i = 0; i < atoms.length; i++) {
    drawAtom(xs[i], baseY, atoms[i], i > limitIndex);
  }

  drawEfficiencyBar(xs);

  if (touchX !== null) {
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.moveTo(touchX, 0);
    ctx.lineTo(touchX, H);
    ctx.stroke();

    timeEl.textContent = xToTime(touchX);
    timeEl.style.opacity = 1;
  }

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
