<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;   /* ⬅️ КЛЮЧЕВО */
  background: #fff;
}

#wrap {
  position: fixed;    /* ⬅️ КЛЮЧЕВО */
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
}
</style>
</head>

<body>
  <div id="wrap">
    <canvas id="layer1"></canvas>
    <canvas id="layer2"></canvas>
    <canvas id="layer3"></canvas>
  </div>

  <script src="mirror.js"></script>
</body>
</html>
