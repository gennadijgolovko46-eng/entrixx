<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 14px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";

/* canvas */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

/* date */
dateEl.textContent = new Date().toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

/* resize */
let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* time range */
const ACCOUNT_START_MS = new Date("2022-01-01T00:00:00Z").getTime();
const NOW_MS = Date.now();

let viewStart = NOW_MS - 24 * 60 * 60 * 1000;
let viewEnd   = NOW_MS;

/* time mapping */
function timeToX(t) {
  const span = viewEnd - viewStart;
  if (span <= 0) return -1000;
  return ((t - viewStart) / span) * W;
}

function xToTime(x) {
  const t = viewStart + (x / W) * (viewEnd - viewStart);
  const d = new Date(t);
  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");
  return h + ":" + m;
}

/* wheel scroll (desktop) */
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const span = viewEnd - viewStart;
  const step = span * 0.15;

  if (e.deltaY > 0) {
    viewStart = Math.max(ACCOUNT_START_MS, viewStart - step);
    viewEnd   = Math.max(viewStart + step, viewEnd - step);
  } else {
    viewStart = Math.min(viewEnd - step, viewStart + step);
    viewEnd   = Math.min(NOW_MS, viewEnd + step);
  }
}, { passive:false });

/* drag scroll (touch + mouse) */
let dragX = null;
let dragView = null;

canvas.addEventListener("pointerdown", e => {
  dragX = e.clientX;
  dragView = { start: viewStart, end: viewEnd };
});

canvas.addEventListener("pointermove", e => {
  if (dragX === null) return;

  const dx = e.clientX - dragX;
  const span = dragView.end - dragView.start;
  const dt = -(dx / W) * span;

  viewStart = dragView.start + dt;
  viewEnd   = dragView.end   + dt;

  if (viewStart < ACCOUNT_START_MS) {
    const s = ACCOUNT_START_MS - viewStart;
    viewStart += s;
    viewEnd   += s;
  }

  if (viewEnd > NOW_MS) {
    const s = viewEnd - NOW_MS;
    viewStart -= s;
    viewEnd   -= s;
  }
});

canvas.addEventListener("pointerup", () => {
  dragX = null;
  dragView = null;
});

canvas.addEventListener("pointerleave", () => {
  dragX = null;
  dragView = null;
});

/* pointer time */
let touchX = null;
canvas.addEventListener("pointerdown", e => touchX = e.clientX);
canvas.addEventListener("pointermove", e => {
  if (touchX !== null) touchX = e.clientX;
});
canvas.addEventListener("pointerup", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});
canvas.addEventListener("pointerleave", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});

/* helpers */
function t(h,m){
  const d = new Date();
  d.setHours(h,m,0,0);
  return d.getTime();
}

/* demo trades */
const trades = [
  { entry_time: t(9, 0),  exit_time: t(9,10), dir: 1 },
  { entry_time: t(9,10), exit_time: t(9,20), dir: 1 },
  { entry_time: t(9,20), exit_time: t(9,30), dir: 1 },
  { entry_time: t(9,30), exit_time: t(9,40), dir: 1 },
  { entry_time: t(9,40), exit_time: t(9,50), dir: 1 },
  { entry_time: t(9,50), exit_time: t(9,51), dir:-1 },
  { entry_time: t(9,51), exit_time: t(10,30),dir: 1 },
  { entry_time: t(10,30),exit_time: t(10,31),dir:-1 }
];

/* efficiency */
const exitTimes = trades.map(t => t.exit_time).filter(Boolean).sort((a,b)=>a-b);
const efficiency = computeEfficiency(exitTimes);

/* atom config */
const ATOM_SIZE = 2;
const TAIL_WIDTH = 1.2;
const MIN_BLUE = 2;
const MARKET_HEIGHT = 160;

/* draw atom */
function drawAtom(x, y, tr) {
  const top = y - ATOM_SIZE / 2;
  const bottom = y + ATOM_SIZE / 2;

  ctx.lineWidth = TAIL_WIDTH;

  ctx.strokeStyle = "#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x + ATOM_SIZE / 2, tr.dir < 0 ? bottom : top);
  ctx.lineTo(
    x + ATOM_SIZE / 2,
    tr.dir < 0 ? bottom + MARKET_HEIGHT : top - MARKET_HEIGHT
  );
  ctx.stroke();

  const hold = Math.max(
    MIN_BLUE,
    Math.min(Math.round((tr.exit_time - tr.entry_time) / 60000), 480)
  );
  ctx.strokeStyle = "#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x - ATOM_SIZE / 2, tr.dir < 0 ? bottom : top);
  ctx.lineTo(
    x - ATOM_SIZE / 2,
    tr.dir < 0 ? bottom + hold : top - hold
  );
  ctx.stroke();

  ctx.fillStyle = "#000";
  ctx.fillRect(
    x - ATOM_SIZE / 2,
    y - ATOM_SIZE / 2,
    ATOM_SIZE,
    ATOM_SIZE
  );
}

/* render */
function render() {
  ctx.clearRect(0,0,W,H);

  drawEfficiencyLayer(ctx,{
    dayStart: viewStart,
    dayEnd: viewEnd,
    limitTime: efficiency.limitTime,
    width: W,
    height: H
  });

  const baseY = H * 0.55;

  for (const tr of trades) {
    ctx.globalAlpha =
      efficiency.limitTime && tr.exit_time > efficiency.limitTime
        ? 0.25
        : 1;
    drawAtom(timeToX(tr.entry_time), baseY, tr);
  }
  ctx.globalAlpha = 1;

  if (touchX !== null) {
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.moveTo(touchX,0);
    ctx.lineTo(touchX,H);
    ctx.stroke();
    timeEl.textContent = xToTime(touchX);
    timeEl.style.opacity = 1;
  }

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
