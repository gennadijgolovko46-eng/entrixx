<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 14px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";

/* ===== base ===== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");

const now = new Date();
dateEl.textContent = now.toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ===== helpers ===== */
function t(h, m) {
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d.getTime();
}

const dayStart = new Date();
dayStart.setHours(0, 0, 0, 0);
const DAY_START_MS = dayStart.getTime();

function timeToX(ts) {
  const span = Date.now() - DAY_START_MS;
  if (span <= 0) return 0;
  return ((ts - DAY_START_MS) / span) * W;
}

/* ===== atom config ===== */
const ATOM_SIZE = 2;
const TAIL_WIDTH = 1.2;
const MARKET_HEIGHT = 160;
const MIN_BLUE = 2;

const COLOR_BLUE = "#2F6BFF";
const COLOR_GREEN = "#2DBE60";
const COLOR_BLACK = "#000";

/* ===== demo trades (real rhythm break) ===== */
const trades = [
  { entry_time: t(9, 0),  exit_time: t(9,10), dir: 1 },
  { entry_time: t(9,10), exit_time: t(9,20), dir: 1 },
  { entry_time: t(9,20), exit_time: t(9,30), dir: 1 },
  { entry_time: t(9,30), exit_time: t(9,40), dir: 1 },
  { entry_time: t(9,40), exit_time: t(9,50), dir: 1 },

  { entry_time: t(9,50), exit_time: t(9,51), dir: -1 },
  { entry_time: t(9,51), exit_time: t(10,30), dir: 1 },
  { entry_time: t(10,30), exit_time: t(10,31), dir: -1 }
];

/* ===== efficiency ===== */
const exitTimes = trades
  .map(tr => tr.exit_time)
  .filter(Boolean)
  .sort((a, b) => a - b);

const efficiency = computeEfficiency(exitTimes);
console.log("limitTime =", efficiency.limitTime);

/* ===== atom draw ===== */
function drawAtom(x, y, tr) {
  ctx.save();
  ctx.lineWidth = TAIL_WIDTH;

  const top = y - ATOM_SIZE / 2;
  const bottom = y + ATOM_SIZE / 2;

  /* market tail */
  ctx.strokeStyle = COLOR_GREEN;
  ctx.beginPath();
  ctx.moveTo(x + ATOM_SIZE / 2, tr.dir > 0 ? top : bottom);
  ctx.lineTo(
    x + ATOM_SIZE / 2,
    tr.dir > 0 ? top - MARKET_HEIGHT : bottom + MARKET_HEIGHT
  );
  ctx.stroke();

  /* hold tail */
  const hold = Math.max(
    MIN_BLUE,
    Math.min((tr.exit_time - tr.entry_time) / 60000, 480)
  );

  ctx.strokeStyle = COLOR_BLUE;
  ctx.beginPath();
  ctx.moveTo(x - ATOM_SIZE / 2, tr.dir > 0 ? top : bottom);
  ctx.lineTo(
    x - ATOM_SIZE / 2,
    tr.dir > 0 ? top - hold : bottom + hold
  );
  ctx.stroke();

  /* atom square */
  ctx.fillStyle = COLOR_BLACK;
  ctx.fillRect(
    x - ATOM_SIZE / 2,
    y - ATOM_SIZE / 2,
    ATOM_SIZE,
    ATOM_SIZE
  );

  ctx.restore();
}

/* ===== render ===== */
function render() {
  ctx.clearRect(0, 0, W, H);

  drawEfficiencyLayer(ctx, {
    dayStart: DAY_START_MS,
    dayEnd: Date.now(),
    limitTime: efficiency.limitTime,
    width: W,
    height: H
  });

  const baseY = H * 0.55;

  for (const tr of trades) {
    ctx.globalAlpha =
      efficiency.limitTime && tr.exit_time > efficiency.limitTime
        ? 0.25
        : 1;

    drawAtom(timeToX(tr.exit_time), baseY, tr);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
