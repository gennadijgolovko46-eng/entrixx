<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTRIXX</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block;touch-action:none}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45)
}
#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";
import { loadDataFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;
const SWIPE_PX = 50;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

let fills=[], trades=[], days=[], dayIndex=0;
let efficiency={limitTime:null};
let arrowValue=0, frozen=false;

let startX=null, currentX=null, isDown=false;

dateEl.textContent="Loading...";

function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

async function init(){
  const data = await loadDataFromHyperliquid(ACCOUNT);
  fills = data.fills;
  trades = data.trades;

  let minT = Infinity;
  for(const f of fills) minT = Math.min(minT, f.time);

  const startDay = dayFloorUTC(minT);
  const endDay = dayFloorUTC(Date.now());

  for(let d=startDay; d<=endDay; d+=DAY) days.push(d);
  dayIndex = days.length - 1;

  const exits = trades.map(t=>t.exit_time).sort((a,b)=>a-b);
  efficiency = computeEfficiency(exits);

  updateDate();
}
await init();

function updateDate(){
  dateEl.textContent = new Date(days[dayIndex]).toDateString();
}

function tradesForDay(){
  const d0 = days[dayIndex];
  const d1 = d0 + DAY;
  return trades.filter(t => t.exit_time > d0 && t.entry_time < d1);
}

function timeToX(t){
  return ((t - days[dayIndex]) / DAY) * W;
}

function drawAtom(t){
  const d0 = days[dayIndex];
  const d1 = d0 + DAY;

  const x0 = timeToX(Math.max(t.entry_time, d0));
  const x1 = timeToX(Math.min(t.exit_time, d1));

  const y = H * 0.55;
  const h = (t.exit_time - t.entry_time) / 60000;
  const dir = t.dir < 0 ? -1 : 1;

  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x0, y);
  ctx.lineTo(x1, y + dir * Math.min(h,160));
  ctx.stroke();

  ctx.strokeStyle="#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x1, y + dir * 160);
  ctx.stroke();
}

function render(){
  ctx.clearRect(0,0,W,H);

  const d0 = days[dayIndex];
  drawEfficiencyLayer(ctx,{
    dayStart:d0,
    dayEnd:d0+DAY,
    limitTime:efficiency.limitTime,
    width:W,
    height:H
  });

  for(const t of tradesForDay()) drawAtom(t);

  drawBehaviorArrow(ctx,{
    value:arrowValue,
    frozen,
    width:W,
    height:H
  });

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
