<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENTRIXX</title>

<style>
html,body{margin:0;padding:0;background:#fff;overflow:hidden}
canvas{display:block;touch-action:none}

#date{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  font:12px system-ui,sans-serif;color:rgba(0,0,0,.45)
}
#time{
  position:fixed;top:8px;left:50%;transform:translateX(-50%);
  font:12px system-ui,sans-serif;color:rgba(0,0,0,.9);
  opacity:0;pointer-events:none
}

/* compact details panel */
#details{
  position:fixed;top:10px;left:10px;max-width:360px;
  padding:10px 12px;border-radius:12px;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  font:12px system-ui,sans-serif;color:rgba(0,0,0,.78);
  line-height:1.25;white-space:pre-wrap;
  pointer-events:none;
  opacity:0;transform:translateY(-4px);
  transition:opacity .14s ease, transform .14s ease;
}
#details.show{opacity:1;transform:translateY(0)}

/* keep debug in code, hidden by default */
.hidden{display:none!important}
#debug{
  position:fixed;top:10px;left:10px;max-width:360px;
  padding:10px 12px;border-radius:10px;
  background:rgba(255,255,255,.85);
  border:1px solid rgba(0,0,0,.08);
  font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
  color:rgba(0,0,0,.75);
  white-space:pre;
  pointer-events:none
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>
<div id="details"></div>
<div id="debug" class="hidden"></div>

<!-- error surface (NO white screen) -->
<script>
(function(){
  const detailsEl = document.getElementById("details");
  function show(title, msg){
    detailsEl.textContent = title + "\n\n" + msg;
    detailsEl.classList.add("show");
  }
  window.__show = show;
  window.addEventListener("error", (e)=>show("JS ERROR", (e?.error?.stack || e?.message || String(e))));
  window.addEventListener("unhandledrejection", (e)=>show("UNHANDLED PROMISE", (e?.reason?.stack || e?.reason?.message || String(e?.reason || e))));
})();
</script>

<script type="module">
/* ===== Safe module import with version pin =====
   Bump V on deploy. This is your cache breaker. */
const V = "idx-safe-9";

/* Optional: ?safe=1 disables all tails (/market_window) calls */
const qs0 = new URLSearchParams(location.search);
const SAFE_MODE = qs0.get("safe") === "1";

async function safeImport(path){
  try{
    return await import(path + "?v=" + encodeURIComponent(V));
  }catch(e){
    window.__show(
      "IMPORT FAILED",
      `File:\n${path}\n\nError:\n${String(e?.message || e)}\n\n`+
      `Usually: 404, or server returned HTML instead of JS ("Unexpected token <").`
    );
    throw e;
  }
}

const eff = await safeImport("./efficiency.js");
const beh = await safeImport("./behaviorArrow.js");
const hl  = await safeImport("./trades_from_hyperliquid.js");

const { computeEfficiency, drawEfficiencyLayer } = eff;
const { drawBehaviorArrow } = beh;
const { loadDataFromHyperliquid } = hl;

/* =========================
   CONFIG
   ========================= */
const DEFAULT_ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const ACCOUNT = (qs0.get("account") || DEFAULT_ACCOUNT).trim();

/* IMPORTANT:
   Trades load ONLY via trades_from_hyperliquid.js (contract-safe).
   API_BASE below is ONLY for /market_window tails. */
const API_BASE = "https://twilight-breeze-fa50.gennadijgolovko46.workers.dev";

const DAY = 86400000;
const SWIPE_PX = 50;
const MARKET_WINDOW_MS = 8 * 60 * 60 * 1000;
const FLIP_SHIFT_PX = 10;

// tap selection
const TAP_MAX_DX = 8;   // px
const HIT_R = 28;       // px

let selectedAtom = null;
let selectedDetailsText = "";

// ---------------- canvas ----------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");
const detailsEl = document.getElementById("details");
const debugEl = document.getElementById("debug");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

// ---------------- state ----------------
let trades = [];
let fills = []; // debug only (may be empty)
let days = [];
let dayIndex = 0;
let currentDayTrades = [];

let efficiency = { limitTime:null };
let arrowValue = 0;
let frozen = false;

let startX=null, currentX=null, isDown=false;

// cache market window results: key = coin|exit_time
const marketCache = new Map();
let marketLoading = false;

// ---------------- utils ----------------
function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}
function clamp(min,v,max){ return Math.max(min, Math.min(max, v)); }
function num(x){ const v = Number(x); return Number.isFinite(v) ? v : NaN; }

// seconds/ms normalization (CRITICAL)
function toMs(v){
  const n = Number(v);
  if(!Number.isFinite(n)) return NaN;
  return (n > 0 && n < 1e12) ? n * 1000 : n;
}

function formatTime(t){
  const d = new Date(t);
  return String(d.getUTCHours()).padStart(2,"0")+":"+
         String(d.getUTCMinutes()).padStart(2,"0");
}
function formatDateTimeUTC(t){
  const d = new Date(t);
  const Y = d.getUTCFullYear();
  const M = String(d.getUTCMonth()+1).padStart(2,"0");
  const D = String(d.getUTCDate()).padStart(2,"0");
  const hh = String(d.getUTCHours()).padStart(2,"0");
  const mm = String(d.getUTCMinutes()).padStart(2,"0");
  return `${Y}-${M}-${D} ${hh}:${mm}Z`;
}
function formatHold(ms){
  if(!Number.isFinite(ms) || ms < 0) return "n/a";
  const mins = Math.round(ms / 60000);
  if(mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
}
function formatPct(p){
  if(!Number.isFinite(p)) return "n/a";
  return (p * 100).toFixed(3) + "%";
}

/* safe label */
function isTickerLike(s){
  if(!s) return false;
  const t = String(s).trim();
  if(!t) return false;
  if(/^\d+$/.test(t)) return false;
  if(/^@\d+$/.test(t)) return false;
  if(!/^[A-Z0-9._:-]{2,15}$/.test(t)) return false;
  return /[A-Z]/.test(t);
}
function coinLabel(t){
  const raw = String(t.coin || "").trim();
  if(isTickerLike(raw)) return { label: "Coin", value: raw };
  const m = raw.match(/@?(\d+)/);
  if(m) return { label: "Market", value: `#${m[1]}` };
  return { label: "Market", value: "n/a" };
}

// STRICT RULE: atom = closed trade (full hold)
function holdMsAtom(t){
  const entry = toMs(t.entry_time);
  const exit  = toMs(t.exit_time);
  if(!Number.isFinite(entry) || !Number.isFinite(exit)) return NaN;
  const ms = exit - entry;
  return (Number.isFinite(ms) && ms >= 0) ? ms : NaN;
}

function tradesForDay(d0){
  const d1 = d0 + DAY;
  return trades.filter(t =>
    toMs(t.exit_time) > d0 &&
    toMs(t.entry_time) < d1
  );
}

/* =========================
   SORTING POLICY (optimal & safe)
   - Always apply ONE canonical sort after load (idempotent).
   - Guarantees stable render & flip detection across browsers.
   ========================= */
function canonSortTrades(arr){
  arr.sort((a,b)=>{
    const ax = toMs(a.exit_time), bx = toMs(b.exit_time);
    if(ax !== bx) return ax - bx;

    const ae = toMs(a.entry_time), be = toMs(b.entry_time);
    if(ae !== be) return ae - be;

    const ac = String(a.coin ?? ""), bc = String(b.coin ?? "");
    if(ac !== bc) return ac < bc ? -1 : 1;

    const ad = Number(a.dir) || 0, bd = Number(b.dir) || 0;
    if(ad !== bd) return ad - bd;

    const aep = Number(a.entry_price) || 0, bep = Number(b.entry_price) || 0;
    if(aep !== bep) return aep - bep;

    const axp = Number(a.exit_price) || 0, bxp = Number(b.exit_price) || 0;
    if(axp !== bxp) return axp - bxp;

    return 0;
  });
}

/* =========================
   market window (tails)
   In SAFE_MODE we don't call it at all.
   ========================= */
async function fetchMarketWindow(coin, exitTimeMs){
  const key = `${coin}|${exitTimeMs}`;
  if (marketCache.has(key)) return marketCache.get(key);

  if (SAFE_MODE) {
    const bad = { hi: NaN, lo: NaN };
    marketCache.set(key, bad);
    return bad;
  }

  const url = `${API_BASE}/market_window?coin=${encodeURIComponent(coin)}&t=${Number(exitTimeMs)}&windowMs=${MARKET_WINDOW_MS}`;
  const r = await fetch(url, { method: "GET" });

  if (!r.ok) {
    const bad = { hi: NaN, lo: NaN };
    marketCache.set(key, bad);
    return bad;
  }

  const j = await r.json();
  const res = { hi: num(j && j.hi), lo: num(j && j.lo) };
  marketCache.set(key, res);
  return res;
}

function marketMovePct(t){
  const exitPx = num(t.exit_price);
  if(!Number.isFinite(exitPx) || exitPx <= 0) return NaN;

  const hi = num(t.mkt_up);
  const lo = num(t.mkt_dn);

  const upMove = Number.isFinite(hi) ? Math.max(0, hi - exitPx) : 0;
  const dnMove = Number.isFinite(lo) ? Math.max(0, exitPx - lo) : 0;

  const move = Math.max(upMove, dnMove);
  if(!(move > 0)) return 0;

  return move / exitPx;
}

async function hydrateMarketForDay(dayTrades){
  if (SAFE_MODE) return;
  if (marketLoading) return;
  marketLoading = true;

  try {
    const need = [];
    for (const t of dayTrades) {
      const coin = String(t.coin || "").trim();
      const exitTimeMs = toMs(t.exit_time);
      if (!coin || !Number.isFinite(exitTimeMs)) continue;

      const key = `${coin}|${exitTimeMs}`;
      const has = marketCache.has(key);
      const hasFields = Number.isFinite(num(t.mkt_up)) || Number.isFinite(num(t.mkt_dn));
      if (!has && !hasFields) need.push(t);
    }

    for (const t of need.slice(0, 40)) {
      const coin = String(t.coin || "").trim();
      const exitTimeMs = toMs(t.exit_time);
      if (!coin || !Number.isFinite(exitTimeMs)) continue;

      const { hi, lo } = await fetchMarketWindow(coin, exitTimeMs);
      if (Number.isFinite(hi)) t.mkt_up = hi;
      if (Number.isFinite(lo)) t.mkt_dn = lo;

      if (selectedAtom === t) updateDetailsPanel();
    }
  } finally {
    marketLoading = false;
  }
}

// ---------------- init ----------------
async function init(){
  let data;
  try {
    data = await loadDataFromHyperliquid(ACCOUNT);
  } catch (e) {
    dateEl.textContent = "Load error";
    detailsEl.textContent = String(e?.message || e);
    detailsEl.classList.add("show");
    throw e;
  }

  trades = data.trades || [];
  fills  = data.fills  || [];

  if(!trades.length){
    dateEl.textContent = "No trades";
    detailsEl.textContent = "No trades returned.";
    detailsEl.classList.add("show");
    return;
  }

  // canonical stable ordering (idempotent even if loader already sorted)
  canonSortTrades(trades);

  let minT = Infinity;
  for(const t of trades) minT = Math.min(minT, toMs(t.entry_time));

  const startDay = dayFloorUTC(minT);
  const endDay   = dayFloorUTC(Date.now());

  for(let d=startDay; d<=endDay; d+=DAY) days.push(d);
  dayIndex = days.length - 1;

  updateDay();
}
await init();

// ---------------- per-day recompute ----------------
function computeBehavior(dayTrades, eff){
  let v = 0;
  for(const t of dayTrades){
    if(eff.limitTime && toMs(t.exit_time) > eff.limitTime) break;
    const hms = holdMsAtom(t);
    const holdMin = Number.isFinite(hms) ? (hms / 60000) : 0;
    v += Math.max(-1, Math.min(1, holdMin - 160));
  }
  return Math.max(-1, Math.min(1, v/12));
}

function markFlipOpen(dayTrades){
  for(const t of dayTrades) t._flipOpen = false;

  // local sort for flip detection only
  dayTrades.sort((a,b)=>
    (toMs(a.entry_time) - toMs(b.entry_time)) ||
    (toMs(a.exit_time)  - toMs(b.exit_time))
  );

  const EPS_T = 2;      // ms tolerance
  const EPS_P = 1e-9;

  for(let i=1;i<dayTrades.length;i++){
    const prev = dayTrades[i-1];
    const cur  = dayTrades[i];

    const prevExitT = toMs(prev.exit_time);
    const curEntryT = toMs(cur.entry_time);

    const prevExitPx = Number(prev.exit_price);
    const curEntryPx = Number(cur.entry_price);

    if(!Number.isFinite(prevExitT) || !Number.isFinite(curEntryT)) continue;
    if(Math.abs(prevExitT - curEntryT) > EPS_T) continue;

    const priceMatch =
      Number.isFinite(prevExitPx) && Number.isFinite(curEntryPx)
        ? Math.abs(prevExitPx - curEntryPx) <= EPS_P
        : true;

    const dirFlip = (Number(prev.dir) === -Number(cur.dir));

    if(priceMatch && dirFlip) cur._flipOpen = true;
  }
}

function dayKeyOfCurrent(){ return days.length ? days[dayIndex] : 0; }

function pickNearestAtom(xClient, yClient){
  if(!days.length) return null;
  const d0 = dayKeyOfCurrent();
  const dayTrades = currentDayTrades;
  if(!dayTrades.length) return null;

  let best = null;
  let bestDist = Infinity;

  for(const t of dayTrades){
    const exit = toMs(t.exit_time);
    if(!Number.isFinite(exit) || exit < d0 || exit >= d0 + DAY) continue;

    const hasPxPy =
      Number.isFinite(t._px) &&
      Number.isFinite(t._py) &&
      t._dayKey === d0;

    let dx, dy;

    if(hasPxPy){
      dx = xClient - t._px;
      dy = yClient - t._py;
    } else {
      const yAtom = H * 0.55;
      const baseX = ((clamp(d0, exit, d0 + DAY) - d0) / DAY) * W;
      const xExit = baseX + (t._flipOpen ? FLIP_SHIFT_PX : 0);

      dx = xClient - xExit;
      dy = yClient - yAtom;
    }

    const dist = Math.hypot(dx, dy);
    if(dist < bestDist){
      bestDist = dist;
      best = t;
    }
  }

  return (best && bestDist <= HIT_R) ? best : null;
}

// ---- details panel ----
function updateDetailsPanel(){
  if(!selectedAtom){
    selectedDetailsText = "";
    detailsEl.textContent = "";
    detailsEl.classList.remove("show");
    return;
  }

  const { label, value } = coinLabel(selectedAtom);
  const dir = (Number(selectedAtom.dir) === -1) ? "SHORT" : "LONG";

  const entry = toMs(selectedAtom.entry_time);
  const exit  = toMs(selectedAtom.exit_time);

  const holdMs = holdMsAtom(selectedAtom);
  const hold = formatHold(holdMs);

  const mp = marketMovePct(selectedAtom);
  const marketLine = Number.isFinite(mp)
    ? `Market move: ${formatPct(mp)}`
    : (SAFE_MODE ? "Market move: (safe mode on)" : "Market move: ...");

  const lines = [
    `${label}: ${value}`,
    `Direction: ${dir}`,
    `Hold: ${hold}`,
    `Entry: ${Number.isFinite(entry) ? formatDateTimeUTC(entry) : "n/a"}`,
    `Exit:  ${Number.isFinite(exit)  ? formatDateTimeUTC(exit)  : "n/a"}`,
    marketLine
  ];

  const text = lines.join("\n");
  if(text !== selectedDetailsText){
    selectedDetailsText = text;
    detailsEl.textContent = text;
  }
  detailsEl.classList.add("show");
}

function setBaseDebugText(){
  debugEl.textContent =
    "ok\n"+
    "v: " + V + "\n" +
    "safe: " + (SAFE_MODE ? "1" : "0") + "\n" +
    "account: " + ACCOUNT + "\n" +
    "fills total: " + fills.length + "\n" +
    "trades total: " + trades.length + "\n" +
    "days total: " + days.length + "\n" +
    "dayIndex: " + dayIndex + "\n" +
    "dayTrades: " + currentDayTrades.length + "\n" +
    "limitTime: " + (efficiency.limitTime ?? "null");
}

function updateDay(){
  const d0 = days[dayIndex];
  currentDayTrades = tradesForDay(d0);

  markFlipOpen(currentDayTrades);

  const exits = currentDayTrades.map(t=>toMs(t.exit_time)).filter(Number.isFinite).sort((a,b)=>a-b);
  efficiency = computeEfficiency(exits);

  arrowValue = computeBehavior(currentDayTrades, efficiency);
  frozen = !!efficiency.limitTime;

  dateEl.textContent = new Date(d0).toDateString();

  if(selectedAtom){
    const exit = toMs(selectedAtom.exit_time);
    const inDay = Number.isFinite(exit) && exit >= d0 && exit < d0 + DAY;
    if(!inDay) selectedAtom = null;
  }

  updateDetailsPanel();
  setBaseDebugText();

  hydrateMarketForDay(currentDayTrades);
}

// ---------------- input ----------------
canvas.addEventListener("pointerdown",e=>{
  if(!days.length) return;
  isDown=true;
  startX=currentX=e.clientX;
  timeEl.style.opacity=1;
});

canvas.addEventListener("pointermove",e=>{
  if(!days.length) return;
  if(!isDown) return;
  currentX=e.clientX;
  const x=Math.max(0,Math.min(W,currentX));
  const t=days[dayIndex]+(x/W)*DAY;
  timeEl.textContent=formatTime(t);
  timeEl.style.left=x+"px";
});

canvas.addEventListener("pointerup",(e)=>{
  if(!isDown) return;

  const dx = currentX - startX;

  if(Math.abs(dx) <= TAP_MAX_DX){
    selectedAtom = pickNearestAtom(currentX, e.clientY);
    updateDetailsPanel();
  }

  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0 && dayIndex>0) dayIndex--;
    if(dx<0 && dayIndex<days.length-1) dayIndex++;

    selectedAtom = null;
    selectedDetailsText = "";

    updateDay();
  }

  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

canvas.addEventListener("pointercancel",()=>{
  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

// ---------------- drawing ----------------
function drawAtom(t, d0){
  const d1 = d0 + DAY;

  const entry = toMs(t.entry_time);
  const exit  = toMs(t.exit_time);
  if(!Number.isFinite(entry) || !Number.isFinite(exit)) return;

  if(exit < d0 || exit >= d1) return;

  const y = H * 0.55;

  const baseX = ((clamp(d0, exit, d1) - d0) / DAY) * W;
  const xExit = baseX + (t._flipOpen ? FLIP_SHIFT_PX : 0);

  // store exact draw coordinates (truth for selection)
  t._px = xExit;
  t._py = y;
  t._dayKey = d0;

  if(selectedAtom === t){
    ctx.strokeStyle = "rgba(0,0,0,.16)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(xExit, y, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(xExit, y, 3, 0, Math.PI * 2);
  ctx.fill();

  const dirBlue = (t.dir === -1 ? -1 : 1);
  const holdMin = Math.max(0, (exit - entry) / 60000);
  const blueLen = clamp(8, holdMin, 160);

  ctx.strokeStyle = "#2F6BFF";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(xExit, y);
  ctx.lineTo(xExit, y + dirBlue * blueLen);
  ctx.stroke();

  // green tail is disabled in SAFE_MODE
  if(!SAFE_MODE){
    const exitPx = Number(t.exit_price);
    const mUp = Number(t.mkt_up);
    const mDn = Number(t.mkt_dn);

    if(Number.isFinite(exitPx) && (Number.isFinite(mUp) || Number.isFinite(mDn))) {
      const upMove = Number.isFinite(mUp) ? Math.max(0, mUp - exitPx) : 0;
      const dnMove = Number.isFinite(mDn) ? Math.max(0, exitPx - mDn) : 0;
      const move = Math.max(upMove, dnMove);

      if(move > 0) {
        const dirGreen = (upMove >= dnMove) ? 1 : -1;
        const movePct = move / exitPx;
        const greenLen = clamp(6, movePct * 4000, 160);
        const xG = xExit + 4;

        ctx.strokeStyle = "#2DBE60";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(xG, y);
        ctx.lineTo(xG, y + dirGreen * greenLen);
        ctx.stroke();
      }
    }
  }

  ctx.lineWidth = 1;
}

function render(){
  ctx.clearRect(0,0,W,H);

  if(!days.length){
    requestAnimationFrame(render);
    return;
  }

  const d0 = days[dayIndex];

  drawEfficiencyLayer(ctx,{
    dayStart:d0,
    dayEnd:d0+DAY,
    limitTime:efficiency.limitTime,
    width:W,
    height:H
  });

  for(const t of currentDayTrades) drawAtom(t,d0);

  if(isDown && currentX!==null){
    const x=Math.max(0,Math.min(W,currentX));
    ctx.strokeStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.moveTo(x+0.5,0);
    ctx.lineTo(x+0.5,H);
    ctx.stroke();
  }

  drawBehaviorArrow(ctx,{
    value:arrowValue,
    frozen,
    width:W,
    height:H
  });

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
