<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display:block; touch-action:none; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";
import { loadTradesFromHyperliquid } from "./trades_from_hyperliquid.js";

/* ================= WALLET ================= */
const WALLET = "0xfae95f601f3a25ace60d19dbb929f2a5c57e3571";

/* ================= CANVAS ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

let W=0, H=0;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);
resize();

/* ================= TIME ================= */
const DAY_MS = 86400000;
const now = new Date();
const todayUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
let currentDayUTC = todayUTC;

function updateDate(){
  const d = new Date(currentDayUTC);
  dateEl.textContent = d.toUTCString().slice(0,16);
}
updateDate();

/* ================= POINTER ================= */
let touchX=null;
let startX=null;

canvas.addEventListener("pointerdown",e=>{
  touchX=e.clientX;
  startX=e.clientX;
});

canvas.addEventListener("pointermove",e=>{
  if(touchX!==null) touchX=e.clientX;
});

canvas.addEventListener("pointerup",e=>{
  const dx = e.clientX - startX;
  if(Math.abs(dx)>40){
    if(dx>0) currentDayUTC -= DAY_MS;
    else currentDayUTC = Math.min(todayUTC,currentDayUTC+DAY_MS);
    updateDate();
  }
  touchX=null;
  timeEl.style.opacity=0;
});

canvas.addEventListener("pointerleave",()=>{
  touchX=null;
  timeEl.style.opacity=0;
});

function xToTimeUTC(x){
  const m = Math.round((x/W)*1440);
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}

/* ================= DATA ================= */
let trades = [];
let efficiency = {limitTime:null};
let arrowValue = 0;
let frozen = false;

async function init(){
  trades = await loadTradesFromHyperliquid(WALLET);

  const exitTimes = trades.map(t=>t.exit_time).sort((a,b)=>a-b);
  efficiency = computeEfficiency(exitTimes);

  let B=0;
  frozen=false;
  for(const t of trades){
    if(efficiency.limitTime && t.exit_time > efficiency.limitTime){
      frozen=true; break;
    }
    const hold = (t.exit_time - t.entry_time)/60000;
    const market = 160;
    const delta = hold - market;
    B += Math.max(-1,Math.min(1,delta));
  }
  arrowValue = Math.max(-1,Math.min(1,B/12));
}

await init();

/* ===== FILTER TRADES BY DAY ===== */
function tradesForDay(dayUTC){
  const start = dayUTC;
  const end = dayUTC + DAY_MS;
  return trades.filter(t => t.entry_time >= start && t.entry_time < end);
}

/* ================= DRAW ================= */
function timeToX(t){ return ((t-currentDayUTC)/DAY_MS)*W; }

function drawAtom(x,y,t){
  const top=y-1, bottom=y+1;
  ctx.lineWidth=1.2;

  ctx.strokeStyle="#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x+1, t.dir<0?bottom:top);
  ctx.lineTo(x+1, t.dir<0?bottom+160:top-160);
  ctx.stroke();

  const hold=Math.max(2,Math.round((t.exit_time-t.entry_time)/60000));
  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x-1, t.dir<0?bottom:top);
  ctx.lineTo(x-1, t.dir<0?bottom+hold:top-hold);
  ctx.stroke();

  ctx.fillStyle="#000";
  ctx.fillRect(x-1,y-1,2,2);
}

function drawTimeLine(){
  if(touchX===null) return;
  ctx.strokeStyle="rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(touchX,0);
  ctx.lineTo(touchX,H);
  ctx.stroke();
  timeEl.textContent=xToTimeUTC(touchX);
  timeEl.style.opacity=1;
}

/* ================= LOOP ================= */
function render(){
  ctx.clearRect(0,0,W,H);

  drawEfficiencyLayer(ctx,{
    dayStart: currentDayUTC,
    dayEnd: currentDayUTC+DAY_MS,
    limitTime: efficiency.limitTime,
    width:W, height:H
  });

  const dayTrades = tradesForDay(currentDayUTC);
  const baseY=H*0.55;
  for(const t of dayTrades){
    drawAtom(timeToX(t.entry_time), baseY, t);
  }

  drawBehaviorArrow(ctx,{ value:arrowValue, frozen, width:W, height:H });
  drawTimeLine();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
