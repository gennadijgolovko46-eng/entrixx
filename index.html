<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENTRIXX</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block;touch-action:none}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45)
}
#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
}
#debug{
  position:fixed;
  top:10px;
  left:10px;
  max-width:320px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.85);
  border:1px solid rgba(0,0,0,.08);
  font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  color:rgba(0,0,0,.75);
  white-space:pre;
  pointer-events:none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>
<div id="debug"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";
import { loadDataFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;
const SWIPE_PX = 50;

const API = "https://twilight-breeze-fa50.gennadijgolovko46.workers.dev";
const MARKET_WINDOW_MS = 8 * 60 * 60 * 1000;

// micro shift ONLY for flip-open (second trade in pair)
const FLIP_SHIFT_PX = 10;

// ======== TAP DEBUG (safe, no geometry changes) ========
const TAP_MAX_DX = 8;         // px: below => treat as tap (not swipe)
const HIT_R = 28;             // px: finger hit radius (24..32 ok)
let selectedAtom = null;      // reference to trade object
let selectedDebugText = "";
// =======================================================

// ---------------- canvas ----------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");
const debugEl = document.getElementById("debug");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

// ---------------- state ----------------
let trades = [];
let fills = [];
let days = [];
let dayIndex = 0;

let efficiency = { limitTime:null };
let arrowValue = 0;
let frozen = false;

let startX=null, currentX=null, isDown=false;

// cache market window results: key = coin|exit_time
const marketCache = new Map();
let marketLoading = false;

// ---------------- utils ----------------
function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

function formatTime(t){
  const d = new Date(t);
  return String(d.getUTCHours()).padStart(2,"0")+":"+
         String(d.getUTCMinutes()).padStart(2,"0");
}

function clamp(min,v,max){
  return Math.max(min, Math.min(max, v));
}

function tradesForDay(d0){
  const d1 = d0 + DAY;
  return trades.filter(t =>
    t.exit_time > d0 &&
    t.entry_time < d1
  );
}

function num(x){
  const v = Number(x);
  return Number.isFinite(v) ? v : NaN;
}

async function fetchMarketWindow(coin, exitTime){
  const key = `${coin}|${exitTime}`;
  if (marketCache.has(key)) return marketCache.get(key);

  const url = `${API}/market_window?coin=${encodeURIComponent(coin)}&t=${Number(exitTime)}&windowMs=${MARKET_WINDOW_MS}`;
  const r = await fetch(url, { method: "GET" });
  if (!r.ok) {
    marketCache.set(key, { hi: NaN, lo: NaN });
    return { hi: NaN, lo: NaN };
  }
  const j = await r.json();
  const hi = num(j && j.hi);
  const lo = num(j && j.lo);
  const res = { hi, lo };
  marketCache.set(key, res);
  return res;
}

async function hydrateMarketForDay(dayTrades){
  if (marketLoading) return;
  marketLoading = true;

  try {
    // limit per update to avoid spamming worker/HL
    const need = [];
    for (const t of dayTrades) {
      const coin = String(t.coin || "").trim();
      const exitTime = num(t.exit_time);
      if (!coin || !Number.isFinite(exitTime)) continue;

      const key = `${coin}|${exitTime}`;
      const has = marketCache.has(key);
      const hasFields = Number.isFinite(num(t.mkt_up)) || Number.isFinite(num(t.mkt_dn));
      if (!has && !hasFields) need.push(t);
    }

    const batch = need.slice(0, 40);

    for (const t of batch) {
      const coin = String(t.coin || "").trim();
      const exitTime = num(t.exit_time);
      if (!coin || !Number.isFinite(exitTime)) continue;

      const { hi, lo } = await fetchMarketWindow(coin, exitTime);
      if (Number.isFinite(hi)) t.mkt_up = hi;
      if (Number.isFinite(lo)) t.mkt_dn = lo;
    }
  } finally {
    marketLoading = false;
  }
}

// ---------------- init ----------------
async function init(){
  const data = await loadDataFromHyperliquid(ACCOUNT);
  trades = data.trades || [];
  fills = data.fills || [];

  if(!trades.length){
    dateEl.textContent = "No data";
    return;
  }

  let minT = Infinity;
  for(const t of trades) minT = Math.min(minT, Number(t.entry_time));

  const startDay = dayFloorUTC(minT);
  const endDay   = dayFloorUTC(Date.now());

  for(let d=startDay; d<=endDay; d+=DAY) days.push(d);
  dayIndex = days.length - 1;

  updateDay();
}
await init();

// ---------------- per-day recompute ----------------
function computeBehavior(dayTrades, eff){
  let v = 0;
  for(const t of dayTrades){
    if(eff.limitTime && t.exit_time > eff.limitTime) break;
    const hold = (t.exit_time - t.entry_time)/60000;
    v += Math.max(-1, Math.min(1, hold - 160));
  }
  return Math.max(-1, Math.min(1, v/12));
}

// mark flip-open only inside current day (second trade in pair)
function markFlipOpen(dayTrades){
  // clear previous marks (objects are reused across days)
  for(const t of dayTrades) t._flipOpen = false;

  // stable order (important)
  dayTrades.sort((a,b)=>
    (Number(a.entry_time) - Number(b.entry_time)) ||
    (Number(a.exit_time)  - Number(b.exit_time))
  );

  const EPS_T = 0.5; // ms tolerance
  const EPS_P = 1e-9;

  for(let i=1;i<dayTrades.length;i++){
    const prev = dayTrades[i-1];
    const cur  = dayTrades[i];

    const prevExitT = Number(prev.exit_time);
    const curEntryT = Number(cur.entry_time);

    const prevExitPx = Number(prev.exit_price);
    const curEntryPx = Number(cur.entry_price);

    if(!Number.isFinite(prevExitT) || !Number.isFinite(curEntryT)) continue;

    const timeMatch = Math.abs(prevExitT - curEntryT) <= EPS_T;
    if(!timeMatch) continue;

    const priceMatch =
      Number.isFinite(prevExitPx) && Number.isFinite(curEntryPx)
        ? Math.abs(prevExitPx - curEntryPx) <= EPS_P
        : true;

    const dirFlip = (Number(prev.dir) === -Number(cur.dir));

    if(priceMatch && dirFlip){
      // shift only the "newly opened" one (cur)
      cur._flipOpen = true;
    }
  }
}

// ======== TAP DEBUG helpers ========
function holdMetrics(t){
  const entry = Number(t.entry_time);
  const exit  = Number(t.exit_time);
  if(!Number.isFinite(entry) || !Number.isFinite(exit)) return null;

  const holdMin = Math.max(0, (exit - entry) / 60000);
  const blueLen = clamp(8, holdMin, 160);

  return { holdMin, blueLen };
}

function marketMetrics(t){
  const exitPrice = Number(t.exit_price);
  const hi = Number(t.mkt_up);
  const lo = Number(t.mkt_dn);

  if(!Number.isFinite(exitPrice)) return null;

  const upMoveRaw = Number.isFinite(hi) ? Math.max(0, hi - exitPrice) : NaN;
  const dnMoveRaw = Number.isFinite(lo) ? Math.max(0, exitPrice - lo) : NaN;

  const upMove = Number.isFinite(upMoveRaw) ? upMoveRaw : 0;
  const dnMove = Number.isFinite(dnMoveRaw) ? dnMoveRaw : 0;

  const move = Math.max(upMove, dnMove);
  const movePct = exitPrice > 0 ? (move / exitPrice) : NaN;

  const greenLen =
    (Number.isFinite(movePct) && move > 0)
      ? clamp(6, movePct * 4000, 160)
      : 0;

  return { exitPrice, hi, lo, movePct, greenLen, upMoveRaw, dnMoveRaw };
}

// ✅ SAFEST FIX: pick by (X,Y) distance to the atom point (not just X)
function pickNearestAtom(xClient, yClient){
  if(!days.length) return null;
  const d0 = days[dayIndex];
  const dayTrades = tradesForDay(d0);
  if(!dayTrades.length) return null;

  const yAtom = H * 0.55;

  let best = null;
  let bestDist = Infinity;

  for(const t of dayTrades){
    const exit = Number(t.exit_time);
    if(!Number.isFinite(exit)) continue;

    const baseX = ((clamp(d0, exit, d0 + DAY) - d0) / DAY) * W;
    const xExit = baseX + (t._flipOpen ? FLIP_SHIFT_PX : 0);

    const dx = xClient - xExit;
    const dy = yClient - yAtom;
    const dist = Math.hypot(dx, dy);

    if(dist < bestDist){
      bestDist = dist;
      best = t;
    }
  }

  if(best && bestDist <= HIT_R) return best;
  return null;
}

function updateSelectedDebug(){
  if(!selectedAtom){
    selectedDebugText = "";
    return;
  }

  const h = holdMetrics(selectedAtom);
  const m = marketMetrics(selectedAtom);

  const entryT = Number(selectedAtom.entry_time);
  const exitT  = Number(selectedAtom.exit_time);

  const lines = [];
  lines.push("");
  lines.push("— selected atom —");
  lines.push("coin: " + String(selectedAtom.coin || ""));
  lines.push("dir: " + String(selectedAtom.dir) + (selectedAtom._flipOpen ? "  (flip-open)" : ""));
  if(Number.isFinite(entryT)) lines.push("entry: " + new Date(entryT).toUTCString());
  if(Number.isFinite(exitT))  lines.push("exit : " + new Date(exitT).toUTCString());

  // BLUE
  lines.push("");
  lines.push("BLUE (HOLD)");
  if(h){
    const clamped = (h.blueLen === 8 && h.holdMin < 8) || (h.blueLen === 160 && h.holdMin > 160);
    lines.push("holdMin: " + h.holdMin.toFixed(2));
    lines.push("blueLen: " + h.blueLen.toFixed(2) + (clamped ? "  [clamp]" : ""));
  } else {
    lines.push("n/a");
  }

  // GREEN
  lines.push("");
  lines.push("GREEN (MARKET)");
  if(m){
    lines.push("exitPrice: " + (Number.isFinite(m.exitPrice) ? m.exitPrice : "n/a"));
    lines.push("hi: " + (Number.isFinite(m.hi) ? m.hi : "…"));
    lines.push("lo: " + (Number.isFinite(m.lo) ? m.lo : "…"));

    const hasHiLo = Number.isFinite(m.hi) || Number.isFinite(m.lo);
    if(hasHiLo){
      const pct = Number.isFinite(m.movePct) ? (m.movePct * 100) : NaN;
      const clamped = (m.greenLen === 6 && pct > 0) || (m.greenLen === 160);
      lines.push("movePct: " + (Number.isFinite(pct) ? pct.toFixed(3) + "%" : "n/a"));
      lines.push("greenLen: " + m.greenLen.toFixed(2) + (clamped ? "  [clamp]" : ""));
      lines.push("rawMove: up=" + (Number.isFinite(m.upMoveRaw) ? m.upMoveRaw : "n/a") +
                 " dn=" + (Number.isFinite(m.dnMoveRaw) ? m.dnMoveRaw : "n/a"));
      lines.push("k=4000 -> len≈movePct*4000");
    } else {
      lines.push("market: loading/absent");
    }
  } else {
    lines.push("n/a");
  }

  selectedDebugText = lines.join("\n");
}

function setBaseDebugText(){
  debugEl.textContent =
    "fills/trades ok\n"+
    "fills total: " + fills.length + "\n" +
    "trades total: " + trades.length + "\n" +
    "days total: " + days.length + "\n" +
    "dayIndex: " + dayIndex + "\n" +
    "dayTrades: " + tradesForDay(days[dayIndex]).length + "\n" +
    "limitTime: " + (efficiency.limitTime ?? "null") +
    selectedDebugText;
}
// =====================================

function updateDay(){
  const d0 = days[dayIndex];
  const dayTrades = tradesForDay(d0);

  // mark flip-open for this day only
  markFlipOpen(dayTrades);

  const exits = dayTrades.map(t=>t.exit_time).sort((a,b)=>a-b);
  efficiency = computeEfficiency(exits);

  arrowValue = computeBehavior(dayTrades, efficiency);
  frozen = !!efficiency.limitTime;

  dateEl.textContent = new Date(d0).toDateString();

  // if selected atom is not in this day -> drop it
  if(selectedAtom){
    const inDay = (Number(selectedAtom.exit_time) > d0) && (Number(selectedAtom.entry_time) < d0 + DAY);
    if(!inDay) selectedAtom = null;
  }
  updateSelectedDebug();
  setBaseDebugText();

  // request green tails data for this day (best effort)
  hydrateMarketForDay(dayTrades);
}

// ---------------- input ----------------
canvas.addEventListener("pointerdown",e=>{
  if(!days.length) return;
  isDown=true;
  startX=currentX=e.clientX;
  timeEl.style.opacity=1;
});

canvas.addEventListener("pointermove",e=>{
  if(!days.length) return;
  if(!isDown) return;
  currentX=e.clientX;
  const x=Math.max(0,Math.min(W,currentX));
  const t=days[dayIndex]+(x/W)*DAY;
  timeEl.textContent=formatTime(t);
  timeEl.style.left=x+"px";
});

canvas.addEventListener("pointerup",(e)=>{
  if(!isDown) return;

  const dx = currentX - startX;

  // TAP => pick nearest atom and show debug numbers
  if(Math.abs(dx) <= TAP_MAX_DX){
    const picked = pickNearestAtom(currentX, e.clientY);
    selectedAtom = picked;
    updateSelectedDebug();
    setBaseDebugText();
  }

  // SWIPE (as было)
  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0 && dayIndex>0) dayIndex--;
    if(dx<0 && dayIndex<days.length-1) dayIndex++;
    updateDay();
  }

  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

canvas.addEventListener("pointercancel",()=>{
  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

// ---------------- drawing ----------------
function drawAtom(t, d0){
  const d1 = d0 + DAY;

  const entry = Number(t.entry_time);
  const exit  = Number(t.exit_time);
  if(!isFinite(entry) || !isFinite(exit)) return;

  const y = H * 0.55;

  // base x (как было)
  const baseX = ((clamp(d0, exit, d1) - d0) / DAY) * W;

  // shift ONLY if this atom is flip-open
  const xExit = baseX + (t._flipOpen ? FLIP_SHIFT_PX : 0);

  // ---- optional: highlight selected atom (UI only) ----
  if(selectedAtom === t){
    ctx.strokeStyle = "rgba(0,0,0,.25)";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(xExit, y, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // atom dot at exit time
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(xExit, y, 3, 0, Math.PI * 2);
  ctx.fill();

  // BLUE tail (HOLD): vertical, direction by trade dir, length by hold duration
  const dirBlue = (t.dir === -1 ? -1 : 1);
  const holdMin = Math.max(0, (exit - entry) / 60000);
  const blueLen = clamp(8, holdMin, 160);

  ctx.strokeStyle = "#2F6BFF";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(xExit, y);
  ctx.lineTo(xExit, y + dirBlue * blueLen);
  ctx.stroke();

  // GREEN tail (MARKET): window after exit, direction by market move, length by max move
  const exitPx = Number(t.exit_price);
  const mUp = Number(t.mkt_up);
  const mDn = Number(t.mkt_dn);

  if(isFinite(exitPx) && (isFinite(mUp) || isFinite(mDn))) {
    const upMove = isFinite(mUp) ? Math.max(0, mUp - exitPx) : 0;
    const dnMove = isFinite(mDn) ? Math.max(0, exitPx - mDn) : 0;
    const move = Math.max(upMove, dnMove);

    if(move > 0) {
      const dirGreen = (upMove >= dnMove) ? 1 : -1;

      const movePct = move / exitPx;
      const greenLen = clamp(6, movePct * 4000, 160);

      // x offset to distinguish tails when aligned
      const xG = xExit + 4;

      ctx.strokeStyle = "#2DBE60";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xG, y);
      ctx.lineTo(xG, y + dirGreen * greenLen);
      ctx.stroke();
    }
  }

  ctx.lineWidth = 1;
}

function render(){
  ctx.clearRect(0,0,W,H);

  if(!days.length){
    requestAnimationFrame(render);
    return;
  }

  const d0 = days[dayIndex];

  drawEfficiencyLayer(ctx,{
    dayStart:d0,
    dayEnd:d0+DAY,
    limitTime:efficiency.limitTime,
    width:W,
    height:H
  });

  const dayTrades = tradesForDay(d0);
  for(const t of dayTrades) drawAtom(t,d0);

  if(isDown && currentX!==null){
    const x=Math.max(0,Math.min(W,currentX));
    ctx.strokeStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.moveTo(x+0.5,0);
    ctx.lineTo(x+0.5,H);
    ctx.stroke();
  }

  drawBehaviorArrow(ctx,{
    value:arrowValue,
    frozen,
    width:W,
    height:H
  });

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
