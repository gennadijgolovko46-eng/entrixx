<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENTRIXX</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block;touch-action:none}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45)
}
#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";
import { loadDataFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;
const SWIPE_PX = 50;

// ---------------- canvas ----------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

// ---------------- state ----------------
let trades = [];
let days = [];
let dayIndex = 0;

let efficiency = { limitTime:null };
let arrowValue = 0;
let frozen = false;

let startX=null, currentX=null, isDown=false;

// fills index (market tails)
let fillsByCoin = {};

// ---------------- utils ----------------
function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

function formatTime(t){
  const d = new Date(t);
  return String(d.getUTCHours()).padStart(2,"0")+":"+
         String(d.getUTCMinutes()).padStart(2,"0");
}

function tradesForDay(d0){
  const d1 = d0 + DAY;
  return trades.filter(t =>
    t.exit_time > d0 &&
    t.entry_time < d1
  );
}

// ---------------- init ----------------
async function init(){
  const data = await loadDataFromHyperliquid(ACCOUNT);
  trades = data.trades;

  const fills = data.fills || [];
  fills.sort((a,b)=>a.time-b.time);
  fillsByCoin = {};
  for(const f of fills){
    const c = f.coin;
    if(!fillsByCoin[c]) fillsByCoin[c] = [];
    fillsByCoin[c].push(f);
  }

  if(!trades.length){
    dateEl.textContent = "No data";
    return;
  }

  let minT = Infinity;
  for(const t of trades) minT = Math.min(minT, t.entry_time);

  const startDay = dayFloorUTC(minT);
  const endDay   = dayFloorUTC(Date.now());

  for(let d=startDay; d<=endDay; d+=DAY) days.push(d);
  dayIndex = days.length - 1;

  updateDay();
}
await init();

// ---------------- per-day recompute ----------------
function computeBehavior(dayTrades, eff){
  let v = 0;
  for(const t of dayTrades){
    if(eff.limitTime && t.exit_time > eff.limitTime) break;
    const hold = (t.exit_time - t.entry_time)/60000;
    v += Math.max(-1, Math.min(1, hold - 160));
  }
  return Math.max(-1, Math.min(1, v/12));
}

function updateDay(){
  const d0 = days[dayIndex];
  const dayTrades = tradesForDay(d0);

  const exits = dayTrades.map(t=>t.exit_time).sort((a,b)=>a-b);
  efficiency = computeEfficiency(exits);

  arrowValue = computeBehavior(dayTrades, efficiency);
  frozen = !!efficiency.limitTime;

  dateEl.textContent = new Date(d0).toDateString();
}

// ---------------- input ----------------
canvas.addEventListener("pointerdown",e=>{
  isDown=true;
  startX=currentX=e.clientX;
  timeEl.style.opacity=1;
});

canvas.addEventListener("pointermove",e=>{
  currentX=e.clientX;
  const x=Math.max(0,Math.min(W,currentX));
  const t=days[dayIndex]+(x/W)*DAY;
  timeEl.textContent=formatTime(t);
  timeEl.style.left=x+"px";
});

canvas.addEventListener("pointerup",()=>{
  if(!isDown) return;
  const dx=currentX-startX;
  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0 && dayIndex>0) dayIndex--;
    if(dx<0 && dayIndex<days.length-1) dayIndex++;
    updateDay();
  }
  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

// ---------------- drawing ----------------
function drawAtom(t, d0){
  const d1 = d0 + DAY;

  const xEntry = ((Math.max(t.entry_time, d0) - d0) / DAY) * W;
  const xExit  = ((Math.min(t.exit_time,  d1) - d0) / DAY) * W;

  const y0 = H * 0.55;

  // BLUE (HOLD) : vertical only
  const holdMin = (t.exit_time - t.entry_time) / 60000;
  const blueLen = Math.max(8, Math.min(160, holdMin));
  const blueDir = t.dir === 1 ? -1 : 1; // long up, short down (screen y inverted)

  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(xEntry+0.5, y0);
  ctx.lineTo(xEntry+0.5, y0 + blueDir * blueLen);
  ctx.stroke();

  // CORE DOTS (entry + exit)
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.arc(xEntry+0.5, y0, 2.2, 0, Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(xExit+0.5, y0, 2.2, 0, Math.PI*2);
  ctx.fill();

  // GREEN (MARKET) : 8h after exit, vertical only, independent of trade dir
  if(t.exit_time>=d0 && t.exit_time<=d1){
    const WINDOW_MS = 8*60*60*1000;
    const endT = t.exit_time + WINDOW_MS;

    const coinFills = fillsByCoin[t.coin] || [];

    let p0 = t.exit_price;
    if(!Number.isFinite(p0)) p0 = t.entry_price;

    let maxUp = 0;
    let maxDn = 0;

    for(const f of coinFills){
      if(f.time <= t.exit_time) continue;
      if(f.time > endT) break;
      const p = Number(f.px);
      if(!Number.isFinite(p) || !Number.isFinite(p0) || p0<=0) continue;
      const r = (p - p0) / p0;
      if(r > maxUp) maxUp = r;
      if(r < maxDn) maxDn = r;
    }

    const move = Math.abs(maxUp) >= Math.abs(maxDn) ? maxUp : maxDn; // signed
    const SCALE = 800; // 1% => 8px
    const greenLen = Math.max(0, Math.min(220, Math.abs(move) * SCALE));

    if(greenLen > 0.5){
      const greenDir = move >= 0 ? -1 : 1; // up if market up
      ctx.strokeStyle="#2DBE60";
      ctx.beginPath();
      ctx.moveTo(xExit+0.5, y0);
      ctx.lineTo(xExit+0.5, y0 + greenDir * greenLen);
      ctx.stroke();
    }
  }
}

function render(){
  ctx.clearRect(0,0,W,H);

  const d0 = days[dayIndex];

  drawEfficiencyLayer(ctx,{
    dayStart:d0,
    dayEnd:d0+DAY,
    limitTime:efficiency.limitTime,
    width:W,
    height:H
  });

  for(const t of tradesForDay(d0)) drawAtom(t,d0);

  if(currentX!==null){
    const x=Math.max(0,Math.min(W,currentX));
    ctx.strokeStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.moveTo(x+0.5,0);
    ctx.lineTo(x+0.5,H);
    ctx.stroke();
  }

  drawBehaviorArrow(ctx,{
    value:arrowValue,
    frozen,
    width:W,
    height:H
  });

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
