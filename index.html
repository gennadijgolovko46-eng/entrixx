<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 14px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");

dateEl.textContent = new Date().toDateString();

let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* atom constants */
const ATOM_SIZE = 2;
const TAIL_WIDTH = 1.2;
const MIN_BLUE = 2;
const MARKET_HEIGHT = 160;

const COLOR_BLUE = "#2F6BFF";
const COLOR_GREEN = "#2DBE60";
const COLOR_BLACK = "#000";
const COLOR_RED = "#D10000";

/* time helper */
function t(h,m){
  const d = new Date();
  d.setHours(h,m,0,0);
  return d.getTime();
}

/* trades crafted ONLY to trigger efficiency */
const trades = [
  { entry_time:t(9,0),  exit_time:t(9,10), liquidation:false, dir:1 },
  { entry_time:t(9,10), exit_time:t(9,20), liquidation:false, dir:1 },
  { entry_time:t(9,20), exit_time:t(9,30), liquidation:false, dir:1 },
  { entry_time:t(9,30), exit_time:t(9,40), liquidation:false, dir:1 },
  { entry_time:t(9,40), exit_time:t(9,50), liquidation:false, dir:1 },

  { entry_time:t(9,50), exit_time:t(9,51), liquidation:false, dir:-1 },
  { entry_time:t(9,51), exit_time:t(10,30), liquidation:false, dir:1 },
  { entry_time:t(10,30),exit_time:t(10,31), liquidation:false, dir:-1 }
];

const dayStart = new Date();
dayStart.setHours(0,0,0,0);
const DAY_START_MS = dayStart.getTime();

function timeToX(t) {
  return ((t - DAY_START_MS) / (Date.now() - DAY_START_MS)) * W;
}

/* efficiency */
const exitTimes = trades.map(t=>t.exit_time);
const efficiency = computeEfficiency(exitTimes);

/* atom draw (NO triple tails possible) */
function drawAtom(x,y,t){
  const top = y - ATOM_SIZE/2;
  const bottom = y + ATOM_SIZE/2;

  ctx.lineWidth = TAIL_WIDTH;

  // market tail
  ctx.strokeStyle = COLOR_GREEN;
  ctx.beginPath();
  ctx.moveTo(x+ATOM_SIZE/2, t.dir<0?bottom:top);
  ctx.lineTo(x+ATOM_SIZE/2, t.dir<0?bottom+MARKET_HEIGHT:top-MARKET_HEIGHT);
  ctx.stroke();

  // hold tail (exactly one)
  const hold = Math.max(
    MIN_BLUE,
    Math.min(Math.round((t.exit_time - t.entry_time)/60000), 480)
  );
  ctx.strokeStyle = COLOR_BLUE;
  ctx.beginPath();
  ctx.moveTo(x-ATOM_SIZE/2, t.dir<0?bottom:top);
  ctx.lineTo(x-ATOM_SIZE/2, t.dir<0?bottom+hold:top-hold);
  ctx.stroke();

  ctx.fillStyle = COLOR_BLACK;
  ctx.fillRect(x-ATOM_SIZE/2,y-ATOM_SIZE/2,ATOM_SIZE,ATOM_SIZE);
}

function render(){
  ctx.clearRect(0,0,W,H);

  drawEfficiencyLayer(ctx,{
    dayStart:DAY_START_MS,
    dayEnd:Date.now(),
    limitTime:efficiency.limitTime,
    width:W,
    height:H
  });

  const baseY = H * 0.55;

  for(const tr of trades){
    ctx.globalAlpha =
      efficiency.limitTime && tr.exit_time > efficiency.limitTime
        ? 0.25
        : 1;
    drawAtom(timeToX(tr.entry_time), baseY, tr);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
