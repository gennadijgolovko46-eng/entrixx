<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTRIXX</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block;touch-action:none}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45)
}
#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";
import { loadTradesFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;
const SWIPE_PX = 50;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

let trades=[], days=[], dayIndex=0;
let efficiency={limitTime:null};
let arrowValue=0, frozen=false;

let startX=null, currentX=null, isDown=false;

dateEl.textContent="Loading…";

/* ===== UTC DAY FLOOR ===== */
function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

async function init(){
  trades = await loadTradesFromHyperliquid(ACCOUNT);
  if(!trades.length){
    dateEl.textContent="No trades";
    return;
  }

  let minT=Infinity;
  for(const t of trades){
    minT=Math.min(minT,t.entry_time,t.exit_time);
  }

  // ===== FIXED MODEL =====
  // Start = first activity (UTC day)
  // End   = TODAY (UTC day)
  const startDay = dayFloorUTC(minT);
  const endDay   = dayFloorUTC(Date.now());

  days=[];
  for(let d=startDay; d<=endDay; d+=DAY){
    days.push(d);
  }
  dayIndex = days.length-1;

  const exits = trades.map(t=>t.exit_time).sort((a,b)=>a-b);
  efficiency = computeEfficiency(exits);

  let B=0;
  for(const t of trades){
    if(efficiency.limitTime && t.exit_time>efficiency.limitTime){
      frozen=true;
      break;
    }
    const hold=(t.exit_time-t.entry_time)/60000;
    B+=Math.max(-1,Math.min(1,hold-160));
  }
  arrowValue=Math.max(-1,Math.min(1,B/12));

  updateDate();
}
await init();

/* ===== UI ===== */
function updateDate(){
  dateEl.textContent = new Date(days[dayIndex]).toDateString();
}

function tradesForDay(){
  const d0=days[dayIndex];
  const d1=d0+DAY;
  return trades.filter(t=>t.entry_time<d1 && t.exit_time>d0);
}

function timeToX(t){
  return ((t-days[dayIndex])/DAY)*W;
}

/* ===== DRAW ===== */
function drawAtom(x,y,t){
  ctx.strokeStyle="#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x+1,y);
  ctx.lineTo(x+1,y+(t.dir<0?160:-160));
  ctx.stroke();

  const h=(t.exit_time-t.entry_time)/60000;
  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x-1,y);
  ctx.lineTo(x-1,y+(t.dir<0?h:-h));
  ctx.stroke();

  ctx.fillStyle="#000";
  ctx.fillRect(x-1,y-1,2,2);
}

/* ===== INPUT ===== */
function endSwipe(){
  const dx=currentX-startX;
  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0) dayIndex=Math.max(0,dayIndex-1);
    else dayIndex=Math.min(days.length-1,dayIndex+1);
    updateDate();
  }
  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
}

function updateTime(x){
  const t = days[dayIndex] + (x/W)*DAY;
  const d = new Date(t);
  timeEl.textContent =
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0");
  timeEl.style.opacity=1;
}

canvas.addEventListener("pointerdown",e=>{
  isDown=true;
  startX=currentX=e.clientX;
});
canvas.addEventListener("pointermove",e=>{
  if(!isDown) return;
  currentX=e.clientX;
  updateTime(Math.max(0,Math.min(W,currentX)));
});
canvas.addEventListener("pointerup",()=>{ if(isDown) endSwipe(); });
canvas.addEventListener("pointercancel",()=>{ if(isDown) endSwipe(); });

/* ===== RENDER ===== */
function render(){
  ctx.clearRect(0,0,W,H);

  const d0=days[dayIndex];
  drawEfficiencyLayer(ctx,{
    dayStart:d0,
    dayEnd:d0+DAY,
    limitTime:efficiency.limitTime,
    width:W,
    height:H
  });

  const baseY=H*0.55;
  for(const t of tradesForDay()){
    drawAtom(timeToX(t.entry_time),baseY,t);
  }

  drawBehaviorArrow(ctx,{
    value:arrowValue,
    frozen,
    width:W,
    height:H
  });

  if(isDown && currentX!==null){
    const x=Math.max(0,Math.min(W,currentX));
    ctx.strokeStyle="rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.moveTo(x+0.5,0);
    ctx.lineTo(x+0.5,H);
    ctx.stroke();
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
