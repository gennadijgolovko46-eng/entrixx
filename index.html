<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
}

canvas {
  display: block;
  touch-action: none;
}

#date {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  pointer-events: none;
  opacity: 0;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

const now = new Date();
dateEl.textContent = now.toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

let viewW = 0;
let viewH = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  viewW = window.innerWidth;
  viewH = window.innerHeight;

  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  canvas.style.width = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

let touchX = null;

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  touchX = e.clientX;
});

canvas.addEventListener("pointermove", e => {
  e.preventDefault();
  if (touchX !== null) touchX = e.clientX;
});

canvas.addEventListener("pointerup", e => {
  e.preventDefault();
  touchX = null;
});

canvas.addEventListener("pointercancel", e => {
  e.preventDefault();
  touchX = null;
});

function xToTime(x) {
  const m = Math.round((x / viewW) * 1440);
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
}

const ATOM_SIZE = 3;
const TAIL_W = 1;

const HOLD_COLOR = "#2F6BFF";
const MARKET_COLOR = "#2DBE60";
const ATOM_COLOR = "#000";

const atoms = [
  { x: 0.48, hold: 60,  market: 140 },
  { x: 0.49, hold: 30,  market: 90  },
  { x: 0.50, hold: 80,  market: 160 },
  { x: 0.51, hold: 20,  market: 70  },
  { x: 0.52, hold: 50,  market: 120 }
];

function drawAtom(a) {
  const x = a.x * viewW;
  const y = viewH * 0.5;

  const top = y - ATOM_SIZE / 2;

  ctx.lineWidth = TAIL_W;

  ctx.strokeStyle = HOLD_COLOR;
  ctx.beginPath();
  ctx.moveTo(x - 2, top);
  ctx.lineTo(x - 2, top - a.hold);
  ctx.stroke();

  ctx.strokeStyle = MARKET_COLOR;
  ctx.beginPath();
  ctx.moveTo(x + 2, top);
  ctx.lineTo(x + 2, top - a.market);
  ctx.stroke();

  ctx.fillStyle = ATOM_COLOR;
  ctx.fillRect(
    x - ATOM_SIZE / 2,
    y - ATOM_SIZE / 2,
    ATOM_SIZE,
    ATOM_SIZE
  );
}

function drawTime() {
  if (touchX === null) {
    timeEl.style.opacity = 0;
    return;
  }

  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(touchX, 0);
  ctx.lineTo(touchX, viewH);
  ctx.stroke();

  timeEl.textContent = xToTime(touchX);
  timeEl.style.opacity = 1;
}

function render() {
  ctx.clearRect(0, 0, viewW, viewH);

  for (let i = 0; i < atoms.length; i++) {
    drawAtom(atoms[i]);
  }

  drawTime();
  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
