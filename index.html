<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  overflow: hidden;
}
canvas { display: block; }

#date {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  pointer-events: none;
  opacity: 0;
}

#back {
  position: fixed;
  left: 12px;
  bottom: 12px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.35);
  cursor: pointer;
  user-select: none;
}
#back:active {
  opacity: 0.6;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>
<div id="back">Back</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");
const backEl = document.getElementById("back");

/* Back (stub) */
backEl.onclick = () => {
  console.log("back");
};

/* Date */
dateEl.textContent = new Date().toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

/* Resize */
let viewW = 0, viewH = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width = viewW * dpr;
  canvas.height = viewH * dpr;
  canvas.style.width = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);
resize();

/* Touch → time */
let touchX = null;
canvas.addEventListener("pointerdown", e => touchX = e.clientX);
canvas.addEventListener("pointermove", e => { if (touchX!==null) touchX=e.clientX; });
canvas.addEventListener("pointerup", ()=>touchX=null);
canvas.addEventListener("pointerleave", ()=>touchX=null);

function xToTime(x){
  const m = Math.round((x/viewW)*1440);
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}

/* ===== ATOMS ===== */
const ATOM = 4;
const HOLD_COLOR = "#2F6BFF";
const MARKET_COLOR = "#2DBE60";

const atoms = [
  {x:0.46, hold:80,  market:120},
  {x:0.48, hold:40,  market:90},
  {x:0.50, liquidated:true},
  {x:0.52, hold:60,  market:110},
  {x:0.54, hold:30,  market:70}
];

function drawCross(x,y){
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x-4,y-4);
  ctx.lineTo(x+4,y+4);
  ctx.moveTo(x+4,y-4);
  ctx.lineTo(x-4,y+4);
  ctx.stroke();
}

function drawAtom(a){
  const x = a.x * viewW;
  const y = viewH * 0.5;

  if (a.liquidated){
    drawCross(x,y);
    return;
  }

  ctx.lineWidth = 1;

  if (a.hold){
    ctx.strokeStyle = HOLD_COLOR;
    ctx.beginPath();
    ctx.moveTo(x-ATOM,y);
    ctx.lineTo(x-ATOM,y-a.hold);
    ctx.stroke();
  }

  if (a.market){
    ctx.strokeStyle = MARKET_COLOR;
    ctx.beginPath();
    ctx.moveTo(x+ATOM,y);
    ctx.lineTo(x+ATOM,y-a.market);
    ctx.stroke();
  }

  ctx.fillStyle="#000";
  ctx.fillRect(x-ATOM/2,y-ATOM/2,ATOM,ATOM);
}

/* Render */
function render(){
  ctx.clearRect(0,0,viewW,viewH);

  atoms.forEach(drawAtom);

  if (touchX!==null){
    ctx.strokeStyle="rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.moveTo(touchX,0);
    ctx.lineTo(touchX,viewH);
    ctx.stroke();
    timeEl.textContent = xToTime(touchX);
    timeEl.style.opacity=1;
  } else {
    timeEl.style.opacity=0;
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
