<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTRIXX — UI V1</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block;touch-action:none}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45)
}
#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { loadDataFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;
const SWIPE_PX = 60;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

// ----- DATA STATE -----
let fills=[];
let trades=[];
let days=[];
let dayIndex=0;

// ----- INPUT STATE -----
let isDown=false;
let startX=0;
let currentX=null;

// ----- HELPERS -----
function dayFloorUTC(t){
  const d=new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

function timeToX(t){
  return ((t-days[dayIndex])/DAY)*W;
}

function updateDate(){
  dateEl.textContent=new Date(days[dayIndex]).toDateString();
}

// ----- INIT -----
async function init(){
  const data=await loadDataFromHyperliquid(ACCOUNT);
  fills=data.fills;
  trades=data.trades;

  if(!fills.length){
    dateEl.textContent="No data";
    return;
  }

  let minT=Infinity;
  for(const f of fills) minT=Math.min(minT,f.time);

  const startDay=dayFloorUTC(minT);
  const endDay=dayFloorUTC(Date.now());

  for(let d=startDay;d<=endDay;d+=DAY) days.push(d);
  dayIndex=days.length-1;

  updateDate();
}
await init();

// ----- FILTER -----
function tradesForDay(){
  const d0=days[dayIndex];
  const d1=d0+DAY;
  return trades.filter(t=>t.entry_time>=d0 && t.entry_time<d1);
}

// ----- DRAW ATOM (VERTICAL MODEL) -----
function drawAtom(t){
  const x=timeToX(t.entry_time);
  const baseY=H*0.55;

  const holdMin=(t.exit_time-t.entry_time)/60000;
  const MAX_HOLD=360;
  const HOLD_PX=120;
  const h=Math.min(holdMin,MAX_HOLD)/MAX_HOLD*HOLD_PX;

  const dir=t.dir<0?1:-1;

  // blue hold
  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x,baseY);
  ctx.lineTo(x,baseY+dir*h);
  ctx.stroke();

  // green tail
  ctx.strokeStyle="#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x,baseY);
  ctx.lineTo(x,baseY+dir*160);
  ctx.stroke();

  // entry dot
  ctx.fillStyle="#000";
  ctx.fillRect(x-1,baseY-1,2,2);
}

// ----- INPUT -----
canvas.addEventListener("pointerdown",e=>{
  isDown=true;
  startX=e.clientX;
  currentX=e.clientX;
});

canvas.addEventListener("pointermove",e=>{
  currentX=e.clientX;

  const t=days[dayIndex]+(currentX/W)*DAY;
  const d=new Date(t);
  timeEl.textContent=
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0");
  timeEl.style.opacity=1;
});

canvas.addEventListener("pointerup",e=>{
  if(!isDown) return;
  const dx=e.clientX-startX;

  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0) dayIndex=Math.max(0,dayIndex-1);
    else dayIndex=Math.min(days.length-1,dayIndex+1);
    updateDate();
  }

  isDown=false;
  currentX=null;
  timeEl.style.opacity=0;
});

canvas.addEventListener("pointerleave",()=>{
  isDown=false;
  currentX=null;
  timeEl.style.opacity=0;
});

// ----- RENDER -----
function render(){
  ctx.clearRect(0,0,W,H);

  for(const t of tradesForDay()) drawAtom(t);

  if(currentX!==null){
    ctx.strokeStyle="rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.moveTo(currentX+0.5,0);
    ctx.lineTo(currentX+0.5,H);
    ctx.stroke();
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
