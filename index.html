<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas {
  display: block;
  touch-action: none;
}

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 14px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="time"></div>
<div id="date"></div>

<script type="module">
/* ===== canvas ===== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ===== date UTC ===== */
const DAY_MS = 86400000;
const now = new Date();
const todayUTC = Date.UTC(
  now.getUTCFullYear(),
  now.getUTCMonth(),
  now.getUTCDate()
);
let currentDayUTC = todayUTC;

function updateDate() {
  const d = new Date(currentDayUTC);
  dateEl.textContent = d.toUTCString().slice(0, 16);
}
updateDate();

/* ===== pointer time line ===== */
let touchX = null;

canvas.addEventListener("pointerdown", e => touchX = e.clientX);
canvas.addEventListener("pointermove", e => {
  if (touchX !== null) touchX = e.clientX;
});
canvas.addEventListener("pointerup", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});
canvas.addEventListener("pointerleave", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});

function xToTimeUTC(x) {
  const minutes = Math.round((x / W) * 1440);
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

/* ===== day paging ===== */
let startX = null;
canvas.addEventListener("pointerdown", e => startX = e.clientX);
canvas.addEventListener("pointerup", e => {
  if (startX === null) return;
  const dx = e.clientX - startX;
  startX = null;
  if (Math.abs(dx) < 40) return;

  if (dx > 0) {
    currentDayUTC -= DAY_MS;
  } else {
    currentDayUTC = Math.min(todayUTC, currentDayUTC + DAY_MS);
  }
  updateDate();
});

/* ===== atom constants ===== */
const ATOM_SIZE = 2;
const TAIL_WIDTH = 1.2;
const MIN_BLUE = 2;
const MARKET_HEIGHT = 160;

const COLOR_BLUE = "#2F6BFF";
const COLOR_GREEN = "#2DBE60";
const COLOR_BLACK = "#000";

/* ===== efficiency constants ===== */
const WINDOW = 6;
const THRESHOLD = 0.9;

/* ===== demo trades ===== */
function tUTC(h,m) {
  return currentDayUTC + (h * 60 + m) * 60000;
}

const trades = [
  { entry: tUTC(9,0),  exit: tUTC(9,10), dir: 1 },
  { entry: tUTC(9,10), exit: tUTC(9,20), dir: 1 },
  { entry: tUTC(9,20), exit: tUTC(9,30), dir: 1 },
  { entry: tUTC(9,30), exit: tUTC(9,40), dir: 1 },
  { entry: tUTC(9,40), exit: tUTC(9,50), dir: 1 },
  { entry: tUTC(9,50), exit: tUTC(9,51), dir: -1 },
  { entry: tUTC(9,51), exit: tUTC(10,30), dir: 1 },
  { entry: tUTC(10,30), exit: tUTC(10,31), dir: -1 }
];

/* ===== efficiency detection ===== */
function computeLimitTime(exits) {
  if (exits.length < WINDOW + 1) return null;
  const deltas = [];
  for (let i = 1; i < exits.length; i++) {
    deltas.push(exits[i] - exits[i - 1]);
  }
  for (let i = WINDOW - 1; i < deltas.length; i++) {
    const w = deltas.slice(i - WINDOW + 1, i + 1);
    const mu = w.reduce((a,b)=>a+b,0) / WINDOW;
    const sigma = Math.sqrt(
      w.reduce((s,v)=>s+(v-mu)*(v-mu),0) / WINDOW
    );
    const cv = sigma / mu;
    if (cv > THRESHOLD) return exits[i + 1];
  }
  return null;
}

const exitTimes = trades.map(t=>t.exit).sort((a,b)=>a-b);
const limitTime = computeLimitTime(exitTimes);

/* ===== behavior arrow ===== */
let B = 0;
let frozen = false;
for (const t of trades) {
  if (limitTime && t.exit > limitTime) {
    frozen = true;
    break;
  }
  const hold = (t.exit - t.entry) / 60000;
  const market = MARKET_HEIGHT;
  const delta = hold - market;
  B += Math.max(-1, Math.min(1, delta));
}

function drawBehaviorArrow() {
  const x = 16;
  const y = H * 0.5;
  const len = 48;
  const maxA = Math.PI / 4;
  const angle = Math.max(-maxA, Math.min(maxA, B / 12));

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.strokeStyle = frozen ? "rgba(0,0,0,0.25)" : "rgba(0,0,0,0.35)";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(len,0);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(len,0);
  ctx.lineTo(len-8,-3);
  ctx.moveTo(len,0);
  ctx.lineTo(len-8,3);
  ctx.stroke();

  ctx.restore();
}

/* ===== helpers ===== */
function timeToX(t) {
  return ((t - currentDayUTC) / DAY_MS) * W;
}

function drawAtom(x,y,t) {
  const top = y - 1;
  const bottom = y + 1;

  ctx.lineWidth = TAIL_WIDTH;

  ctx.strokeStyle = COLOR_GREEN;
  ctx.beginPath();
  ctx.moveTo(x+1, t.dir<0 ? bottom : top);
  ctx.lineTo(x+1, t.dir<0 ? bottom+MARKET_HEIGHT : top-MARKET_HEIGHT);
  ctx.stroke();

  const hold = Math.max(
    MIN_BLUE,
    Math.round((t.exit - t.entry) / 60000)
  );
  ctx.strokeStyle = COLOR_BLUE;
  ctx.beginPath();
  ctx.moveTo(x-1, t.dir<0 ? bottom : top);
  ctx.lineTo(x-1, t.dir<0 ? bottom+hold : top-hold);
  ctx.stroke();

  ctx.fillStyle = COLOR_BLACK;
  ctx.fillRect(x-1, y-1, 2, 2);
}

function drawTimeLine() {
  if (touchX === null) return;
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(touchX,0);
  ctx.lineTo(touchX,H);
  ctx.stroke();
  timeEl.textContent = xToTimeUTC(touchX);
  timeEl.style.opacity = 1;
}

/* ===== render ===== */
function render() {
  ctx.clearRect(0,0,W,H);

  const baseY = H * 0.55;
  for (const t of trades) {
    drawAtom(timeToX(t.entry), baseY, t);
  }

  drawBehaviorArrow();
  drawTimeLine();
  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
