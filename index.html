<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}

canvas {
  display: block;
}

#date {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  pointer-events: none;
  opacity: 0;
}

#back {
  position: fixed;
  bottom: 8px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>
<div id="back">Back</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

const d = new Date();
dateEl.textContent = d.toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

let pointerX = null;

canvas.addEventListener("pointerdown", e => pointerX = e.clientX);
canvas.addEventListener("pointermove", e => {
  if (pointerX !== null) pointerX = e.clientX;
});
canvas.addEventListener("pointerup", () => pointerX = null);
canvas.addEventListener("pointerleave", () => pointerX = null);

function xToTime(x) {
  const m = Math.round((x / W) * 1440);
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
}

/* ===== ATOM ===== */

const ATOM_SIZE = 6;
const MARKET_LEN = 220;
const HOLD_LEN = 90;

function drawAtom(x, y, liquidated = false) {
  // market
  ctx.strokeStyle = "#2DBE60";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, y - MARKET_LEN);
  ctx.stroke();

  // hold
  ctx.strokeStyle = "#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x - 3, y);
  ctx.lineTo(x - 3, y - HOLD_LEN);
  ctx.stroke();

  // square
  ctx.fillStyle = "#000";
  ctx.fillRect(
    x - ATOM_SIZE / 2,
    y - ATOM_SIZE / 2,
    ATOM_SIZE,
    ATOM_SIZE
  );

  if (liquidated) {
    ctx.strokeStyle = "#C00000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 6);
    ctx.lineTo(x + 6, y + 6);
    ctx.moveTo(x + 6, y - 6);
    ctx.lineTo(x - 6, y + 6);
    ctx.stroke();
  }
}

function drawTime() {
  if (pointerX === null) {
    timeEl.style.opacity = 0;
    return;
  }
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(pointerX, 0);
  ctx.lineTo(pointerX, H);
  ctx.stroke();

  timeEl.textContent = xToTime(pointerX);
  timeEl.style.opacity = 1;
}

function render() {
  ctx.clearRect(0, 0, W, H);

  const centerY = H * 0.55;
  const gap = 24;
  const startX = W * 0.5 - gap;

  drawAtom(startX, centerY, false);
  drawAtom(startX + gap, centerY, true);
  drawAtom(startX + gap * 2, centerY, false);

  drawTime();
  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
