<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; touch-action: none; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 14px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

/* date */
dateEl.textContent = new Date().toLocaleDateString("en-US", {
  weekday: "long",
  month: "short",
  day: "numeric",
  year: "numeric"
});

/* resize */
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* helpers */
function t(h,m){
  const d = new Date();
  d.setHours(h,m,0,0);
  return d.getTime();
}

/* trades */
const trades = [
  { entry_time: t(9, 0),  exit_time: t(9,10), dir: 1 },
  { entry_time: t(9,10), exit_time: t(9,20), dir: 1 },
  { entry_time: t(9,20), exit_time: t(9,30), dir: 1 },
  { entry_time: t(9,30), exit_time: t(9,40), dir: 1 },
  { entry_time: t(9,40), exit_time: t(9,50), dir: 1 },
  { entry_time: t(9,50), exit_time: t(9,51), dir:-1 },
  { entry_time: t(9,51), exit_time: t(10,30),dir: 1 },
  { entry_time: t(10,30),exit_time: t(10,31),dir:-1 }
];

/* efficiency */
const exitTimes = trades.map(t => t.exit_time).filter(Boolean).sort((a,b)=>a-b);
const efficiency = computeEfficiency(exitTimes);

/* === TIME WINDOW (FIXED) === */
const WINDOW_MS = 24 * 60 * 60 * 1000;
const ACCOUNT_START_MS = new Date("2022-01-01T00:00:00Z").getTime();

const lastTradeTime = Math.max(...exitTimes);
let viewEnd = lastTradeTime + WINDOW_MS * 0.1;
let viewStart = viewEnd - WINDOW_MS;

/* mapping */
function timeToX(t) {
  return ((t - viewStart) / (viewEnd - viewStart)) * W;
}

function xToTime(x) {
  const t = viewStart + (x / W) * (viewEnd - viewStart);
  const d = new Date(t);
  return String(d.getHours()).padStart(2,"0") + ":" +
         String(d.getMinutes()).padStart(2,"0");
}

/* drag */
let dragging = false;
let dragStartX = 0;
let dragViewStart = 0;

canvas.addEventListener("pointerdown", e => {
  dragging = true;
  dragStartX = e.clientX;
  dragViewStart = viewStart;
});

canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  const dt = -(dx / W) * WINDOW_MS;

  let nextStart = dragViewStart + dt;
  let nextEnd = nextStart + WINDOW_MS;

  if (nextStart < ACCOUNT_START_MS) {
    nextStart = ACCOUNT_START_MS;
    nextEnd = nextStart + WINDOW_MS;
  }

  viewStart = nextStart;
  viewEnd = nextEnd;
});

canvas.addEventListener("pointerup", () => dragging = false);
canvas.addEventListener("pointerleave", () => dragging = false);

/* atom drawing */
const ATOM_SIZE = 2;
const MARKET_HEIGHT = 160;

function drawAtom(x, y, tr) {
  ctx.lineWidth = 1.2;

  ctx.strokeStyle = "#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x+1, y);
  ctx.lineTo(x+1, y - MARKET_HEIGHT * tr.dir);
  ctx.stroke();

  ctx.strokeStyle = "#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x-1, y);
  ctx.lineTo(x-1, y - 20 * tr.dir);
  ctx.stroke();

  ctx.fillStyle = "#000";
  ctx.fillRect(x-1, y-1, 2, 2);
}

/* render */
function render() {
  ctx.clearRect(0,0,W,H);

  drawEfficiencyLayer(ctx,{
    dayStart: viewStart,
    dayEnd: viewEnd,
    limitTime: efficiency.limitTime,
    width: W,
    height: H
  });

  const baseY = H * 0.55;

  for (const tr of trades) {
    if (tr.exit_time < viewStart || tr.entry_time > viewEnd) continue;
    ctx.globalAlpha =
      efficiency.limitTime && tr.exit_time > efficiency.limitTime ? 0.25 : 1;
    drawAtom(timeToX(tr.entry_time), baseY, tr);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
