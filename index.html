<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }

    #back {
      position: fixed;
      right: 16px;
      bottom: 16px;
      font-size: 12px;
      color: rgba(0,0,0,0.4);
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="layer1"></canvas>
    <canvas id="layer2"></canvas>
    <canvas id="layer3"></canvas>
  </div>

  <div id="back">back</div>

  <!-- LAYERS ONLY -->
  <script src="layer-atoms.js"></script>
  <script src="layer-behavior.js"></script>
  <script src="layer-density.js"></script>
</body>
</html>
