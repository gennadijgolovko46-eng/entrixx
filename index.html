<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: system-ui, sans-serif;
      color: #000;
    }

    .wrap {
      padding: 24px 16px;
    }

    .row {
      padding: 12px 0;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row:hover {
      background: rgba(0,0,0,0.03);
    }

    .you {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="row" onclick="openMirror(17)">
      <div>#0017</div>
      <div class="you">you</div>
    </div>

    <div class="row" onclick="openMirror(42)">
      <div>#0042</div>
    </div>

    <div class="row" onclick="openMirror(89)">
      <div>#0089</div>
    </div>

    <div class="row" onclick="openMirror(104)">
      <div>#0104</div>
    </div>

    <div class="row" onclick="openMirror(256)">
      <div>#0256</div>
    </div>

  </div>

  <script>
    function openMirror(id) {
      window.location.href = `/mirror.html?id=${id}`;
    }
  </script>
</body>
</html>
