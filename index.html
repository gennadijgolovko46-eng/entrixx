<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ENTRIXX</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#fff}
canvas{display:block}
#date{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui;
  color:rgba(0,0,0,.45);
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="date"></div>

<script type="module">
import { loadDataFromHyperliquid } from "./trades_from_hyperliquid.js";

const DAY = 86400000;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");

let W,H;

function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

let trades = [];
let days = [];
let dayIndex = 0;

function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

function tradesForDay(d0){
  const d1 = d0 + DAY;
  return trades.filter(t => t.exit_time >= d0 && t.exit_time < d1);
}

function computeDayScale(dayTrades){
  let maxAbs = 0;
  for(const t of dayTrades){
    maxAbs = Math.max(
      maxAbs,
      Math.abs(t.HOLD_price),
      Math.abs(t.MARKET_price)
    );
  }
  return maxAbs || 1;
}

function drawAtom(t, d0, dayScale){
  const x = ((t.exit_time - d0) / DAY) * W;
  const y = H * 0.55;

  if(t.liquidated){
    ctx.strokeStyle="#D10000";
    ctx.beginPath();
    ctx.moveTo(x-6,y-6); ctx.lineTo(x+6,y+6);
    ctx.moveTo(x-6,y+6); ctx.lineTo(x+6,y-6);
    ctx.stroke();
    return;
  }

  const ATOM_H = 160;
  const EPS = 6;

  const blueLen  = Math.max(Math.abs(t.HOLD_price)/dayScale*ATOM_H, EPS);
  const greenLen = Math.abs(t.MARKET_price)/dayScale*ATOM_H;

  const dirBlue  = t.side==="B" ? -1 : 1;
  const dirGreen = Math.sign(t.MARKET_price);

  ctx.strokeStyle="#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x,y+dirBlue*blueLen);
  ctx.stroke();

  if(greenLen>0){
    ctx.strokeStyle="#2DBE60";
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x,y+dirGreen*greenLen);
    ctx.stroke();
  }

  ctx.fillStyle="#000";
  ctx.fillRect(x-2,y-2,4,4);
}

function render(){
  ctx.clearRect(0,0,W,H);

  const d0 = days[dayIndex];
  const dayTrades = tradesForDay(d0);
  const scale = computeDayScale(dayTrades);

  for(const t of dayTrades){
    drawAtom(t,d0,scale);
  }

  requestAnimationFrame(render);
}

(async ()=>{
  const data = await loadDataFromHyperliquid("ACCOUNT");
  trades = data.trades;

  let minT = Infinity;
  for(const t of trades) minT = Math.min(minT, t.exit_time);

  const start = dayFloorUTC(minT);
  const end   = dayFloorUTC(Date.now());

  for(let d=start; d<=end; d+=DAY) days.push(d);
  dayIndex = days.length-1;

  dateEl.textContent = new Date(days[dayIndex]).toDateString();
  render();
})();
</script>
</body>
</html>
