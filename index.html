<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; touch-action: none; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 14px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";
import { drawBehaviorArrow } from "./behaviorArrow.js";

/* canvas */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* time */
const DAY_MS = 86400000;
const now = new Date();
const todayUTC = Date.UTC(
  now.getUTCFullYear(),
  now.getUTCMonth(),
  now.getUTCDate()
);
let currentDayUTC = todayUTC;

function updateDate() {
  dateEl.textContent = new Date(currentDayUTC)
    .toUTCString()
    .slice(0, 16);
}
updateDate();

/* swipe paging */
let startX = null;
canvas.addEventListener("pointerdown", e => startX = e.clientX);
canvas.addEventListener("pointerup", e => {
  if (startX === null) return;
  const dx = e.clientX - startX;
  startX = null;
  if (Math.abs(dx) < 40) return;

  if (dx > 0) currentDayUTC -= DAY_MS;
  else currentDayUTC = Math.min(todayUTC, currentDayUTC + DAY_MS);

  updateDate();
});

/* pointer time */
let touchX = null;
canvas.addEventListener("pointerdown", e => touchX = e.clientX);
canvas.addEventListener("pointermove", e => {
  if (touchX !== null) touchX = e.clientX;
});
canvas.addEventListener("pointerup", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});

function xToTimeUTC(x) {
  const m = Math.round((x / W) * 1440);
  return String(Math.floor(m / 60)).padStart(2,"0") + ":" +
         String(m % 60).padStart(2,"0");
}

/* atoms */
const MARKET_HEIGHT = 160;
const COLOR_BLUE = "#2F6BFF";
const COLOR_GREEN = "#2DBE60";

function tUTC(h,m) {
  return currentDayUTC + (h * 60 + m) * 60000;
}

const trades = [
  { entry: tUTC(9,0),  exit: tUTC(9,10), dir: 1 },
  { entry: tUTC(9,10), exit: tUTC(9,20), dir: 1 },
  { entry: tUTC(9,20), exit: tUTC(9,30), dir: 1 },
  { entry: tUTC(9,30), exit: tUTC(9,40), dir: 1 },
  { entry: tUTC(9,40), exit: tUTC(9,50), dir: 1 },
  { entry: tUTC(9,50), exit: tUTC(9,51), dir: -1 },
  { entry: tUTC(9,51), exit: tUTC(10,30), dir: 1 },
  { entry: tUTC(10,30), exit: tUTC(10,31), dir: -1 }
];

function timeToX(t) {
  return ((t - currentDayUTC) / DAY_MS) * W;
}

function drawAtom(x,y,t) {
  ctx.lineWidth = 1.2;

  ctx.strokeStyle = COLOR_GREEN;
  ctx.beginPath();
  ctx.moveTo(x+1, y);
  ctx.lineTo(x+1, y - t.dir * MARKET_HEIGHT);
  ctx.stroke();

  const hold = Math.max(2, (t.exit - t.entry) / 60000);
  ctx.strokeStyle = COLOR_BLUE;
  ctx.beginPath();
  ctx.moveTo(x-1, y);
  ctx.lineTo(x-1, y - t.dir * hold);
  ctx.stroke();

  ctx.fillStyle = "#000";
  ctx.fillRect(x-1, y-1, 2, 2);
}

/* efficiency */
const exitTimes = trades.map(t=>t.exit).sort((a,b)=>a-b);
const efficiency = computeEfficiency(exitTimes);

/* behavior value */
let B = 0;
let frozen = false;
for (const t of trades) {
  if (efficiency.limitTime && t.exit > efficiency.limitTime) {
    frozen = true;
    break;
  }
  const delta = ((t.exit - t.entry) / 60000) - MARKET_HEIGHT;
  B += Math.max(-1, Math.min(1, delta));
}
const behaviorValue = B / 12;

/* render */
function render() {
  ctx.clearRect(0,0,W,H);

  drawEfficiencyLayer(ctx,{
    dayStart: currentDayUTC,
    dayEnd: currentDayUTC + DAY_MS,
    limitTime: efficiency.limitTime,
    width: W,
    height: H
  });

  const baseY = H * 0.55;
  for (const t of trades) {
    drawAtom(timeToX(t.entry), baseY, t);
  }

  drawBehaviorArrow(ctx,{
    width: W,
    height: H,
    value: behaviorValue,
    frozen
  });

  if (touchX !== null) {
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.moveTo(touchX,0);
    ctx.lineTo(touchX,H);
    ctx.stroke();
    timeEl.textContent = xToTimeUTC(touchX);
    timeEl.style.opacity = 1;
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
