<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #111;
    }

    .wrap {
      text-align: center;
      max-width: 320px;
      width: 100%;
      padding: 0 16px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 1px;
    }

    p.subtitle {
      margin: 12px 0 28px;
      font-size: 18px;
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    p.note {
      margin-top: 24px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <h1>ENTRIXX</h1>
    <p class="subtitle">Mirror of trading decisions</p>

    <button id="connectBtn">Connect Wallet</button>

    <p class="note">
      You can withdraw ENTRIXX at any time via the contract.
    </p>
  </div>

  <script>
    const btn = document.getElementById('connectBtn');

    let state = 'idle';
    // idle → ready → preparing

    btn.addEventListener('click', async () => {
      // 1. CONNECT (визуально)
      if (state === 'idle') {
        btn.textContent = 'Connecting…';
        btn.disabled = true;

        setTimeout(() => {
          btn.textContent = 'Deposit 1 ENTRIXX';
          btn.disabled = false;
          state = 'ready';
        }, 700);

        return;
      }

      // 2. PREPARE DEPOSIT (визуально)
      if (state === 'ready') {
        btn.textContent = 'Preparing deposit…';
        btn.disabled = true;
        state = 'preparing';

        setTimeout(() => {
          btn.textContent = 'Deposit 1 ENTRIXX';
          btn.disabled = false;
          state = 'ready';
        }, 1200);

        return;
      }
    });
  </script>

</body>
</html>
