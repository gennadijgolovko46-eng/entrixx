<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENTRIXX</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  overflow:hidden;
}
canvas{display:block;touch-action:none}
#date{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.45)
}
#time{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  font:12px system-ui,sans-serif;
  color:rgba(0,0,0,.9);
  opacity:0;
  pointer-events:none;
}
#debug{
  position:fixed;
  top:10px;
  left:10px;
  font:12px monospace;
  background:#fff;
  padding:8px;
  border-radius:6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.1);
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="time"></div>
<div id="date"></div>
<div id="debug"></div>

<script type="module">
import { loadDataFromHyperliquid } from "./trades_from_hyperliquid.js";

const ACCOUNT = "0x880ac484a1743862989a441d6d867238c7aa311c";
const DAY = 86400000;
const SWIPE_PX = 50;
const MARKET_WINDOW = 8 * 60 * 60 * 1000;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");
const debugEl = document.getElementById("debug");

let W=0,H=0;
function resize(){
  const dpr = devicePixelRatio || 1;
  W = innerWidth;
  H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

let trades = [];
let days = [];
let dayIndex = 0;

let startX=null, currentX=null, isDown=false;

function dayFloorUTC(t){
  const d = new Date(t);
  d.setUTCHours(0,0,0,0);
  return d.getTime();
}

function formatTime(t){
  const d = new Date(t);
  return String(d.getUTCHours()).padStart(2,"0")+":"+
         String(d.getUTCMinutes()).padStart(2,"0");
}

function tradesForDay(d0){
  const d1 = d0 + DAY;
  return trades.filter(t =>
    t.exit_time > d0 &&
    t.entry_time < d1
  );
}

async function init(){
  const data = await loadDataFromHyperliquid(ACCOUNT);
  trades = data.trades;

  if(!trades.length){
    dateEl.textContent = "No data";
    return;
  }

  let minT = Infinity;
  for(const t of trades) minT = Math.min(minT, t.entry_time);

  const startDay = dayFloorUTC(minT);
  const endDay   = dayFloorUTC(Date.now());

  for(let d=startDay; d<=endDay; d+=DAY) days.push(d);
  dayIndex = days.length - 1;

  updateDay();
}
await init();

let dayTrades = [];

function updateDay(){
  const d0 = days[dayIndex];
  dayTrades = tradesForDay(d0);
  dateEl.textContent = new Date(d0).toDateString();

  debugEl.innerHTML =
    "trades total: "+trades.length+"<br>"+
    "days total: "+days.length+"<br>"+
    "dayIndex: "+dayIndex+"<br>"+
    "dayTrades: "+dayTrades.length;
}

canvas.addEventListener("pointerdown",e=>{
  isDown=true;
  startX=currentX=e.clientX;
  timeEl.style.opacity=1;
});

canvas.addEventListener("pointermove",e=>{
  currentX=e.clientX;
  const x=Math.max(0,Math.min(W,currentX));
  const t=days[dayIndex]+(x/W)*DAY;
  timeEl.textContent=formatTime(t);
  timeEl.style.left=x+"px";
});

canvas.addEventListener("pointerup",()=>{
  if(!isDown) return;
  const dx=currentX-startX;
  if(Math.abs(dx)>SWIPE_PX){
    if(dx>0 && dayIndex>0) dayIndex--;
    if(dx<0 && dayIndex<days.length-1) dayIndex++;
    updateDay();
  }
  isDown=false;
  startX=currentX=null;
  timeEl.style.opacity=0;
});

function drawAtom(t, d0){
  const d1 = d0 + DAY;

  const x = ((t.exit_time-d0)/DAY)*W;
  const y = H*0.55;

  const holdMin = Math.max(1,(t.exit_time - t.entry_time)/60000);
  const holdPx = Math.min(160, holdMin);
  const dir = t.dir;

  const marketDir = t.marketDir || 0;
  const marketPx = t.marketPx || 0;

  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.arc(x,y,3,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#2F6BFF";
  ctx.lineWidth=1.8;
  ctx.beginPath();
  ctx.moveTo(x+1.5,y);
  ctx.lineTo(x+1.5,y+dir*holdPx);
  ctx.stroke();

  if(marketPx>0){
    ctx.strokeStyle="#2DBE60";
    ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(x-1.5,y);
    ctx.lineTo(x-1.5,y+marketDir*marketPx);
    ctx.stroke();
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  const d0 = days[dayIndex];

  for(const t of dayTrades){
    drawAtom(t,d0);
  }

  if(currentX!==null){
    const x=Math.max(0,Math.min(W,currentX));
    ctx.strokeStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.moveTo(x+0.5,0);
    ctx.lineTo(x+0.5,H);
    ctx.stroke();
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
