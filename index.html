<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Recovery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  overflow: hidden;
}
canvas {
  display: block;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// TEST ATOMS — GUARANTEED VISIBLE
const ATOM = 6;
const SCALE = 2;
const MIN = ATOM;

const atoms = [
  { x: 0.3, y: 0.5, hold: 2, market: 10 },
  { x: 0.35, y: 0.52, hold: 1, market: 8 },
  { x: 0.6, y: 0.5, hold: 3, market: 14 }
];

function tail(v) {
  if (v === 0) return 0;
  const t = Math.abs(v * SCALE);
  return Math.max(t, MIN) * Math.sign(v);
}

function drawAtom(a) {
  const x = a.x * canvas.width;
  const y = a.y * canvas.height;

  ctx.strokeStyle = "#2F6BFF";
  ctx.beginPath();
  ctx.moveTo(x - 2, y);
  ctx.lineTo(x - 2, y - tail(a.hold));
  ctx.stroke();

  ctx.strokeStyle = "#2DBE60";
  ctx.beginPath();
  ctx.moveTo(x + 2, y);
  ctx.lineTo(x + 2, y - tail(a.market));
  ctx.stroke();

  ctx.fillStyle = "#000";
  ctx.fillRect(x - ATOM/2, y - ATOM/2, ATOM, ATOM);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  atoms.forEach(drawAtom);
  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
