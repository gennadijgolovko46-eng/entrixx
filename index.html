<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow: hidden;
}
canvas { display: block; touch-action: none; }

#date {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
  pointer-events: none;
}

#back {
  position: fixed;
  bottom: 14px;
  left: 8px;
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.45);
}

#time {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font: 12px system-ui, sans-serif;
  color: rgba(0,0,0,0.9);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">Back</div>
<div id="time"></div>
<div id="date"></div>

<script type="module">
import { computeEfficiency, drawEfficiencyLayer } from "./efficiency.js";

/* canvas */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");

let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* utc day model */
const DAY_MS = 24 * 60 * 60 * 1000;

const todayUTC = (() => {
  const d = new Date();
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
})();

let currentDayUTC = todayUTC;
const MIN_DAY_UTC = 0;

function updateDateLabel() {
  const d = new Date(currentDayUTC);
  dateEl.textContent = d.toUTCString().slice(0, 16);
}
updateDateLabel();

/* pointer time line */
let touchX = null;

canvas.addEventListener("pointerdown", e => {
  touchX = e.clientX;
});

canvas.addEventListener("pointermove", e => {
  if (touchX !== null) touchX = e.clientX;
});

canvas.addEventListener("pointerup", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});

canvas.addEventListener("pointerleave", () => {
  touchX = null;
  timeEl.style.opacity = 0;
});

function xToTimeUTC(x) {
  const minutes = Math.round((x / W) * 1440);
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

/* day paging */
let startX = null;

canvas.addEventListener("pointerdown", e => {
  startX = e.clientX;
});

canvas.addEventListener("pointerup", e => {
  if (startX === null) return;
  const dx = e.clientX - startX;
  startX = null;

  if (Math.abs(dx) < 40) return;

  if (dx < 0) {
    const next = currentDayUTC - DAY_MS;
    if (next >= MIN_DAY_UTC) {
      currentDayUTC = next;
      updateDateLabel();
    }
  } else {
    const next = currentDayUTC + DAY_MS;
    if (next <= todayUTC) {
      currentDayUTC = next;
      updateDateLabel();
    }
  }
});

/* atom constants */
const ATOM_SIZE = 2;
const TAIL_WIDTH = 1.2;
const MIN_BLUE = 2;
const MARKET_HEIGHT = 160;

const COLOR_BLUE = "#2F6BFF";
const COLOR_GREEN = "#2DBE60";
const COLOR_BLACK = "#000";

/* demo trades for current day */
function tUTC(h, m) {
  return currentDayUTC + (h * 60 + m) * 60000;
}

const trades = [
  { entry_time: tUTC(9,0),  exit_time: tUTC(9,10), dir: 1 },
  { entry_time: tUTC(9,10), exit_time: tUTC(9,20), dir: 1 },
  { entry_time: tUTC(9,20), exit_time: tUTC(9,30), dir: 1 },
  { entry_time: tUTC(9,30), exit_time: tUTC(9,40), dir: 1 },
  { entry_time: tUTC(9,40), exit_time: tUTC(9,50), dir: 1 },
  { entry_time: tUTC(9,50), exit_time: tUTC(9,51), dir: -1 },
  { entry_time: tUTC(9,51), exit_time: tUTC(10,30), dir: 1 },
  { entry_time: tUTC(10,30), exit_time: tUTC(10,31), dir: -1 }
];

/* efficiency */
const exitTimes = trades.map(t => t.exit_time).sort((a,b)=>a-b);
const efficiency = computeEfficiency(exitTimes);

/* drawing */
function timeToX(t) {
  return ((t - currentDayUTC) / DAY_MS) * W;
}

function drawAtom(x, y, t) {
  const top = y - ATOM_SIZE/2;
  const bottom = y + ATOM_SIZE/2;

  ctx.lineWidth = TAIL_WIDTH;

  ctx.strokeStyle = COLOR_GREEN;
  ctx.beginPath();
  ctx.moveTo(x+1, t.dir < 0 ? bottom : top);
  ctx.lineTo(x+1, t.dir < 0 ? bottom + MARKET_HEIGHT : top - MARKET_HEIGHT);
  ctx.stroke();

  const hold = Math.max(
    MIN_BLUE,
    Math.round((t.exit_time - t.entry_time) / 60000)
  );

  ctx.strokeStyle = COLOR_BLUE;
  ctx.beginPath();
  ctx.moveTo(x-1, t.dir < 0 ? bottom : top);
  ctx.lineTo(x-1, t.dir < 0 ? bottom + hold : top - hold);
  ctx.stroke();

  ctx.fillStyle = COLOR_BLACK;
  ctx.fillRect(x-1, y-1, 2, 2);
}

function drawTimeLine() {
  if (touchX === null) return;
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(touchX, 0);
  ctx.lineTo(touchX, H);
  ctx.stroke();
  timeEl.textContent = xToTimeUTC(touchX);
  timeEl.style.opacity = 1;
}

/* render */
function render() {
  ctx.clearRect(0,0,W,H);

  drawEfficiencyLayer(ctx, {
    dayStart: currentDayUTC,
    dayEnd: currentDayUTC + DAY_MS,
    limitTime: efficiency.limitTime,
    width: W,
    height: H
  });

  const baseY = H * 0.55;
  for (const tr of trades) {
    drawAtom(timeToX(tr.entry_time), baseY, tr);
  }

  drawTimeLine();
  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
