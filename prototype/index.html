<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX — Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #wrap {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

    #time {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #000;
      opacity: 0.8;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="wrap">
  <canvas id="layer"></canvas>
</div>

<div id="time">—</div>

<script>
const canvas = document.getElementById('layer');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

let w, h;
let centerTime = Date.now();

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  render();
}
window.addEventListener('resize', resize);

function render() {
  ctx.clearRect(0, 0, w, h);

  // центральная линия
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.moveTo(w / 2, 0);
  ctx.lineTo(w / 2, h);
  ctx.stroke();
}

function onMove(x) {
  const delta = x - w / 2;
  const t = new Date(centerTime + delta * 60000);
  timeLabel.textContent = t.toUTCString().slice(0, 22);
}

canvas.addEventListener('pointerdown', e => {
  onMove(e.clientX);
});

canvas.addEventListener('pointermove', e => {
  if (e.buttons) onMove(e.clientX);
});

resize();
</script>

</body>
</html>
