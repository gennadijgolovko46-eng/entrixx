<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Density Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}
canvas {
  display: block;
}
#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-family: system-ui, sans-serif;
  font-size: 13px;
  color: rgba(0,0,0,0.45);
  cursor: pointer;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="back">back</div>

<script>
/* ===============================
   CANVAS
   =============================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = W * dpr;
  canvas.height = H * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ===============================
   DENSITY DATA
   =============================== */

const density = [
  { x: 0.30, value: 1 },
  { x: 0.35, value: 3 },
  { x: 0.40, value: 6 },
  { x: 0.45, value: 2 },
  { x: 0.50, value: 8 }
];

/* ===============================
   DRAW
   =============================== */

function drawDensity() {
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 4;

  density.forEach(d => {
    const x = d.x * W;
    const y0 = H * 0.7;
    const y1 = y0 - d.value * 20;

    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y1);
    ctx.stroke();
  });
}

/* ===============================
   RENDER
   =============================== */

function render() {
  ctx.clearRect(0, 0, W, H);
  drawDensity();
  requestAnimationFrame(render);
}

render();

/* ===============================
   NAV
   =============================== */

document.getElementById("back").onclick = () => {
  window.location.href = "/";
};
</script>

</body>
</html>
