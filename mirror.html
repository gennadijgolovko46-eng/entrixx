<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: rgba(0,0,0,0.5);
  font-family: system-ui, sans-serif;
}

#back {
  position: fixed;
  bottom: 16px;
  right: 16px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener('resize', resize);
resize();

setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

// ===== TEST DATA (V1) =====
const trades = [
  { y: 200, hold: 120, market: 180 },
  { y: 320, hold: -160, market: 90 },
  { y: 440, hold: 100, market: -140 }
];

// ===== DRAW =====
function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;

  // central axis
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  trades.forEach(t => drawTrade(cx, t.y, t.hold, t.market));
}

function drawTrade(x, y, hold, market) {
  const size = 8;

  // square (decision)
  ctx.fillStyle = '#000';
  ctx.fillRect(x - size / 2, y - size / 2, size, size);

  const offsetHold = -6;
  const offsetMarket = 6;

  // hold tail (blue)
  ctx.strokeStyle = '#2f6cff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + offsetHold, y);
  ctx.lineTo(x + offsetHold, y + hold);
  ctx.stroke();

  // market tail (green)
  ctx.strokeStyle = '#2fa36b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + offsetMarket, y);
  ctx.lineTo(x + offsetMarket, y + market);
  ctx.stroke();
}
</script>

</body>
</html>
