<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ===== CONFIG ===== */
const SQUARE_SIZE = 4;
const TAIL_WIDTH  = 2;
const TAIL_GAP    = 6;

/* ===== RESIZE ===== */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = document.documentElement.clientWidth;
  const h = document.documentElement.clientHeight;

  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ===== DRAW TAILS ===== */
function drawTails(x, y, tails) {
  if (!tails.length) return;

  const totalWidth =
    tails.length * TAIL_WIDTH +
    (tails.length - 1) * TAIL_GAP;

  const startX = x - totalWidth / 2 + TAIL_WIDTH / 2;

  tails.forEach((t, i) => {
    const tx = startX + i * (TAIL_WIDTH + TAIL_GAP);

    ctx.strokeStyle = t.color;
    ctx.lineWidth = TAIL_WIDTH;
    ctx.beginPath();
    ctx.moveTo(tx, y);
    ctx.lineTo(tx, y - t.len); // вверх / вниз
    ctx.stroke();
  });
}

/* ===== DRAW EVENT ===== */
function drawEvent(x, y, hold, market) {
  const tails = [];

  if (hold !== 0) {
    tails.push({ len: hold, color: '#2563eb' }); // синий — удержание
  }
  if (market !== 0) {
    tails.push({ len: market, color: '#16a34a' }); // зелёный — рынок
  }

  drawTails(x, y, tails);

  ctx.fillStyle = '#000';
  ctx.fillRect(
    x - SQUARE_SIZE / 2,
    y - SQUARE_SIZE / 2,
    SQUARE_SIZE,
    SQUARE_SIZE
  );
}

/* ===== DRAW ===== */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  const midY = h / 2;

  drawEvent(140, midY - 120, 140, -60);
  drawEvent(360, midY + 40, -180, -40);
  drawEvent(580, midY - 20, 120, 160);
}

/* ===== INIT ===== */
function init() {
  resize();
  draw();
}

window.addEventListener('resize', init);
requestAnimationFrame(init);
</script>

</body>
</html>
