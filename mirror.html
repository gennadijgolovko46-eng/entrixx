<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.5);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* hard size — no resize magic */
const W = window.innerWidth;
const H = window.innerHeight;
canvas.width = W;
canvas.height = H;

/* time */
document.getElementById('time').textContent = new Date().toUTCString();
setInterval(() => {
  document.getElementById('time').textContent = new Date().toUTCString();
}, 1000);

/* draw immediately */
draw();

function draw() {
  ctx.clearRect(0, 0, W, H);

  const cx = Math.floor(W / 2);
  const cy = Math.floor(H / 2);

  /* axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, H);
  ctx.stroke();

  /* demo trades */
  trade(cx, cy - 120,  1, 80, 120);
  trade(cx, cy,       -1, 60, 90);
  trade(cx, cy + 120,  1, 100, 70);
}

function trade(x, y, dir, hold, market) {
  const gap = 6;

  /* point */
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x, y, 4, 0, Math.PI * 2);
  ctx.fill();

  /* hold (blue) */
  ctx.strokeStyle = '#2f6fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - gap, y);
  ctx.lineTo(x - gap, y - dir * hold);
  ctx.stroke();

  /* market (green) */
  ctx.strokeStyle = '#2fa36b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + gap, y);
  ctx.lineTo(x + gap, y - dir * market);
  ctx.stroke();
}
</script>

</body>
</html>
