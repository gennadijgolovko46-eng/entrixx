<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX — Mirror</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }

    #time {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #000;
      opacity: 0.7;
      pointer-events: none;
    }

    #back {
      position: fixed;
      bottom: 18px;
      right: 18px;
      font-size: 13px;
      color: #000;
      opacity: 0.4;
      text-decoration: none;
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
/* ===============================
   ENTRIXX — MIRROR (STABLE CORE)
   =============================== */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

/* ===== RESIZE (MOBILE-SAFE) ===== */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener('resize', resize);
setTimeout(resize, 0);

/* ===== TIME ===== */
function updateTime() {
  timeLabel.textContent = new Date().toUTCString();
}
setInterval(updateTime, 1000);
updateTime();

/* ===== DRAW ===== */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const w = window.innerWidth;
  const h = window.innerHeight;
  const cx = w / 2;

  /* central time marker */
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  /* demo data — deliberately minimal */
  const points = [
    { y: h/2 - 40, hold: 30, miss: -60 },
    { y: h/2,       hold: 60, miss: 20  },
    { y: h/2 + 50,  hold: 20, miss: -30 }
  ];

  points.forEach(p => drawTrade(cx, p.y, p.hold, p.miss));
}

/* ===== TRADE GEOMETRY ===== */
function drawTrade(x, y, hold, miss) {
  /* entry point */
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();

  /* HOLD tail — solid (what YOU did) */
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, y - hold);
  ctx.stroke();

  /* MISS tail — dashed (what MARKET did) */
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, y - miss);
  ctx.stroke();
  ctx.setLineDash([]);
}
</script>

</body>
</html>
