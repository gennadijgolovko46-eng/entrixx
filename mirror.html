<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ===== VISUAL CONSTANTS ===== */
const SQUARE = 5;        // уменьшили квадрат
const TAIL_WIDTH = 1;    // хвосты тоньше
const TAIL_GAP = 4;      // зазор между хвостами
const EVENT_GAP_Y = 70;

/* ===== CANVAS ===== */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = document.documentElement.clientWidth;
  const h = document.documentElement.clientHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ===== DRAWING ===== */
function drawEvent(x, y, hold, market) {
  const tails = [];

  if (hold !== 0) {
    tails.push({ len: hold, color: '#2563eb' });   // blue
  }
  if (market !== 0) {
    tails.push({ len: market, color: '#16a34a' }); // green
  }

  drawTails(x, y, tails);

  // anchor square
  ctx.fillStyle = '#000';
  ctx.fillRect(
    x - SQUARE / 2,
    y - SQUARE / 2,
    SQUARE,
    SQUARE
  );
}

function drawTails(x, y, list) {
  if (!list.length) return;

  const totalWidth =
    list.length * TAIL_WIDTH +
    (list.length - 1) * TAIL_GAP;

  const startX = x - totalWidth / 2 + TAIL_WIDTH / 2;

  list.forEach((t, i) => {
    const tx = startX + i * (TAIL_WIDTH + TAIL_GAP);

    ctx.strokeStyle = t.color;
    ctx.lineWidth = TAIL_WIDTH;
    ctx.beginPath();
    ctx.moveTo(tx, y);
    ctx.lineTo(tx, y - t.len); // вверх / вниз по знаку
    ctx.stroke();
  });
}

/* ===== SCENE ===== */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const h = canvas.height / (window.devicePixelRatio || 1);
  const baseY = h / 2;

  drawEvent(140, baseY - EVENT_GAP_Y, 120, -60);
  drawEvent(340, baseY, -150, -40);
  drawEvent(560, baseY + EVENT_GAP_Y, 90, 130);
}

/* ===== INIT ===== */
function init() {
  resize();
  draw();
}

window.addEventListener('resize', init);
requestAnimationFrame(init);
</script>

</body>
</html>
