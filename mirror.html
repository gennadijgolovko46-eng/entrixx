<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ===== CONFIG ===== */
const SQUARE = 4;
const TAIL_WIDTH = 2;
const TAIL_OFFSET = 4;

/* ===== RESIZE ===== */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = document.documentElement.clientWidth;
  const h = document.documentElement.clientHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ===== DRAW EVENT ===== */
function drawEvent(x, y, hold, market) {

  // HOLD (blue)
  if (hold !== 0) {
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = TAIL_WIDTH;
    ctx.beginPath();
    ctx.moveTo(x - TAIL_OFFSET, y);
    ctx.lineTo(x - TAIL_OFFSET, y - hold);
    ctx.stroke();
  }

  // MARKET (green)
  if (market !== 0) {
    ctx.strokeStyle = '#16a34a';
    ctx.lineWidth = TAIL_WIDTH;
    ctx.beginPath();
    ctx.moveTo(x + TAIL_OFFSET, y);
    ctx.lineTo(x + TAIL_OFFSET, y - market);
    ctx.stroke();
  }

  // square (anchor)
  ctx.fillStyle = '#000';
  ctx.fillRect(
    x - SQUARE / 2,
    y - SQUARE / 2,
    SQUARE,
    SQUARE
  );
}

/* ===== DRAW ===== */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  const midY = h / 2;

  drawEvent(140, midY - 120, 160, -80);
  drawEvent(360, midY + 40, -200, -40);
  drawEvent(580, midY - 20, 120, 180);
}

/* ===== INIT ===== */
function init() {
  resize();
  draw();
}

window.addEventListener('resize', init);
requestAnimationFrame(init);
</script>

</body>
</html>
