<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror (anchor)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  right: 16px;
  bottom: 16px;
  font-family: system-ui, sans-serif;
  font-size: 13px;
  color: rgba(0,0,0,0.45);
  cursor: pointer;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="back">back</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---- TEST DATA (ANCHOR) ----
const atoms = [
  { x: 0.3, hold: 60, market: 90 },
  { x: 0.5, hold: 40, market: 70 },
  { x: 0.7, hold: 80, market: 110 }
];

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const baseY = canvas.height * 0.75;

  atoms.forEach(a => {
    const x = a.x * canvas.width;

    // HOLD (blue, left)
    ctx.strokeStyle = "rgba(40,90,255,0.45)";
    ctx.beginPath();
    ctx.moveTo(x - 4, baseY);
    ctx.lineTo(x - 4, baseY - a.hold);
    ctx.stroke();

    // MARKET (green, right)
    ctx.strokeStyle = "rgba(40,170,120,0.45)";
    ctx.beginPath();
    ctx.moveTo(x + 4, baseY);
    ctx.lineTo(x + 4, baseY - a.market);
    ctx.stroke();

    // BODY
    ctx.fillStyle = "#000";
    ctx.fillRect(x - 3, baseY - 3, 6, 6);
  });

  requestAnimationFrame(draw);
}

draw();

document.getElementById("back").onclick = () => {
  window.location.href = "/";
};
</script>

</body>
</html>
