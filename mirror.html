<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const SQUARE = 8;
const TAIL_WIDTH = 4;
const TAIL_GAP = 6;
const EVENT_GAP = 30;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = document.documentElement.clientWidth;
  const h = document.documentElement.clientHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawEvent(x, y, hold, market) {
  const tailsUp = [];
  const tailsDown = [];

  if (hold > 0) tailsUp.push({ len: hold, color: '#2563eb' });
  if (hold < 0) tailsDown.push({ len: hold, color: '#2563eb' });

  if (market > 0) tailsUp.push({ len: market, color: '#16a34a' });
  if (market < 0) tailsDown.push({ len: market, color: '#16a34a' });

  drawTails(x, y, tailsUp, -1);
  drawTails(x, y, tailsDown, 1);

  ctx.fillStyle = '#000';
  ctx.fillRect(x - SQUARE / 2, y - SQUARE / 2, SQUARE, SQUARE);

  const maxUp = tailsUp.length ? Math.max(...tailsUp.map(t => t.len)) : 0;
  const maxDown = tailsDown.length ? Math.min(...tailsDown.map(t => t.len)) : 0;

  return y + Math.max(Math.abs(maxUp), Math.abs(maxDown));
}

function drawTails(x, y, list, dir) {
  const startX = x - ((list.length - 1) * (TAIL_WIDTH + TAIL_GAP)) / 2;

  list.forEach((t, i) => {
    const tx = startX + i * (TAIL_WIDTH + TAIL_GAP);
    const ty = y + dir * (SQUARE / 2);

    ctx.strokeStyle = t.color;
    ctx.lineWidth = TAIL_WIDTH;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx, ty + t.len);
    ctx.stroke();
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const centerX = canvas.width / (window.devicePixelRatio || 1) / 2;
  let y = 80;

  y = drawEvent(centerX, y, 120, -80) + EVENT_GAP;
  y = drawEvent(centerX, y, -140, -60) + EVENT_GAP;
  y = drawEvent(centerX, y, 90, 100);
}

function init() {
  resizeCanvas();
  draw();
}

window.addEventListener('resize', () => {
  resizeCanvas();
  draw();
});

requestAnimationFrame(init);
</script>

</body>
</html>
