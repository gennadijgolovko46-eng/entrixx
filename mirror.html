<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  height: 100%;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

#wrap {
  position: relative;
  width: 100%;
  height: 100%;
}

canvas {
  position: absolute;
  inset: 0;
}

#back {
  position: fixed;
  right: 16px;
  bottom: 16px;
  font-size: 14px;
  color: #999;
}
</style>
</head>

<body>
<div id="wrap">
  <canvas id="c"></canvas>
</div>
<div id="back">back</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* ===== CONFIG V1 ===== */
const CENTER_X = canvas.width / 2;
const SQUARE_SIZE = 6;
const GAP_X = 6;
const LINE_WIDTH = 2;

/* ===== MOCK DATA (V1) =====
 direction:  1  = up
 direction: -1  = down
 hold: time tail
 market: market tail
*/
const events = [
  { y: -120, direction:  1, hold: 40, market: 80 },
  { y:    0, direction: -1, hold: 60, market: 30 },
  { y:  140, direction:  1, hold: 30, market: 70 }
];

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // center axis
  ctx.strokeStyle = "#e0e0e0";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();

  events.forEach(ev => {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2 + ev.y;

    /* ===== SQUARE (ANCHOR) ===== */
    ctx.fillStyle = "#000";
    ctx.fillRect(
      cx - SQUARE_SIZE / 2,
      cy - SQUARE_SIZE / 2,
      SQUARE_SIZE,
      SQUARE_SIZE
    );

    /* ===== HOLD TAIL (BLUE) ===== */
    ctx.strokeStyle = "#2f6fff";
    ctx.lineWidth = LINE_WIDTH;
    ctx.beginPath();
    ctx.moveTo(cx - GAP_X, cy);
    ctx.lineTo(
      cx - GAP_X,
      cy - ev.direction * ev.hold
    );
    ctx.stroke();

    /* ===== MARKET TAIL (GREEN) ===== */
    ctx.strokeStyle = "#1fa36b";
    ctx.beginPath();
    ctx.moveTo(cx + GAP_X, cy);
    ctx.lineTo(
      cx + GAP_X,
      cy - ev.direction * ev.market
    );
    ctx.stroke();
  });
}

draw();
</script>
</body>
</html>
