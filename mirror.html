<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Mirror v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.55);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
/* ===== CANVAS ===== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener('resize', resize);
resize();

/* ===== TIME ===== */
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* ===== DATA (v1 static) ===== */
/*
direction:  1  -> up
direction: -1  -> down
*/
const trades = [
  { yOffset: -120, direction:  1 },
  { yOffset:   0, direction: -1 },
  { yOffset:  120, direction:  1 }
];

/* ===== DRAW ===== */
function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = Math.floor(w / 2);

  /* central axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  trades.forEach(t => drawTrade(cx, Math.floor(h / 2 + t.yOffset), t.direction));
}

function drawTrade(cx, cy, dir) {
  const boxSize = 6;
  const tailGap = 6;

  const holdLen = 70 * dir;   // blue
  const marketLen = 100 * dir; // green

  /* anchor square */
  ctx.fillStyle = '#000';
  ctx.fillRect(
    cx - boxSize / 2,
    cy - boxSize / 2,
    boxSize,
    boxSize
  );

  /* hold tail (blue) */
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - tailGap, cy);
  ctx.lineTo(cx - tailGap, cy - holdLen);
  ctx.stroke();

  /* market tail (green) */
  ctx.strokeStyle = '#16a34a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + tailGap, cy);
  ctx.lineTo(cx + tailGap, cy - marketLen);
  ctx.stroke();
}
</script>

</body>
</html>
