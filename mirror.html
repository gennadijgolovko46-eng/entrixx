<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.5);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
/* ===== SETUP ===== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener('resize', resize);
resize();

/* ===== TIME ===== */
const timeLabel = document.getElementById('time');
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* ===== DEMO DATA ===== */
/*
direction:  1 = up (long)
direction: -1 = down (short)
*/
const trades = [
  { offsetY: -120, direction:  1, hold: 80, market: 120 },
  { offsetY:    0, direction: -1, hold: 60, market: 90  },
  { offsetY:  120, direction:  1, hold: 100, market: 70 }
];

/* ===== DRAW ===== */
function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  /* central axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  trades.forEach(t => {
    drawTrade(cx, cy + t.offsetY, t.direction, t.hold, t.market);
  });
}

function drawTrade(x, y, direction, holdLen, marketLen) {
  const gap = 6;

  /* point */
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x, y, 4, 0, Math.PI * 2);
  ctx.fill();

  /* hold tail (blue) */
  ctx.strokeStyle = '#2f6fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - gap, y);
  ctx.lineTo(x - gap, y - direction * holdLen);
  ctx.stroke();

  /* market tail (green) */
  ctx.strokeStyle = '#2fa36b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + gap, y);
  ctx.lineTo(x + gap, y - direction * marketLen);
  ctx.stroke();
}
</script>

</body>
</html>
