<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: rgba(0,0,0,0.5);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const timeLabel = document.getElementById("time");

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener("resize", resize);
resize();

/* time */
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* draw */
function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = Math.round(w / 2);
  const cy = Math.round(h / 2);

  /* axis */
  ctx.strokeStyle = "rgba(0,0,0,0.2)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  /* node */
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
  ctx.fill();

  /* holding time tail (blue) */
  ctx.strokeStyle = "#2f6fed";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy);
  ctx.lineTo(cx - 4, cy - 120);
  ctx.stroke();

  /* market tail (green) */
  ctx.strokeStyle = "#2fa36b";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + 4, cy);
  ctx.lineTo(cx + 4, cy - 180);
  ctx.stroke();
}
</script>

</body>
</html>
