<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.55);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

/* resize */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener('resize', resize);
resize();

/* time */
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* draw */
function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = Math.round(w / 2);

  /* central axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  /* demo decisions */
  const decisions = [
    { y: h / 2 - 120 },
    { y: h / 2 },
    { y: h / 2 + 120 }
  ];

  decisions.forEach(d => drawDecision(cx, d.y));
}

/* single decision primitive */
function drawDecision(x, y) {
  const gap = 6;
  const hold = 90;
  const market = 130;

  /* market tail (green) */
  ctx.strokeStyle = '#1fa463';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + gap, y - market);
  ctx.lineTo(x + gap, y + market);
  ctx.stroke();

  /* hold tail (blue) */
  ctx.strokeStyle = '#2f6fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - gap, y - hold);
  ctx.lineTo(x - gap, y + hold);
  ctx.stroke();

  /* decision point */
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(x, y, 4, 0, Math.PI * 2);
  ctx.fill();
}
</script>

</body>
</html>
