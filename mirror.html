<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX — Mirror V1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    canvas {
      display: block;
    }

    #back {
      position: fixed;
      right: 20px;
      bottom: 20px;
      font-size: 14px;
      color: #999;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back" onclick="history.back()">back</div>

<script>
/* ===============================
   ENTRIXX — MIRROR V1 (FIXED)
   =============================== */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ===== CONFIG ===== */
const AXIS_COLOR   = 'rgba(0,0,0,0.15)';
const HOLD_COLOR   = '#1f5cff';
const MARKET_COLOR = '#2fa36b';

const SQUARE_SIZE = 10;
const TAIL_WIDTH  = 3;
const TAIL_OFFSET = 6;

/* ===== RESIZE ===== */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener('resize', resize);
resize();

/* ===== DRAW ===== */
function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.clearRect(0, 0, w, h);

  const cx = Math.floor(w / 2);

  // axis
  ctx.strokeStyle = AXIS_COLOR;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  const events = [
    { y: h/2 - 160, dir: -1, hold: 80, market: 120 },
    { y: h/2,       dir:  1, hold: 120, market: 80  },
    { y: h/2 + 160, dir: -1, hold: 100, market: 100 }
  ];

  events.forEach(e =>
    drawEvent(cx, e.y, e.dir, e.hold, e.market)
  );
}

/* ===== EVENT ===== */
function drawEvent(cx, cy, dir, holdLen, marketLen) {

  // anchor square
  ctx.fillStyle = '#000';
  ctx.fillRect(
    cx - SQUARE_SIZE / 2,
    cy - SQUARE_SIZE / 2,
    SQUARE_SIZE,
    SQUARE_SIZE
  );

  ctx.lineWidth = TAIL_WIDTH;

  const edgeY = cy + dir * (SQUARE_SIZE / 2);

  // HOLD
  ctx.strokeStyle = HOLD_COLOR;
  ctx.beginPath();
  ctx.moveTo(cx - TAIL_OFFSET, edgeY);
  ctx.lineTo(cx - TAIL_OFFSET, edgeY + dir * holdLen);
  ctx.stroke();

  // MARKET
  ctx.strokeStyle = MARKET_COLOR;
  ctx.beginPath();
  ctx.moveTo(cx + TAIL_OFFSET, edgeY);
  ctx.lineTo(cx + TAIL_OFFSET, edgeY + dir * marketLen);
  ctx.stroke();
}
</script>

</body>
</html>
