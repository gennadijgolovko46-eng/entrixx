<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

canvas { display: block; }

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.55);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth;
  const h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);
resize();

/* time */
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* ===== DATA (пока тестовые) =====
direction:  1 = LONG, -1 = SHORT
hold:       length of blue tail
market:     length of green tail
*/
const trades = [
  { y: 0.4, direction:  1, hold: 70, market: 120 },
  { y: 0.5, direction: -1, hold: 60, market: 100 },
  { y: 0.6, direction:  1, hold: 40, market: 80 }
];

function draw() {
  const w = innerWidth;
  const h = innerHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;

  /* central axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  trades.forEach(t => {
    drawTrade(
      cx,
      h * t.y,
      t.direction,
      t.hold,
      t.market
    );
  });
}

function drawTrade(x, y, dir, holdLen, marketLen) {
  const gap = 6;               // separation between tails
  const sign = dir;            // 1 up, -1 down

  /* node */
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x, y, 3.5, 0, Math.PI * 2);
  ctx.fill();

  /* hold tail (blue) */
  ctx.strokeStyle = '#2f6fe4';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - gap, y);
  ctx.lineTo(x - gap, y - sign * holdLen);
  ctx.stroke();

  /* market tail (green) */
  ctx.strokeStyle = '#2fa36b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + gap, y);
  ctx.lineTo(x + gap, y - sign * marketLen);
  ctx.stroke();
}
</script>

</body>
</html>
