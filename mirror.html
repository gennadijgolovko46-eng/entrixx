<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX — MIRROR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    #wrap {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    #back {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>

<button id="back" onclick="history.back()">Back</button>

<div id="wrap">
  <canvas id="layer1"></canvas>
  <canvas id="layer2"></canvas>
  <canvas id="layer3"></canvas>
</div>
