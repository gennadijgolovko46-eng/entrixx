<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTRIXX DEBUG</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: red;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: yellow;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* BIG OBVIOUS SHAPES */
ctx.fillStyle = 'black';
ctx.fillRect(50, 50, 200, 200);

ctx.strokeStyle = 'blue';
ctx.lineWidth = 20;
ctx.beginPath();
ctx.moveTo(0, canvas.height / 2);
ctx.lineTo(canvas.width, canvas.height / 2);
ctx.stroke();

ctx.fillStyle = 'white';
ctx.font = '40px sans-serif';
ctx.fillText('DEBUG VISIBLE', 60, canvas.height - 60);
</script>

</body>
</html>
