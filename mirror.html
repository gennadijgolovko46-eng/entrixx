<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-family: system-ui, sans-serif;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener('resize', resize);
resize();

function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  const centerX = Math.floor(w / 2);

  /* axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(centerX, 0);
  ctx.lineTo(centerX, h);
  ctx.stroke();

  const gap = 120;
  const baseY = Math.floor(h / 2);

  const events = [
    baseY - gap,
    baseY,
    baseY + gap
  ];

  events.forEach(y => drawEvent(centerX, y));
}

function drawEvent(x, y) {
  const squareSize = 8;
  const tailGap = 6;

  const holdLength = 60;   // upward
  const marketLength = 90; // downward

  /* square */
  ctx.fillStyle = '#000000';
  ctx.fillRect(
    x - squareSize / 2,
    y - squareSize / 2,
    squareSize,
    squareSize
  );

  /* hold tail (up) */
  ctx.strokeStyle = '#1e5bd7';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y - squareSize / 2 - tailGap);
  ctx.lineTo(x, y - squareSize / 2 - tailGap - holdLength);
  ctx.stroke();

  /* market tail (down) */
  ctx.strokeStyle = '#1f9d55';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y + squareSize / 2 + tailGap);
  ctx.lineTo(x, y + squareSize / 2 + tailGap + marketLength);
  ctx.stroke();
}
</script>

</body>
</html>
