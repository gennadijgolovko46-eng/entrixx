<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX — MIRROR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    #wrap {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
    }

    #back {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      opacity: 0.4;
    }

    #time {
      position: fixed;
      top: 12px;
      left: 0;
      transform: translateX(-50%);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<button id="back" onclick="history.back()">Back</button>
<div id="time"></div>

<div id="wrap">
  <canvas id="layer1"></canvas>
  <canvas id="layer2"></canvas>
  <canvas id="layer3"></canvas>
</div>

<script src="mirror.js"></script>

</body>
</html>
