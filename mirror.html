<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const SQUARE = 8;
const TAIL_WIDTH = 4;
const TAIL_GAP = 6;
const EVENT_GAP_Y = 26;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = document.documentElement.clientWidth;
  const h = document.documentElement.clientHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawEvent(x, y, hold, market) {
  const tails = [];

  if (hold !== 0) {
    tails.push({ len: hold, color: '#2563eb' });
  }
  if (market !== 0) {
    tails.push({ len: market, color: '#16a34a' });
  }

  drawTails(x, y, tails);

  // квадрат — якорь события
  ctx.fillStyle = '#000';
  ctx.fillRect(
    x - SQUARE / 2,
    y - SQUARE / 2,
    SQUARE,
    SQUARE
  );
}

function drawTails(x, y, list) {
  const totalHeight =
    list.length * TAIL_WIDTH +
    (list.length - 1) * TAIL_GAP;

  const startY = y - totalHeight / 2 + TAIL_WIDTH / 2;

  list.forEach((t, i) => {
    const ty = startY + i * (TAIL_WIDTH + TAIL_GAP);

    ctx.strokeStyle = t.color;
    ctx.lineWidth = TAIL_WIDTH;
    ctx.beginPath();
    ctx.moveTo(x, ty);
    ctx.lineTo(x + t.len, ty); // ← ГОРИЗОНТАЛЬНО
    ctx.stroke();
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const centerY = canvas.height / (window.devicePixelRatio || 1) / 2;
  let y = centerY - EVENT_GAP_Y;

  // X = время
  drawEvent(120, y, 140, -90);
  y += EVENT_GAP_Y;

  drawEvent(320, y, -160, -80);
  y += EVENT_GAP_Y;

  drawEvent(520, y, 120, 110);
}

function init() {
  resize();
  draw();
}

window.addEventListener('resize', init);
requestAnimationFrame(init);
</script>

</body>
</html>
