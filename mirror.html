<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX — MIRROR (TEST)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
      font-family: monospace;
    }

    #wrap {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    #debug {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: red;
      font-size: 14px;
    }

    #back {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="debug">MIRROR LOADED</div>
<button id="back" onclick="history.back()">Back</button>

<div id="wrap">
  <canvas id="c"></canvas>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');

  function resize() {
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
  }

  resize();
  window.addEventListener('resize', resize);

  // TEST DRAW
  ctx.fillStyle = '#000';
  ctx.fillRect(50, 50, 200, 200);

  ctx.fillStyle = 'red';
  ctx.font = '20px monospace';
  ctx.fillText('CANVAS OK', 60, 90);
</script>

</body>
</html>
