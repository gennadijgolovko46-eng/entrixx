<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.55);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth;
  const h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener('resize', resize);
resize();

setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

const decisions = [
  { y: 0.35, dir:  1, hold: 60, market: 110 },
  { y: 0.50, dir: -1, hold: 80, market: 40  },
  { y: 0.65, dir:  1, hold: 30, market: 70  }
];

function draw() {
  const w = innerWidth;
  const h = innerHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;

  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  decisions.forEach(d => {
    drawDecision(cx, h * d.y, d.dir, d.hold, d.market);
  });
}

function drawDecision(x, y, dir, hold, market) {
  const offset = 6;

  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(x, y, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#2f6bff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - offset, y);
  ctx.lineTo(x - offset, y + dir * hold);
  ctx.stroke();

  ctx.strokeStyle = '#2fa36b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + offset, y);
  ctx.lineTo(x + offset, y + dir * market);
  ctx.stroke();
}
</script>

</body>
</html>
