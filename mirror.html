<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.6);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);
resize();

/* time */
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* draw */
function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0,0,w,h);

  const cx = w / 2;

  /* central axis */
  const grad = ctx.createLinearGradient(cx,0,cx,h);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(0.5,'rgba(0,0,0,0.25)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx,0);
  ctx.lineTo(cx,h);
  ctx.stroke();

  /* demo trades */
  const trades = [
    { y: h/2 - 70, take: -90, miss: 60 },
    { y: h/2,      take: -40, miss: 80 },
    { y: h/2 + 80, take: -120, miss: 30 }
  ];

  trades.forEach(t => drawTrade(cx, t.y, t.take, t.miss));
}

function drawTrade(x,y,take,miss) {
  /* node */
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x,y,4,0,Math.PI*2);
  ctx.fill();

  /* taken path */
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.bezierCurveTo(
    x - 30, y + take/2,
    x - 10, y + take,
    x,      y + take
  );
  ctx.stroke();

  /* missed path */
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.bezierCurveTo(
    x + 40, y + miss/2,
    x + 15, y + miss,
    x,      y + miss
  );
  ctx.stroke();
}
</script>

</body>
</html>
