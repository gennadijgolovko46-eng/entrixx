<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}
canvas { display: block; }

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: rgba(0,0,0,0.5);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth;
  const h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);
resize();

/* time */
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* ===== TEST DATA (INTENTIONALLY CLEAR) ===== */
const decisions = [
  { y: 0.28, dir:  1, hold: 90,  market: 140 },
  { y: 0.50, dir: -1, hold: 80,  market: 120 },
  { y: 0.72, dir:  1, hold: 130, market: 70  }
];

/* ===== DRAW ===== */
function draw() {
  const w = innerWidth;
  const h = innerHeight;
  ctx.clearRect(0,0,w,h);

  const cx = w / 2;

  /* axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  decisions.forEach(d => {
    drawDecision(cx, h * d.y, d.dir, d.hold, d.market);
  });
}

function drawDecision(x, y, dir, holdLen, marketLen) {
  const box = 8;          // square size
  const gap = 6;          // distance from square to tails
  const spacing = 7;      // distance between blue/green tails

  /* square (anchor) */
  ctx.fillStyle = '#000';
  ctx.fillRect(x - box/2, y - box/2, box, box);

  const startY = y + (dir === 1 ? -box/2 - gap : box/2 + gap);
  const sign = dir === 1 ? -1 : 1;

  /* hold (blue) */
  ctx.strokeStyle = '#2f6cff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - spacing, startY);
  ctx.lineTo(x - spacing, startY + sign * holdLen);
  ctx.stroke();

  /* market (green) */
  ctx.strokeStyle = '#1fa36b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + spacing, startY);
  ctx.lineTo(x + spacing, startY + sign * marketLen);
  ctx.stroke();
}
</script>

</body>
</html>
