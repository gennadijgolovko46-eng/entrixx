<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX — Mirror</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

#wrap {
  position: fixed;
  inset: 0;
}

canvas {
  position: absolute;
  inset: 0;
}

#center-line {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: rgba(0,0,0,0.12);
}

#time {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: #555;
}

#back {
  position: absolute;
  bottom: 16px;
  right: 16px;
  font-size: 14px;
  color: #777;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="wrap">
  <canvas id="layer"></canvas>
  <div id="center-line"></div>
  <div id="time"></div>
  <div id="back" onclick="history.back()">back</div>
</div>

<script>
const canvas = document.getElementById('layer');
const ctx = canvas.getContext('2d');
const timeEl = document.getElementById('time');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  draw();
}

window.addEventListener('resize', resize);
resize();

function updateTime() {
  timeEl.textContent = new Date().toUTCString();
}
setInterval(updateTime, 1000);
updateTime();

/*
  ПРОТОТИП СДЕЛОК
  y — смещение от центра
  taken — хвост, который ты взял
  missed — хвост, который рынок прошёл после
*/
const trades = [
  { y: -40, taken: 30, missed: 80 },
  { y: 20,  taken: -20, missed: -60 },
  { y: 90,  taken: 15, missed: 120 }
];

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000';
  ctx.fillStyle = '#000';

  trades.forEach(t => {
    const y = cy + t.y;

    // точка выхода
    ctx.beginPath();
    ctx.arc(cx, y, 3, 0, Math.PI * 2);
    ctx.fill();

    // хвост, который ты взял
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.lineTo(cx, y - t.taken);
    ctx.stroke();

    // хвост рынка (пунктир)
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(cx, y - t.taken);
    ctx.lineTo(cx, y - t.missed);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

draw();
</script>

</body>
</html>
