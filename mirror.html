<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.55);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth;
  const h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);
resize();

/* time */
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* draw */
function draw() {
  const w = innerWidth;
  const h = innerHeight;
  ctx.clearRect(0,0,w,h);

  const cx = w / 2;

  /* central axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  const points = [
    { y: h/2 - 80, a: -60, b: 40 },
    { y: h/2,      a: -30, b: 70 },
    { y: h/2 + 80, a: -90, b: 30 }
  ];

  points.forEach(p => drawTail(cx, p.y, p.a, p.b));
}

  /* node */
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x, y, 3.5, 0, Math.PI*2);
  ctx.fill();

  /* taken */
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(
    x + take * 0.4, y + take * 0.2,
    x + take * 0.6, y + take * 0.8,
    x, y + take
  );
