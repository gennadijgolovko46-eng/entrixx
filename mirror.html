<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENTRIXX — Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
}

canvas {
  display: block;
}

#time {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: rgba(0,0,0,0.5);
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="time"></div>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const timeLabel = document.getElementById('time');

/* ===== RESIZE ===== */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

/* ===== TIME ===== */
setInterval(() => {
  timeLabel.textContent = new Date().toUTCString();
}, 1000);

/* ===== DATA =====
dir:  1 = long, -1 = short
hold: holding duration (you)
market: market move after exit
*/
function getTrades(h) {
  return [
    { y: h * 0.35, dir:  1, hold: 70, market: 120 },
    { y: h * 0.50, dir: -1, hold: 60, market: -40 },
    { y: h * 0.65, dir:  1, hold: 40, market: -90 }
  ];
}

/* ===== DRAW ===== */
function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = Math.floor(w / 2);

  /* axis */
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, h);
  ctx.stroke();

  const trades = getTrades(h);
  trades.forEach(t => drawTrade(cx, t.y, t.dir, t.hold, t.market));
}

function drawTrade(cx, y, dir, hold, market) {
  const gap = 12;

  const youX = cx - gap;
  const mktX = cx + gap;

  /* YOU — holding time (blue) */
  ctx.strokeStyle = '#2f6df6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(youX, y);
  ctx.lineTo(youX, y - dir * hold);
  ctx.stroke();

  /* MARKET — after exit (green) */
  ctx.strokeStyle = '#2aa876';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mktX, y);
  ctx.lineTo(mktX, y - market);
  ctx.stroke();

  /* exit point */
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx, y, 3.5, 0, Math.PI * 2);
  ctx.fill();
}

resize();
</script>

</body>
</html>
