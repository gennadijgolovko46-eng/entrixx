<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX — Mirror</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #000;
    }

    .root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ===== TOP BAR ===== */
    .top {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .back {
      cursor: pointer;
      user-select: none;
    }

    /* ===== CANVAS ZONE ===== */
    .canvas-wrap {
      flex: 1;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* ===== CROSSHAIR ===== */
    .crosshair {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0,0,0,0.15);
      pointer-events: none;
      display: none;
    }

    /* ===== TIME LABEL ===== */
    .time-label {
      position: absolute;
      top: 8px;
      left: 0;
      transform: translateX(-50%);
      font-size: 12px;
      background: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #eee;
      white-space: nowrap;
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="root">

    <div class="top">
      <div class="back" onclick="goBack()">← Back</div>
    </div>

    <div class="canvas-wrap" id="wrap">
      <canvas id="layer1"></canvas>
      <canvas id="layer2"></canvas>
      <canvas id="layer3"></canvas>

      <div class="crosshair" id="crosshair"></div>
      <div class="time-label" id="timeLabel"></div>
    </div>

  </div>

  <script>
    const wrap = document.getElementById('wrap');
    const layers = [
      document.getElementById('layer1'),
      document.getElementById('layer2'),
      document.getElementById('layer3')
    ];

    const crosshair = document.getElementById('crosshair');
    const timeLabel = document.getElementById('timeLabel');

    function resize() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;

      layers.forEach(c => {
        c.width = w;
        c.height = h;
      });
    }

    window.addEventListener('resize', resize);
    resize();

    // ===== CROSSHAIR SYNC =====
    wrap.addEventListener('mousemove', (e) => {
      const rect = wrap.getBoundingClientRect();
      const x = e.clientX - rect.left;

      crosshair.style.left = x + 'px';
      crosshair.style.display = 'block';

      timeLabel.style.left = x + 'px';
      timeLabel.style.display = 'block';

      // ВРЕМЯ — как на Binance / TradingView (UTC)
      const now = new Date();
      timeLabel.textContent = now.toUTCString().slice(0, 22);
    });

    wrap.addEventListener('mouseleave', () => {
      crosshair.style.display = 'none';
      timeLabel.style.display = 'none';
    });

    function goBack() {
      window.location.href = '/';
    }
  </script>
</body>
</html>
