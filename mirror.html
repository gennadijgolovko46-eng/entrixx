<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-size: 13px;
  color: rgba(0,0,0,0.4);
  text-decoration: none;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<a id="back" href="/">back</a>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth;
  const h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

window.addEventListener('resize', resize);
resize();

/* ===== CONFIG ===== */
const CENTER_X = () => innerWidth / 2;
const SQUARE = 8;
const TAIL_WIDTH = 4;
const TAIL_GAP = 6;
const EVENT_GAP = 24;

/* ===== DEMO DATA ===== */
/*
hold, market:
positive  = up
negative  = down
*/
const events = [
  { hold: 80,  market: -120 },
  { hold: -140, market: -60 },
  { hold: 100, market: 90 }
];

function draw() {
  ctx.clearRect(0,0,innerWidth,innerHeight);

  let yCursor = 40;

  for (const e of events) {
    yCursor = drawEvent(CENTER_X(), yCursor, e) + EVENT_GAP;
  }
}

function drawEvent(x, y, e) {
  const tails = [];

  if (e.hold !== 0) {
    tails.push({ len: e.hold, color: '#2563eb' });
  }

  if (e.market !== 0) {
    tails.push({ len: e.market, color: '#16a34a' });
  }

  const up = tails.filter(t => t.len > 0);
  const down = tails.filter(t => t.len < 0);

  const maxUp = up.length ? Math.max(...up.map(t => t.len)) : 0;
  const maxDown = down.length ? Math.min(...down.map(t => t.len)) : 0;

  const blockTop = y - maxUp;
  const blockBottom = y - maxDown;

  drawSquare(x, y);

  drawTails(x, y, up, -1);
  drawTails(x, y, down, 1);

  return blockBottom;
}

function drawSquare(x, y) {
  ctx.fillStyle = '#000';
  ctx.fillRect(
    x - SQUARE / 2,
    y - SQUARE / 2,
    SQUARE,
    SQUARE
  );
}

function drawTails(x, y, list, dir) {
  const startX = x - ((list.length - 1) * (TAIL_WIDTH + TAIL_GAP)) / 2;

  list.forEach((t, i) => {
    const tx = startX + i * (TAIL_WIDTH + TAIL_GAP);
    const ty = y + (dir === -1 ? -SQUARE / 2 : SQUARE / 2);

    ctx.strokeStyle = t.color;
    ctx.lineWidth = TAIL_WIDTH;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx, ty + t.len);
    ctx.stroke();
  });
}
</script>

</body>
</html>
