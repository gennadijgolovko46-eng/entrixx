<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENTRIXX — Mirror</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

#wrap {
  position: fixed;
  inset: 0;
}

#center-line {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: rgba(0,0,0,0.12);
}

#time {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: #555;
}

#back {
  position: absolute;
  bottom: 16px;
  right: 16px;
  font-size: 14px;
  color: #777;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="center-line"></div>
  <div id="time"></div>
  <div id="back" onclick="history.back()">back</div>
</div>

<script>
const timeEl = document.getElementById('time');

function updateTime() {
  const now = new Date();
  timeEl.textContent = now.toUTCString();
}

updateTime();
setInterval(updateTime, 1000);
</script>

</body>
</html>
