<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ENTRIXX — Mirror</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    #wrap {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    #time {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      opacity: 0.6;
      pointer-events: none;
    }

    #back {
      position: fixed;
      right: 12px;
      bottom: 12px;
      font-size: 12px;
      opacity: 0.4;
      background: none;
      border: none;
    }
  </style>
</head>
<body>

<div id="wrap">
  <canvas id="layer1"></canvas>
  <canvas id="layer2"></canvas>
  <canvas id="layer3"></canvas>
</div>

<div id="time">loading…</div>
<button id="back" onclick="location.href='/'">back</button>

<script src="mirror.js"></script>
</body>
</html>
