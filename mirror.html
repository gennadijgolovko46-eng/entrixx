<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ENTRIXX — Mirror V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  overflow: hidden;
}

canvas {
  display: block;
}

#back {
  position: fixed;
  right: 16px;
  bottom: 16px;
  font-size: 14px;
  color: #888;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="back">back</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ===== CONFIG ===== */
const CENTER_Y = canvas.height / 2;
const STEP_X = 140;        // расстояние между сделками
const SQUARE = 6;
const TAIL_WIDTH = 1;
const TAIL_GAP = 4;

/* ===== DEMO DATA ===== */
const data = [
  { hold: 120, market: -60 },
  { hold: -160, market: -40 },
  { hold: 90, market: 130 },
];

/* ===== DRAW ===== */
ctx.clearRect(0, 0, canvas.width, canvas.height);

data.forEach((d, i) => {
  const x = 120 + i * STEP_X;
  const y = CENTER_Y;

  // square (anchor)
  ctx.fillStyle = '#000';
  ctx.fillRect(
    x - SQUARE / 2,
    y - SQUARE / 2,
    SQUARE,
    SQUARE
  );

  // tails
  let offsets = [];

  if (Math.sign(d.hold) === Math.sign(d.market)) {
    offsets = [-TAIL_GAP / 2, TAIL_GAP / 2];
  } else {
    offsets = [0, 0];
  }

  // hold (blue)
  ctx.strokeStyle = '#1e6bff';
  ctx.lineWidth = TAIL_WIDTH;
  ctx.beginPath();
  ctx.moveTo(x + offsets[0], y);
  ctx.lineTo(x + offsets[0], y - d.hold);
  ctx.stroke();

  // market (green)
  ctx.strokeStyle = '#1a9c4a';
  ctx.beginPath();
  ctx.moveTo(x + offsets[1], y);
  ctx.lineTo(x + offsets[1], y - d.market);
  ctx.stroke();
});
</script>

</body>
</html>
